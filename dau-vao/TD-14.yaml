nghien_cuu:
  van_ban: >-
    Điểm gây nhầm lẫn lớn nhất khi chỉnh tủ đông là núm xoay đánh số từ 1 tới 7
    không phải là thang nhiệt độ: nó điều chỉnh dải đóng ngắt của bộ ổn nhiệt,
    nên cùng một vị trí núm sẽ cho ra nhiệt độ khác nhau tuỳ nhiệt độ phòng,
    lượng hàng bên trong, số lần mở cửa và mức tuyết đang bám trên dàn. Hệ quả
    thực tế là không thể suy ra nhiệt độ trong tủ từ vị trí núm, và cách duy nhất
    biết được là đặt một nhiệt kế trong khoang rồi đọc sau khi tủ đã ổn định.
    Mốc tham chiếu được dùng rộng rãi cho bảo quản đông dài hạn là âm 18°C, trong
    khi quy định an toàn thực phẩm chỉ đặt yêu cầu là thực phẩm phải giữ đông
    cứng liên tục. Đặt lạnh hơn mức cần không mang lại thêm lợi ích bảo quản mà
    có hai cái giá: điện tiêu thụ tăng vì máy nén chạy dài hơn, và hiện tượng
    dịch chuyển ẩm trong khoang mạnh hơn nên hàng dễ bị khô bề mặt cùng lớp tuyết
    bám trên bao bì. Khối lượng hàng ảnh hưởng theo hai chiều ngược nhau: tủ đầy
    có quán tính nhiệt lớn nên giữ được nhiệt độ lâu hơn khi mất điện, nhưng cũng
    cần nhiều thời gian hơn để hạ nhiệt sau khi nạp hàng mới, và nạp một lượng
    lớn hàng còn ấm cùng lúc sẽ đẩy nhiệt độ cả khoang lên trong nhiều giờ. Kết
    cấu tủ cũng tạo khác biệt: tủ đông nằm giữ được khí lạnh khi mở nắp vì khí
    lạnh nặng hơn nên đọng lại trong khoang, còn tủ đứng mất khí lạnh mỗi lần mở
    cửa vì khí lạnh tràn ra theo cửa. Cuối cùng, lớp tuyết bám trên dàn lạnh làm
    thay đổi quan hệ giữa vị trí núm và nhiệt độ thực tế, nên sau mỗi lần xả
    tuyết cần đo lại thay vì giả định cài đặt cũ vẫn đúng, và bộ ổn nhiệt đọc
    nhiệt độ khí tại đúng chỗ nó được đặt nên con số đó không phải nhiệt độ của
    hàng hoá ở các vị trí khác trong tủ.
