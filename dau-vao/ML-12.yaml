nghien_cuu:
  van_ban: >-
    Môi chất lạnh trong máy lạnh nằm trong một hệ thống KÍN và không bị tiêu hao
    trong quá trình vận hành; nó chỉ tuần hoàn giữa dàn lạnh và dàn nóng, đổi
    trạng thái để mang nhiệt ra ngoài. Vì vậy một hệ thống kín còn nguyên vẹn
    thì không cần bổ sung môi chất theo lịch, và việc "nạp gas định kỳ" như một
    hạng mục bảo dưỡng thường kỳ không có cơ sở kỹ thuật. Nếu lượng môi chất
    giảm thì nghĩa là nó đã thoát ra ngoài qua một chỗ rò, và đó là một sự cố
    cần tìm và xử lý chứ không phải một mức hao hụt tự nhiên. Nạp thêm mà không
    xử lý chỗ rò dẫn tới ba hệ quả: lượng vừa nạp sẽ thoát tiếp, chi phí lặp lại
    theo chu kỳ ngày càng ngắn, và môi chất thoát ra môi trường. Quy định của
    US EPA theo Section 608 về xử lý môi chất lạnh cấm xả có chủ ý ra khí quyển
    và yêu cầu sửa chữa rò rỉ, cho thấy đây được nhìn nhận là vấn đề môi trường
    chứ không chỉ là vấn đề kỹ thuật. Các dấu hiệu gợi ý thiếu môi chất gồm: máy
    kém lạnh dần qua nhiều tuần dù đã vệ sinh lưới lọc và dàn; bám tuyết hoặc
    bám đá trên đường ống đồng hoặc trên một phần dàn lạnh; máy chạy liên tục
    không đạt nhiệt độ cài đặt; tiếng xì nhẹ; và vệt dầu quanh các mối nối, vì
    dầu bôi trơn đi cùng môi chất nên chỗ rò thường để lại vết dầu. Cần phân
    biệt các dấu hiệu này với nguyên nhân phổ biến hơn nhiều là dàn bẩn và lưới
    lọc tắc, vốn cũng làm máy kém lạnh và cũng có thể gây bám tuyết.
