nghien_cuu:
  van_ban: >-
    Yêu cầu lắp đặt máy sấy quần áo phụ thuộc trước hết vào kiểu máy, vì ba kiểu
    phổ biến xử lý hơi ẩm theo ba cách khác nhau. Máy thông hơi đẩy khí ẩm nóng
    ra ngoài qua một đường ống, nên bắt buộc phải có lối thoát ra không gian bên
    ngoài; đường ống cần càng ngắn và càng thẳng càng tốt, hạn chế khúc cua, và
    không được dài quá mức nhà sản xuất khuyến cáo vì mỗi khúc cua và mỗi mét
    ống đều làm giảm dòng khí. Xả khí ẩm nóng vào một phòng kín là cách tạo ẩm
    cho chính căn phòng đó và dẫn tới nấm mốc. Máy ngưng tụ và máy bơm nhiệt
    không cần đường ống vì nước ngưng được chứa vào bình hoặc dẫn ra đường thoát
    sàn, nhưng chúng thải nhiệt vào chính căn phòng đang đặt máy, nên phòng quá
    kín hoặc quá nóng sẽ làm thời gian sấy kéo dài. Về kết cấu, máy sấy cần đặt
    trên mặt sàn phẳng và cứng, kê cân bằng chân đế điều chỉnh được, vì lồng
    quay lệch là nguyên nhân rung và ồn thường gặp. Về khoảng cách, cần chừa khe
    hở phía sau và hai bên theo hướng dẫn, vừa để đường ống không bị gập vừa để
    máy lấy và thải khí được. Về điện, máy sấy có công suất lớn nên các hãng
    khuyến cáo dùng ổ cắm riêng có tiếp địa thay vì ổ chia hay dây nối dài; việc
    chọn aptomat và tiết diện dây thuộc phần việc của thợ điện. Với phòng giặt
    ẩm, thiết bị chống dòng rò là hạng mục nên có.
