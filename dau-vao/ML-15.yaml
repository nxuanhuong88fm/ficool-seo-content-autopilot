nghien_cuu:
  van_ban: >-
    Hút chân không là bước rút không khí và hơi ẩm ra khỏi đường ống và dàn lạnh
    trước khi mở van cho môi chất lạnh vào. Đây là yêu cầu kỹ thuật trong hướng
    dẫn lắp đặt của các nhà sản xuất điều hoà, không phải một tuỳ chọn nâng cao.
    Lý do: hệ thống lạnh là hệ kín được thiết kế chỉ chứa môi chất và dầu bôi
    trơn. Không khí lọt vào là khí không ngưng tụ, nó chiếm chỗ trong dàn ngưng
    làm áp suất phía cao áp tăng, hiệu suất giảm và block chịu tải nặng hơn. Hơi
    ẩm còn nguy hiểm hơn: nước phản ứng với dầu bôi trơn tạo axit ăn mòn các chi
    tiết bên trong, và ở van tiết lưu hơi ẩm có thể đóng băng gây tắc ẩm, làm
    máy chạy nhưng không lạnh theo chu kỳ khó chẩn đoán. Một cách làm tắt phổ
    biến là xả một ít môi chất ra để đẩy không khí ra ngoài, thường gọi là đuổi
    gió bằng gas. Cách này đẩy được phần lớn không khí nhưng không lấy được hơi
    ẩm, vì hơi ẩm chỉ bay hơi và bị hút ra khi áp suất xuống đủ thấp. Nó cũng xả
    môi chất ra môi trường. Về nghiệm thu, các điểm kiểm tra được bằng quan sát
    gồm: có bơm hút chân không tại hiện trường và có thực hiện hay không, đồng
    hồ áp suất khi thử kín, độ dốc liên tục của ống thoát nước ngưng, giá đỡ
    chắc chắn và cân bằng, bảo ôn kín toàn tuyến ống không hở đoạn nào, chạy thử
    đủ lâu và đo chênh lệch nhiệt độ giữa gió vào và gió ra ở dàn lạnh, kiểm tra
    nước thoát ra đúng đường ống, và bàn giao đủ phụ kiện cùng giấy tờ bảo hành.
