    mới, và có ghi lại nguyên nhân đã xử lý. Sau lắp đặt: giá đỡ chắc chắn và
    cân bằng, bảo ôn kín toàn tuyến, ống thoát dốc liên tục, đã hút chân không,
    chạy thử đủ lâu, đo chênh lệch nhiệt độ gió vào và gió ra, bàn giao đủ phụ
    kiện và giấy tờ bảo hành. Có ba phép kiểm chung cho cả ba loại và ai cũng
    làm được: chạy máy ít nhất 20 phút rồi sờ gió ra, quan sát nước thoát đúng
    chỗ, và nghe tiếng vận hành ở cả hai dàn. Về giấy tờ, nên có phiếu ghi rõ
    hạng mục đã làm và điều kiện bảo hành cho phần việc đó, vì bảo hành dịch vụ
    khác bảo hành thiết bị của hãng.
