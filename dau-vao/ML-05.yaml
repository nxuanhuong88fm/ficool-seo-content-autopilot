nghien_cuu:
  van_ban: >-
    Máy lạnh tự tắt hoặc tự ngắt block theo chu kỳ có ba nhóm nguyên nhân, và
    nhóm đầu tiên không phải hỏng hóc. Nhóm cài đặt: hẹn giờ tắt đang bật, chế
    độ Sleep tự nâng nhiệt độ sau vài giờ khiến máy đạt mốc và ngừng làm lạnh,
    hoặc nhiệt độ đặt quá gần nhiệt độ phòng làm block ngắt liên tục theo cảm
    biến. Đây là hành vi thiết kế chứ không phải lỗi. Nhóm quá nhiệt và bảo vệ:
    dàn nóng không thải được nhiệt do bị che chắn, quạt dàn nóng yếu, hoặc dàn
    ngưng bám bụi dày khiến áp suất phía cao áp tăng, rơ le bảo vệ ngắt block để
    tránh hỏng; đặc điểm nhận biết là máy chạy được một lúc rồi ngắt, nghỉ vài
    phút lại chạy, và chu kỳ lặp lại. Nhóm điện và linh kiện: điện áp không ổn
    định, tụ khởi động yếu, rơ le nhiệt hỏng, hoặc bo mạch lỗi; nhóm này thường
    kèm mã lỗi nhấp nháy trên đèn báo dàn lạnh. Việc đọc mã lỗi rất có giá trị
    vì mỗi hãng quy ước số lần nháy tương ứng nhóm lỗi, và thông tin đó rút ngắn
    quá trình chẩn đoán. Một tình huống riêng cần phân biệt: CB nhảy khác với
    máy tự tắt. CB nhảy là hệ thống điện của nhà ngắt, thường do quá tải hoặc
    chập, và không được bật lại nhiều lần. Máy tự tắt mà CB vẫn bật là chuyện
    bên trong máy. Người dùng tự kiểm tra được nhóm cài đặt và phần thông thoáng
    của dàn nóng; nhóm điện và linh kiện cần thợ.
