nghien_cuu:
  van_ban: >-
    Trên một chiếc máy giặt có nhiều bộ phận cùng được gọi là "bộ lọc" nhưng
    nằm ở ba vị trí khác nhau và phục vụ ba mục đích khác nhau, nên việc phân
    biệt chúng là điều kiện để vệ sinh đúng chỗ. Thứ nhất là lưới lọc ở đầu vào
    của van cấp nước, nằm tại chỗ nối ống nước vào máy; nó chặn cặn và mạt rỉ từ
    đường nước, và khi bám kín thì máy cấp nước chậm hoặc báo lỗi cấp nước. Thứ
    hai là bộ lọc xơ vải trên đường xả, thường đặt sau một nắp nhỏ ở góc dưới
    mặt trước với máy cửa trước, hoặc trong một túi lọc gắn trong lồng với nhiều
    máy cửa trên; nó giữ lại xơ vải, tóc và vật nhỏ trước khi nước đi vào bơm
    xả, và khi tắc thì máy xả chậm, còn đọng nước hoặc báo lỗi xả. Thứ ba là
    ngăn chứa nước giặt và nước xả, không phải bộ lọc nhưng cùng nhóm bảo trì,
    vì phần bột hoặc nước giặt dư đọng lại thành cặn nuôi vi sinh vật và gây
    mùi. Về thao tác, việc mở nắp bộ lọc bơm xả luôn kèm nước chảy ra do đường
    ống còn giữ nước, nên cần chuẩn bị khăn và khay hứng, và cần rút phích cắm
    trước; nhiều model có một ống xả phụ nhỏ đặt cạnh nắp dùng để tháo nước
    trước khi mở. Với lưới lọc đầu vào, cần khoá van cấp nước trước khi tháo ống.
    Về tần suất, các hãng khuyến cáo kiểm bộ lọc xơ vải định kỳ và nhất là sau
    khi giặt đồ nhiều xơ như chăn, khăn hoặc quần áo mới.
