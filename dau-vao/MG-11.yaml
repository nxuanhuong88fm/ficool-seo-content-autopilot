nghien_cuu:
  van_ban: >-
    Chu kỳ vệ sinh máy giặt không có một con số chung cho mọi nhà, vì nó phụ
    thuộc tần suất giặt, loại đồ giặt, nhiệt độ nước thường dùng, chất lượng
    nguồn nước và môi trường đặt máy. Các mốc tham khảo phổ biến: chạy chu trình
    vệ sinh lồng khoảng mỗi tháng một lần với hộ giặt hằng ngày; vệ sinh chuyên
    sâu có tháo lồng khoảng mỗi mười hai tới mười tám tháng với hộ gia đình dùng
    bình thường, và dày hơn với hộ giặt nhiều, giặt đồ bảo hộ nhiều dầu mỡ, nhà
    có trẻ nhỏ hoặc thú cưng, khu vực nước cứng nhiều cặn vôi, hoặc máy đặt ở
    nơi ẩm thấp thiếu thông thoáng. Cần phân biệt rõ ba mức công việc vì chúng
    hay bị gọi chung là vệ sinh máy giặt: mức một là việc người dùng tự làm gồm
    lau gioăng cửa, rửa ngăn bột giặt, vệ sinh bộ lọc bơm xả và chạy chu trình
    vệ sinh lồng; mức hai là vệ sinh chuyên sâu có tháo lồng để làm sạch mặt
    ngoài lồng và khoang máy, kiểm tra ống xả và ống cấp; mức ba là bảo trì gồm
    cả kiểm tra cân bằng, dây curoa, bạc đạn, gioăng và các mối nối. Hai báo giá
    chênh nhau thường vì đang báo hai mức khác nhau, chứ không phải vì đơn giá.
    Các yếu tố làm chi phí khác nhau một cách chính đáng gồm loại máy cửa trên
    hay cửa trước, khối lượng máy và vị trí đặt có dễ tháo lắp không, số lượng
    máy trong một lần tới, và tình trạng máy khi lâu ngày chưa vệ sinh. Nên yêu
    cầu báo giá ghi rõ hạng mục và nêu trước điều kiện phát sinh.
