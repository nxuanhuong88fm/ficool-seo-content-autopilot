nghien_cuu:
  van_ban: >-
    Vệ sinh tủ lạnh có hai ràng buộc chồng lên nhau: an toàn thực phẩm và an
    toàn cho thiết bị. Về thực phẩm, cơ quan quản lý khuyến cáo giữ ngăn mát ở
    mức từ 4 độ C trở xuống, và trong khoảng nhiệt độ từ khoảng 4 tới 60 độ C vi
    khuẩn phát triển nhanh, nên thời gian thực phẩm dễ hỏng nằm ngoài tủ trong
    lúc dọn cần được rút ngắn; cách làm thông thường là chuyển thực phẩm sang
    thùng giữ lạnh có đá thay vì để trên mặt bàn. Về thiết bị, các bề mặt trong
    khoang là nhựa và kính chịu lực, nên nước quá nóng đổ lên kính đang lạnh có
    thể gây nứt do sốc nhiệt, còn chất tẩy mạnh hoặc dung môi có thể làm giòn
    nhựa và để lại mùi bám dai. Lớp tuyết trong ngăn đá phải được để tan tự
    nhiên, không cạy bằng vật sắc, vì đường ống làm lạnh nằm ngay sau lớp vỏ và
    một vết thủng là hỏng nặng. Hai vị trí hay bị bỏ qua khi vệ sinh là lỗ thoát
    nước ngưng ở thành sau ngăn mát, nơi tắc thì nước đọng dưới đáy tủ, và
    gioăng cửa, nơi cặn bẩn tích trong các rãnh làm gioăng áp không đều. Bên
    ngoài khoang, dàn nóng và khu vực dưới gầm bám bụi làm giảm khả năng thải
    nhiệt. Sau khi vệ sinh, mức lấp đầy hợp lý được khuyến cáo là khoảng ba phần
    tư để không khí lưu thông, và cần chừa khoảng trống trước các cửa gió.
