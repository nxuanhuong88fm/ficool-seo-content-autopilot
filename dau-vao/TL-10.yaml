nghien_cuu:
  van_ban: >-
    Gioăng cửa tủ lạnh là chi tiết rẻ nhưng ảnh hưởng lớn tới hiệu quả làm lạnh
    và tiền điện, vì nó là ranh giới giữa khoang lạnh với không khí phòng. Gioăng
    là một dải cao su rỗng bên trong có nam châm; nam châm hút vào khung tủ bằng
    thép để tạo lực đóng, còn phần cao su rỗng biến dạng để bịt kín khe. Ba cách
    kiểm tra người dùng tự làm được: phép thử tờ giấy, kẹp một tờ giấy vào mép
    cửa rồi kéo ra, nếu rút ra dễ dàng thì chỗ đó không còn kín, lặp lại quanh
    toàn bộ viền; phép thử đèn pin, đặt đèn pin sáng trong tủ, tắt đèn phòng và
    đóng cửa, nếu thấy ánh sáng lọt ra thì có khe hở; và quan sát trực tiếp tìm
    vết rách, đoạn chai cứng, nấm mốc trong nếp gấp, hoặc đoạn bị biến dạng do
    kẹp vật lâu ngày. Nguyên nhân gioăng hở gồm: bụi và cặn thực phẩm tích trong
    nếp gấp làm gioăng không áp sát; cao su chai cứng theo thời gian, mất đàn
    hồi; nấm mốc phát triển trong nếp gấp; tủ kê không cân khiến cửa không tự
    đóng đều; bản lề lỏng làm cửa xệ; và thói quen đóng cửa mạnh hoặc kéo cửa
    khi còn kẹp vật. Về xử lý, gioăng bẩn hoặc mốc thường phục hồi được sau khi
    vệ sinh bằng nước ấm pha xà phòng nhẹ rồi lau khô; gioăng chai nhẹ có thể
    cải thiện tạm bằng cách làm ấm rồi nắn lại, nhưng đó chỉ là giải pháp ngắn
    hạn. Gioăng rách, biến dạng vĩnh viễn, hoặc mất từ tính thì cần thay, và
    gioăng là phụ kiện thay riêng theo model, không cần thay cả cửa hay cả tủ.
