    Máy giặt không vắt hoặc vắt không kiệt có ba nhóm nguyên nhân, và nhóm đầu
    tiên chiếm phần lớn số ca nhưng không phải hỏng hóc. Nhóm tải và cân bằng:
    quần áo dồn về một phía tạo lệch tâm, cảm biến phát hiện mất cân bằng và máy
    dừng vắt để tránh rung mạnh; nhồi quá nhiều đồ hoặc giặt một món nặng duy
    nhất như chăn, thảm đều gây ra hiện tượng này; máy kê không cân bằng trên
    sàn cũng làm cảm biến báo lệch. Nhóm thoát nước: hầu hết máy giặt không
    chuyển sang chu trình vắt khi nước chưa thoát hết, nên nghẹt bộ lọc bơm xả,
    ống xả bị gập, hoặc đầu ống xả đặt quá cao đều biểu hiện ra ngoài thành lỗi
    không vắt dù nguyên nhân thật nằm ở khâu xả. Nhóm cơ và điện: dây curoa
    trùng hoặc đứt ở máy cửa trên dùng truyền động dây, chổi than mòn ở một số
    dòng động cơ, công tắc cửa hỏng khiến máy không xác nhận cửa đóng, bo mạch
    lỗi. Với máy cửa trước, cửa khoá điện tử trong suốt chu trình và chỉ mở sau
    khi nước đã thoát và lồng đã dừng hẳn, nên không mở được cửa là biểu hiện
    thường đi kèm. Trình tự kiểm tra hợp lý là đi từ nhóm rẻ và an toàn nhất tới
    nhóm cần thợ: dàn đều đồ, giảm tải, kiểm tra máy có kê cân không, kiểm tra
    ống xả và bộ lọc bơm, đọc mã lỗi nếu màn hình có hiển thị. Việc mở vỏ máy,
    thay dây curoa hay can thiệp bo mạch cần thợ vì có rủi ro điện và nước.
