nghien_cuu:
  van_ban: >-
    Tủ lạnh chạy liên tục không ngắt cần được đánh giá cùng với một câu hỏi thứ
    hai: tủ có đủ lạnh không. Hai câu trả lời kết hợp lại cho ra hai tình huống
    rất khác nhau. Nếu tủ chạy liên tục mà vẫn đủ lạnh, nguyên nhân thường thuộc
    nhóm tải nhiệt: nhiệt độ phòng cao, tủ mới cắm điện hoặc mới nạp đầy thực
    phẩm, cửa mở nhiều lần, đặt đồ nóng vào tủ, nhiệt độ cài đặt quá thấp so với
    nhu cầu, hoặc dàn nóng không thải được nhiệt do bám bụi hay do tủ kê sát
    tường. Nếu tủ chạy liên tục mà không đủ lạnh, nguyên nhân nghiêng về nhóm
    hệ thống: thiếu môi chất lạnh do rò rỉ, dàn lạnh bám tuyết dày chặn dòng
    khí, quạt hỏng, hoặc block yếu không đạt năng suất. Một điểm quan trọng về
    máy biến tần: tủ lạnh dùng block biến tần được thiết kế để chạy gần như liên
    tục ở công suất thấp thay vì bật tắt theo chu kỳ, nên với loại tủ này việc
    block chạy dài không phải dấu hiệu bất thường; điều cần nhìn là tủ có đủ
    lạnh và tiêu thụ điện có tăng bất thường không. Về gioăng cửa, một khe hở
    nhỏ khiến hơi ẩm và nhiệt vào liên tục, buộc block chạy nhiều hơn; kiểm bằng
    phép thử tờ giấy. Về tần suất xả tuyết, bộ xả tuyết hỏng làm tuyết dày lên
    và cản dòng khí, khiến tủ vừa chạy nhiều vừa lạnh kém. Tiêu thụ điện tăng
    dần theo tháng là chỉ dấu gián tiếp đáng tin của nhóm nguyên nhân này.
