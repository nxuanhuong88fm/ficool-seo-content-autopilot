nghien_cuu:
  van_ban: >-
    Máy giặt không xả nước là lỗi có trình tự kiểm tra rõ ràng vì đường nước ra
    chỉ đi qua vài điểm cố định: từ lồng giặt xuống bộ lọc bơm xả, qua bơm xả,
    rồi theo ống xả ra ngoài. Kiểm tra tuần tự theo đúng đường đó sẽ tìm ra chỗ
    nghẽn mà không cần đoán. Điểm thứ nhất là bộ lọc bơm xả, nơi giữ lại xơ vải,
    tóc, và các vật nhỏ rơi từ túi quần như đồng xu, kẹp tóc, ghim. Đây là
    nguyên nhân phổ biến nhất và cũng là điểm người dùng tự xử lý được. Điểm thứ
    hai là ống xả: bị gập gãy khúc, bị đồ vật đè, bị nghẹt do cặn xà phòng tích
    tụ, hoặc đầu ống đặt sai độ cao. Nhà sản xuất quy định khoảng độ cao cho đầu
    ống xả; đặt quá cao thì bơm không đủ sức đẩy, đặt quá thấp lại gây hiện
    tượng tự chảy khiến nước thoát ra ngay trong lúc giặt. Điểm thứ ba là bơm
    xả: cánh bơm bị kẹt bởi vật lạ, hoặc động cơ bơm hỏng; dấu hiệu là nghe
    tiếng ù nhưng nước không xuống. Điểm thứ tư là cảm biến mực nước và bo mạch:
    máy tưởng đã xả xong dù còn nước, hoặc không kích hoạt bơm. Có một nguyên
    nhân bên ngoài máy hay bị bỏ sót: đường thoát nước của nhà bị nghẹt, khiến
    nước không đi được dù máy vẫn bơm bình thường; dấu hiệu là nước trào ngược ở
    miệng thoát sàn. Về an toàn, luôn rút phích cắm trước khi mở nắp bộ lọc, và
    chuẩn bị khay hứng vì lượng nước còn trong máy sẽ chảy ra.
