nghien_cuu:
  van_ban: >-
    Quyết định sửa hay thay một chiếc tủ lạnh thường được các tài liệu tiêu dùng
    khuyên đặt trên ba nhóm dữ liệu chứ không phải trên cảm tính: tuổi máy, chi
    phí lần sửa này so với giá một máy mới tương đương, và lịch sử hỏng hóc gần
    đây. Về tuổi máy, tủ lạnh là thiết bị chạy liên tục nên hao mòn tích luỹ
    theo giờ vận hành; các chương trình hiệu suất năng lượng như ENERGY STAR
    khuyến khích thay thế những máy đã cũ vì mức tiêu thụ điện của thiết bị mới
    thấp hơn đáng kể so với các thế hệ trước, nghĩa là phần chênh lệch tiền điện
    hằng tháng cũng phải được tính vào bài toán chứ không chỉ tính hoá đơn sửa.
    Về loại hỏng hóc, các hỏng ở nhóm linh kiện ngoại vi như gioăng cửa, quạt,
    rơ le, bộ xả tuyết, cảm biến hay bo mạch thường có chi phí thấp hơn nhiều so
    với hỏng ở máy nén hoặc rò rỉ trong hệ thống kín, và nhóm sau là nhóm khiến
    cân nhắc thay mới trở nên hợp lý, nhất là với máy đã cũ. Một yếu tố kỹ thuật
    khác là môi chất lạnh: các dòng tủ đời cũ và đời mới dùng môi chất khác
    nhau, nên nguồn linh kiện thay thế cho máy quá cũ có thể khan hiếm. Ngoài
    ra, tần suất hỏng cũng là dữ liệu: một máy phải gọi thợ nhiều lần trong vòng
    một năm thường báo hiệu hao mòn hệ thống chứ không phải một sự cố đơn lẻ.
