nghien_cuu:
  van_ban: >-
    Nước nhỏ giọt từ dàn lạnh trong nhà gần như luôn là nước ngưng tụ chứ không
    phải môi chất lạnh, và hiểu đúng điểm này quyết định hướng xử lý: dàn lạnh
    làm không khí đi qua nó lạnh xuống dưới điểm sương, hơi ẩm trong không khí
    ngưng thành nước trên bề mặt dàn, nước chảy xuống máng hứng rồi theo ống
    thoát ra ngoài. Do đó nước xuất hiện sai chỗ nghĩa là một mắt xích trong
    chuỗi máng hứng và đường thoát đang không làm việc, chứ không phải máy thiếu
    gas. Các nguyên nhân thường gặp xếp theo tần suất gồm ống thoát nước bị nghẽn
    bởi bụi trộn với màng nhầy sinh học hình thành trong môi trường ẩm thường
    xuyên, máng hứng bị bẩn hoặc nứt, đường ống bị võng tạo điểm đọng nước làm
    dòng chảy dừng lại, đầu ra của ống thoát bị ngập hoặc bị côn trùng làm tổ,
    dàn lạnh lắp không cân nên nước chảy về phía sai, và lưới lọc quá bẩn làm
    luồng gió giảm khiến dàn bị đóng băng rồi tan ra thành lượng nước vượt quá
    khả năng thoát của máng. Nhóm nguyên nhân thứ hai ít gặp hơn nhưng nghiêm
    trọng hơn là dàn bị đóng băng do thiếu môi chất hoặc do quạt dàn lạnh yếu;
    khi đó biểu hiện kèm theo là máy kém lạnh và có thể nhìn thấy tuyết bám trên
    dàn, và việc chỉ thông ống thoát sẽ không giải quyết được gì. Về an toàn, mọi
    thao tác kiểm tra phải thực hiện sau khi ngắt nguồn điện cấp cho máy, vì nước
    và thiết bị điện nằm cùng một chỗ; người dùng có thể tự làm phần tiếp cận
    được gồm tháo và rửa lưới lọc, quan sát đường ống có bị võng hay bị chặn ở
    đầu ra, và lau khô để xác định nước đến từ đâu, nhưng việc mở nắp dàn lạnh,
    thông ống bằng áp lực, xử lý máng hứng nứt hoặc cân chỉnh lại dàn thuộc phạm
    vi kỹ thuật viên. Dấu hiệu cần dừng dùng máy ngay gồm nước chảy vào khu vực ổ
    cắm hoặc bảng điện, có mùi khét, và thiết bị chống dòng rò nhảy.
