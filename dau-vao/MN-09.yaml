nghien_cuu:
  van_ban: >-
    Câu hỏi bao lâu nên vệ sinh máy nước nóng không có một đáp án duy nhất vì tốc
    độ tích cặn phụ thuộc hai yếu tố mà không yếu tố nào được ghi trên máy: độ
    cứng của nước cấp, tức lượng muối canxi và magie trong nước, và lượng nước
    nóng thực tế chảy qua máy mỗi ngày. Một yếu tố thứ ba lại nằm trong tầm điều
    chỉnh của người dùng: nhiệt độ cài đặt càng cao thì cacbonat kết tủa càng
    nhanh, nên hạ mức cài đặt xuống mức vừa đủ cho nhu cầu tắm làm chậm quá trình
    tích cặn và đồng thời giảm thất thoát nhiệt. Loại thiết bị thay đổi hẳn nội
    dung công việc: bình chứa gián tiếp có lòng bình và thanh đốt ngâm trong nước
    nên cần xả rửa lòng bình, làm sạch cặn trên thanh đốt và kiểm tra thanh magie;
    còn máy làm nóng trực tiếp không trữ nước nên không có lòng bình để súc, việc
    bảo dưỡng của nó tập trung vào lưới lọc đầu vào, vòi sen và kiểm tra hệ thống
    bảo vệ điện. Các dấu hiệu cho biết đã tới lúc gồm thời gian đun dài hơn trước
    ở cùng mức cài đặt, có tiếng lục cục khi đun do cặn lắng ở đáy, lượng nước
    nóng dùng được giảm so với trước vì thể tích hữu dụng bị cặn chiếm chỗ, nước
    ở lượt xả đầu có màu hoặc có hạt, và thiết bị chống dòng rò bắt đầu nhảy. Tuy
    nhiên không thể dựa hoàn toàn vào dấu hiệu, vì thanh magie tiêu hao theo thời
    gian và hoàn toàn không phát ra biểu hiện nào từ bên ngoài cho tới khi lòng
    bình đã bị ăn mòn; đó là lý do vẫn cần một mốc kiểm tra theo lịch bên cạnh
    việc theo dõi dấu hiệu. Về chi phí, các yếu tố ảnh hưởng gồm dung tích bình,
    vị trí lắp đặt cùng khoảng thao tác còn lại, mức độ cặn đã tích, kiểu bình
    nằm ngang hay đứng, và việc có phải thay thanh đốt, thanh magie hoặc gioăng
    mặt bích.
