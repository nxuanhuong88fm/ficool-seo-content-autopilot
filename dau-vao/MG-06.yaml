  van_ban: >-
    Máy giặt cửa trước khoá cửa bằng cơ cấu điện tử trong suốt chu trình, và
    việc không mở được cửa thường là cơ chế an toàn đang hoạt động đúng chứ
    không phải hỏng. Ba điều kiện phải thoả trước khi khoá nhả: nước trong lồng
    đã thoát hết, lồng đã dừng quay hoàn toàn, và nhiệt độ nước không còn ở mức
    gây bỏng với các chương trình giặt nóng. Nhiều model có thêm độ trễ an toàn
    khoảng một tới ba phút sau khi chu trình kết thúc. Do đó nguyên nhân phổ
    biến nhất chỉ đơn giản là chưa đủ thời gian hoặc còn nước trong lồng, và
    trong trường hợp thứ hai thì gốc vấn đề nằm ở khâu xả chứ không ở cửa. Các
    nguyên nhân thực sự thuộc về cửa gồm: chốt khoá điện tử hỏng, công tắc cửa
    hỏng, tay nắm hoặc lẫy cơ khí gãy, và bo mạch không gửi lệnh nhả khoá. Mất
    điện giữa chu trình cũng khiến cửa kẹt vì cơ cấu khoá cần điện để nhả. Phần
    lớn máy cửa trước có cơ cấu nhả khẩn cấp: một sợi dây nhỏ hoặc lẫy nằm sau
    nắp che bộ lọc bơm xả ở góc dưới mặt trước; kéo nó sẽ nhả khoá bằng cơ khí,
    nhưng chỉ được làm sau khi đã rút phích cắm và đã xả hết nước, vì mở cửa khi
    còn nước sẽ khiến nước tràn ra sàn. Việc cạy cửa bằng vật cứng làm hỏng chốt
    và khung cửa, khiến chi phí sửa tăng lên đáng kể so với việc xử lý đúng cách.
