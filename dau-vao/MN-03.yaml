nghien_cuu:
  van_ban: >-
    Nước xuất hiện quanh máy nước nóng có nhiều nguồn với mức nghiêm trọng rất
    khác nhau, nên bước đầu tiên là xác định nước đến từ đâu chứ không phải xử
    lý ngay chỗ nhìn thấy nước. Nhóm nhẹ nhất là các mối nối ren ở đường cấp và
    đường ra: gioăng hoặc băng tan xuống cấp, ốc lỏng sau một thời gian dùng.
    Nhóm thứ hai là van, gồm van một chiều và van an toàn lắp ở đường cấp vào;
    van an toàn có nhiệm vụ xả bớt khi áp suất trong bình tăng do nước giãn nở
    khi được đun nóng, nên một lượng nước nhỏ chảy ra từ van này trong chu kỳ
    đun là hiện tượng theo thiết kế chứ không phải hỏng. Van nhỏ giọt liên tục
    kể cả khi máy không đun thì lại là dấu hiệu van bẩn, kẹt hoặc áp lực nước
    cấp vào quá cao. Nhóm thứ ba là gioăng mặt bích nơi lắp thanh đốt: rò ở đây
    thường biểu hiện thành vệt nước chảy dọc thân bình từ phía mặt bích. Nhóm
    nặng nhất là thân bình bị thủng do ăn mòn từ bên trong, thường sau nhiều năm
    sử dụng và liên quan tới việc thanh magie bảo vệ đã mòn hết; trường hợp này
    không vá được vì lớp tráng men và lớp cách nhiệt đã hỏng theo, và phương án
    thực tế là thay bình. Về an toàn, nước rò trên một thiết bị có điện là tình
    huống phải ngắt nguồn tại aptomat trước khi làm bất cứ việc gì khác, và cần
    phân biệt với hiện tượng ngưng tụ trên bề mặt đường ống lạnh vốn không phải
    rò rỉ.
