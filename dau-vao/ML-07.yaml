nghien_cuu:
  van_ban: >-
    Bảo dưỡng máy lạnh được các cơ quan năng lượng khuyến cáo là việc định kỳ,
    trong đó phần lưới lọc là hạng mục người dùng tự làm được và có ảnh hưởng
    lớn tới hiệu suất. Lưới lọc bẩn chặn dòng khí đi qua dàn lạnh, làm giảm khả
    năng trao đổi nhiệt và khiến máy chạy lâu hơn để đạt cùng một nhiệt độ; tài
    liệu của Bộ Năng lượng Hoa Kỳ nêu rằng thay hoặc làm sạch lưới lọc bẩn là
    biện pháp đơn giản có tác động rõ rệt tới mức tiêu thụ điện. Tần suất phụ
    thuộc điều kiện: môi trường nhiều bụi, có thú nuôi hoặc máy chạy gần như
    liên tục thì cần làm dày hơn. Các hạng mục còn lại đòi hỏi tháo vỏ, che chắn
    mạch điện và dùng nước có áp lực nên vượt phạm vi tự làm: dàn lạnh với các
    lá nhôm rất mỏng, dễ bẹp và bẹp rồi thì chặn khí; máng hứng nước ngưng và
    đường ống thoát vốn là nơi sinh nhớt sinh học gây tắc và gây mùi; quạt lồng
    sóc nằm sâu bên trong; dàn nóng ngoài trời cùng khối mạch điện. Tài liệu về
    nấm mốc của EPA nhấn mạnh nguyên tắc chung là xử lý nguồn ẩm chứ không phải
    chỉ khử mùi bề mặt, vì mùi quay lại nếu phần ẩm đọng vẫn còn. Về an toàn,
    mọi thao tác chạm vào máy phải thực hiện sau khi ngắt nguồn điện tại
    aptomat, không chỉ tắt bằng remote, vì remote chỉ dừng chế độ chứ không cắt
    điện vào máy.
