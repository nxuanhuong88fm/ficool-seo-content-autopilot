nghien_cuu:
  van_ban: >-
    Nghiệm thu tủ lạnh khác nghiệm thu máy lạnh và máy giặt ở một điểm quyết
    định: kết quả không thể xác nhận ngay tại chỗ. Tủ lạnh cần nhiều giờ để hạ
    nhiệt độ toàn khoang xuống mức cài đặt, nên việc sờ tay thấy mát sau mười
    phút không chứng minh được gì. Điều này dẫn tới một cách nghiệm thu hai
    bước: bước tại chỗ kiểm những gì quan sát được ngay, và bước sau nhiều giờ
    kiểm bằng nhiệt kế. Các hạng mục kiểm tại chỗ gồm: tủ đặt đúng vị trí, cân
    bằng, không bập bênh; cửa tự khép khi buông tay; gioăng cửa áp đều, kiểm
    bằng phép thử tờ giấy; khoảng hở lưng và hai bên đạt yêu cầu; block chạy êm,
    không tiếng va đập; không có nước đọng dưới gầm; khu vực làm việc được dọn;
    và với ca sửa chữa thì được xem linh kiện đã thay cùng ghi nhận nguyên nhân.
    Sau vệ sinh cần thêm: các khay và ngăn kéo đã lắp lại đúng vị trí, rãnh và
    lỗ thoát nước ngưng thông, không còn mùi, và bề mặt khô. Các hạng mục kiểm
    sau nhiều giờ gồm: nhiệt độ thực đo bằng nhiệt kế ở ngăn mát và ngăn đá đạt
    mốc an toàn thực phẩm; không có nước đọng dưới gầm sau một chu kỳ xả tuyết;
    không có tuyết bám bất thường; và block có chu kỳ nghỉ với tủ dùng block
    thường. Về giấy tờ, cần phiếu ghi rõ hạng mục đã làm và điều kiện bảo hành
    cho phần việc đó, vì bảo hành dịch vụ khác bảo hành thiết bị của hãng. Với
    ca di dời, cần ghi rõ thời gian chờ trước khi cắm điện đã được tuân thủ.
  nguon:
  - url: https://www.fda.gov/food/buy-store-serve-safe-food/refrigerator-thermometers-cold-facts-about-food-safety
    title: US FDA — Refrigerator Thermometers and Food Safety
