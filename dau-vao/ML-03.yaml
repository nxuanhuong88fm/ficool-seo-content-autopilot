nghien_cuu:
  van_ban: >-
    Mùi từ máy lạnh chia thành hai nhóm rất khác nhau về mức độ nguy hiểm. Nhóm
    thứ nhất là mùi ẩm mốc: hơi ẩm đọng trên dàn lạnh và trong máng hứng nước
    tạo môi trường cho nấm mốc và vi khuẩn phát triển, đặc biệt ở khí hậu nóng
    ẩm. Mùi này thường nồng nhất trong vài phút đầu sau khi bật máy, giảm dần
    khi máy chạy ổn định, và có thể xử lý bằng vệ sinh. Nhóm thứ hai là mùi báo
    hiệu sự cố: mùi khét hoặc mùi nhựa cháy chỉ dây điện quá nhiệt hoặc động cơ
    quạt có vấn đề; mùi tanh kim loại hoặc mùi ngọt nhẹ bất thường có thể liên
    quan tới rò rỉ môi chất lạnh; mùi hôi như xác động vật thường do chuột hoặc
    côn trùng chết bên trong vỏ máy hoặc trong ống thoát. Nhóm thứ hai không tự
    hết và không xử lý được bằng vệ sinh thông thường. Một nguồn mùi hay bị bỏ
    sót là đường ống thoát nước ngưng: nếu ống nối thẳng vào hệ thống thoát của
    nhà mà không có bẫy nước, mùi cống có thể đi ngược lên qua ống và thoát ra
    ở dàn lạnh. Trường hợp này mùi xuất hiện cả khi máy không chạy. Về phòng
    ngừa, chế độ làm khô dàn sau khi tắt máy giúp giảm ẩm đọng; lưới lọc cần
    được rửa định kỳ vì bụi ẩm là nơi nấm mốc bám. Vệ sinh phần người dùng làm
    được chỉ gồm lưới lọc và vỏ máy — dàn lạnh, máng hứng và ống thoát cần dụng
    cụ chuyên dụng, và làm sai có thể gây rò nước hoặc chập điện.
