nghien_cuu:
  van_ban: >-
    Tủ mát dùng trong bán hàng có điều kiện vận hành khác tủ lạnh gia đình: cửa
    mở rất nhiều lần trong ngày, hàng hoá thường xếp dày, và phần lớn model có
    cửa kính nên bề mặt cần sạch cả vì lý do trưng bày. Việc vệ sinh vì thế phải
    tính tới cả ba phía: bên trong khoang, phần kính cùng gioăng cửa, và khu vực
    kỹ thuật gồm dàn nóng, khay hứng nước bay hơi và đường thoát nước ngưng.
    Trong khoang, các bề mặt là nhựa và kính chịu lực nên nước quá nóng đổ lên
    kính đang lạnh có thể gây nứt do sốc nhiệt, còn chất tẩy mạnh có thể làm
    giòn nhựa và để lại mùi bám sang hàng hoá. Gioăng cửa là chi tiết cần chú ý
    riêng: nó có rãnh nên cặn bẩn tích trong rãnh làm gioăng áp không đều, dẫn
    tới khí lạnh thoát ra, máy chạy nhiều hơn và tuyết bám quanh khu vực hở; với
    tủ mát cửa kính dùng gioăng nam châm, cặn bẩn còn làm giảm lực hít. Khu vực
    thoát nước là nơi hay bị bỏ qua nhất: nước ngưng từ dàn lạnh chảy theo máng
    và đường ống ra khay bay hơi, và khi đường này tắc do cặn hoặc nhớt sinh học
    thì nước đọng trong khoang hoặc tràn ra sàn. Về thời điểm, nên chọn lúc
    lượng hàng ở mức thấp nhất và cần chuẩn bị chỗ giữ lạnh cho hàng, vì cửa mở
    lâu làm nhiệt độ khoang tăng. Sau khi vệ sinh, cần lau khô hoàn toàn trước
    khi xếp hàng lại và đo nhiệt độ thực trước khi kết luận tủ đã ổn định.
