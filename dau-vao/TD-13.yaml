nghien_cuu:
  van_ban: >-
    Rủi ro lớn nhất khi di dời tủ mát và tủ đông không nằm ở phần vỏ mà nằm ở
    máy nén và hệ thống ống. Máy nén chứa dầu bôi trơn, và khi tủ bị nghiêng
    hoặc đặt nằm, dầu có thể tràn sang phần ống dẫn môi chất; nếu cắm điện ngay
    sau đó, máy nén khởi động trong tình trạng thiếu dầu và phần dầu lọt vào ống
    có thể gây tắc. Vì vậy các hãng khuyến cáo giữ tủ ở tư thế đứng trong suốt
    quá trình vận chuyển, và nếu buộc phải nghiêng thì cần để tủ đứng yên một
    khoảng thời gian theo hướng dẫn của model trước khi cắm điện, với thời gian
    chờ dài hơn khi mức nghiêng lớn hơn. Về chuẩn bị, cần rút điện trước đủ lâu
    để tủ hết lạnh, xả tuyết hoàn toàn, vệ sinh và lau khô, vì nước còn lại sẽ
    chảy trong lúc vận chuyển và có thể chảy vào phần điện; các giỏ, kệ, khay
    phải được lấy ra hoặc cố định, và nắp hoặc cửa phải được buộc để không bật
    mở khi khiêng. Về thao tác, không kéo lê tủ trên sàn vì dễ gãy chân đế và
    làm cong khung; nên dùng xe đẩy chuyên dụng và bảo vệ dàn nóng cùng đường
    ống phía sau, đây là bộ phận lộ ra ngoài và dễ va đập nhất. Về hàng hoá, do
    quá trình di dời kéo dài nhiều giờ tính cả thời gian chờ, cần bố trí phương
    án giữ lạnh cho hàng hoặc chọn thời điểm lượng hàng ở mức thấp nhất. Sau khi
    tới nơi, quy trình khởi động lại giống với lắp mới: kê cân, chừa khoảng hở,
    chờ đủ thời gian, chạy không tải rồi đo nhiệt độ thực trước khi đưa hàng
    vào.
