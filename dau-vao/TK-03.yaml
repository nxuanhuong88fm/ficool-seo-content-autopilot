nghien_cuu:
  van_ban: >-
    Máy sấy quần áo luôn phát ra âm thanh khi hoạt động vì nó có một lồng lớn
    quay liên tục cùng một quạt thổi khí, nên việc cần làm trước tiên là phân
    biệt âm thanh theo thiết kế với âm thanh bất thường. Nhóm theo thiết kế gồm
    tiếng ù đều của quạt, tiếng vải va vào thành lồng, và tiếng lạch cạch nhẹ
    của khoá kéo hay cúc áo đập vào lồng. Nhóm bất thường thường quy về ba nhóm
    nguyên nhân. Nhóm thứ nhất là vật lạ: đồng xu, kẹp tóc, đinh ghim hoặc mảnh
    kim loại rơi ra khỏi túi áo, lọt vào khe giữa lồng và vỏ hoặc vào khoang
    quạt, cho ra tiếng va đập kim loại có nhịp. Nhóm thứ hai là lắp đặt và cách
    dùng: máy kê không cân, chân đế chưa được chỉnh, sàn không đủ cứng, máy đặt
    sát tường làm âm cộng hưởng, tải quá ít khiến quần áo dồn về một phía, hoặc
    máy đặt chồng lên máy giặt mà không dùng bộ phụ kiện chuyên dụng. Nhóm thứ
    ba là hao mòn cơ khí: dây curoa kéo lồng bị mòn hoặc nứt cho tiếng đập đều
    theo vòng quay; con lăn hoặc bạc đỡ lồng mòn cho tiếng rít hoặc tiếng ù
    trầm tăng dần qua nhiều tháng; cánh quạt cong hoặc chạm vật cản cho tiếng
    rít cao. Một yếu tố ngoài máy hay bị bỏ qua là đường ống thoát khí chạm vào
    tường hoặc vào chính vỏ máy, khiến rung truyền và khuếch đại thành tiếng ồn
    lớn hơn nhiều so với nguồn thật.
