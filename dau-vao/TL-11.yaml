nghien_cuu:
  van_ban: >-
    Tủ lạnh khác phần lớn thiết bị gia dụng ở chỗ nó chạy liên tục và hậu quả
    khi nó hỏng không dừng ở bản thân thiết bị mà lan sang thực phẩm bên trong.
    Vì vậy một lượt bảo trì tủ lạnh nên được xây quanh câu hỏi thiết bị có còn
    giữ được nhiệt độ an toàn hay không, và câu đó chỉ trả lời được bằng nhiệt
    kế chứ không bằng cảm giác tay. Cơ quan quản lý thực phẩm khuyến cáo ngăn
    mát ở mức từ 4 độ C trở xuống và ngăn đá ở âm 18 độ C, và đây là nhiệt độ
    thực trong khoang chứ không phải nấc trên bảng điều khiển. Các hạng mục cốt
    lõi gồm: gioăng cửa và độ kín, kiểm bằng phép thử tờ giấy; dàn nóng cùng khu
    vực dưới gầm, nơi bụi bám làm giảm khả năng thải nhiệt; khoảng hở phía sau
    và hai bên; độ cân bằng của tủ, vì tủ nghiêng làm cửa không tự đóng và làm
    nước ngưng không chảy đúng hướng; lỗ và đường thoát nước ngưng ở thành sau
    ngăn mát, nơi tắc thì nước đọng dưới đáy khoang; khay hứng nước bay hơi phía
    sau; mức tuyết bám trong ngăn đá; chu kỳ chạy và nghỉ của máy nén với tủ
    dùng block thường; và cách sắp xếp thực phẩm, vì hàng che cửa gió tạo vùng
    ấm cục bộ ngay cả khi thiết bị hoạt động tốt. Với cơ sở kinh doanh, hai khác
    biệt cần tính vào lịch là tần suất mở cửa cao hơn nhiều và giá trị hàng hoá
    trong tủ, khiến chi phí của một lần hỏng vượt xa chi phí của lượt bảo trì.
