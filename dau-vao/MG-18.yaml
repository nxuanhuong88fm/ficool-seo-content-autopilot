nghien_cuu:
  van_ban: >-
    Quyết định sửa hay thay máy giặt nên dựa trên bốn yếu tố đo được: bộ phận
    hỏng thuộc nhóm nào, tuổi máy, tần suất hỏng gần đây, và chi phí sửa so với
    giá máy mới tương đương. Về bộ phận, nhóm ngoại vi gồm van cấp nước, bơm xả,
    công tắc cửa, cảm biến mực nước, dây curoa, bộ lọc, gioăng cửa; sửa hoặc
    thay từng phần thường hợp lý vì chi phí chiếm tỉ lệ nhỏ. Nhóm lõi gồm bạc
    đạn lồng giặt, động cơ và bo mạch chính; riêng bạc đạn là trường hợp đáng
    chú ý vì việc thay đòi hỏi tháo gần như toàn bộ máy, nên chi phí nhân công
    lớn và với nhiều model thì thay bạc đạn có chi phí tiệm cận giá một máy mới
    tầm trung. Về tuổi máy, máy giặt gia dụng thường được thiết kế cho vòng đời
    khoảng tám tới mười hai năm với tần suất sử dụng bình thường; vượt mốc đó
    thì các bộ phận khác cũng đang tiến gần cuối vòng đời. Về tần suất, nhiều
    lần hỏng ở các bộ phận khác nhau trong thời gian ngắn là dấu hiệu máy xuống
    đồng loạt chứ không phải sự cố đơn lẻ. Về hiệu suất, máy đời cũ thường tiêu
    thụ nước và điện nhiều hơn máy hiện nay, và phần chênh đó lặp lại mỗi tháng.
    Một quy tắc tham khảo phổ biến: nếu chi phí sửa vượt quá khoảng một nửa giá
    máy mới tương đương và máy đã qua hai phần ba vòng đời thiết kế thì thay
    thường hợp lý hơn. Trước khi quyết định nên yêu cầu chẩn đoán ghi rõ bộ phận
    hỏng, nguyên nhân, và phần nào còn rủi ro sau khi xử lý.
