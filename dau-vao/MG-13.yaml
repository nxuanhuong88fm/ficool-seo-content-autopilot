nghien_cuu:
  van_ban: >-
    Lắp đặt máy giặt có ba nhóm yêu cầu kỹ thuật và mỗi nhóm đều ảnh hưởng trực
    tiếp tới tuổi thọ máy. Nhóm vị trí và mặt sàn: sàn phải phẳng và đủ cứng,
    vì sàn mềm hoặc lún làm máy dịch chuyển khi vắt và làm mòn nhanh bạc đạn;
    cần chừa khoảng hở quanh máy theo hướng dẫn của hãng để tránh va đập và để
    thao tác bảo trì sau này; tránh nơi ẩm thấp không thông thoáng vì hơi ẩm
    đọng lại gây mùi và ăn mòn. Nhóm đường nước: đường cấp cần van khoá riêng
    cho máy để có thể ngắt khi cần mà không ảnh hưởng cả nhà; ống cấp không được
    gập gãy khúc; áp lực nước phải đạt mức tối thiểu mà nhà sản xuất yêu cầu.
    Với đường xả, độ cao đầu ống xả phải nằm trong khoảng nhà sản xuất quy định:
    quá cao thì bơm không đủ sức đẩy, quá thấp thì nước tự chảy ra trong lúc
    giặt khiến máy phải cấp bù liên tục. Nếu ống xả cắm thẳng vào đường thoát
    của nhà mà không có khe hở hoặc bẫy nước, mùi cống có thể đi ngược lên máy.
    Nhóm cân chỉnh và điện: bốn chân máy phải chỉnh cho máy không bập bênh, rồi
    khoá đai ốc hãm lại; kiểm tra bằng thước nivo theo hai chiều. Bu lông vận
    chuyển ở lưng máy bắt buộc phải tháo trước lần giặt đầu tiên. Về điện, máy
    giặt nên có ổ cắm riêng có tiếp địa, không dùng chung ổ với thiết bị công
    suất lớn, và không dùng dây nối dài kém chất lượng ở khu vực ẩm.
