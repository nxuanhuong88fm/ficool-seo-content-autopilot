nghien_cuu:
  van_ban: >-
    Tuyết trong tủ đông hình thành từ hơi ẩm trong không khí lọt vào khoang rồi
    ngưng và đóng băng trên bề mặt lạnh, chứ không phải từ nước bên trong máy.
    Vì vậy mức tuyết phản ánh lượng hơi ẩm đi vào, và các nguồn thường gặp là:
    mở nắp nhiều lần hoặc mở lâu, gioăng nắp chai hoặc cong khiến nắp không hít
    kín, hàng hoá chèn làm nắp kênh, đưa thực phẩm còn ướt hoặc còn ấm vào tủ,
    độ ẩm không khí cao ở khu vực đặt tủ, và lớp tuyết cũ tích tụ quanh miệng
    làm nắp không đóng khít nữa. Với các dòng xả tuyết thủ công, một lớp tuyết
    mỏng là hiện tượng bình thường theo thiết kế; hướng dẫn sử dụng thường
    khuyến cáo xả tuyết khi lớp tuyết đạt độ dày nhất định, phổ biến là khoảng
    năm tới mười milimét, vì tuyết là lớp cách nhiệt nên càng dày thì khả năng
    trao đổi nhiệt càng giảm và máy càng phải chạy nhiều hơn để giữ cùng một
    nhiệt độ. Với các dòng không đóng tuyết, tuyết dày bất thường lại là dấu
    hiệu cần kiểm tra hệ thống xả tuyết, cảm biến hoặc quạt. Việc phá tuyết bằng
    vật sắc bị các hãng cảnh báo vì đường ống làm lạnh nằm ngay sau lớp vỏ, và
    một vết thủng dẫn tới rò rỉ môi chất. Thời điểm xả tuyết thuận lợi là khi
    lượng hàng trong tủ ở mức thấp nhất.
