nghien_cuu:
  van_ban: >-
    Quạt điều hòa, còn gọi là quạt hơi nước hay máy làm mát bay hơi, hạ nhiệt độ
    bằng cách cho không khí đi qua một tấm vật liệu thấm nước; nước bay hơi và
    lấy nhiệt từ dòng khí đó. Nguyên lý này dẫn tới một hệ quả quyết định mà
    người dùng thường không biết: hiệu quả phụ thuộc trực tiếp vào độ ẩm của
    không khí. Không khí càng khô thì nước bay hơi càng nhiều và độ hạ nhiệt
    càng rõ; không khí đã bão hoà ẩm thì nước gần như không bay hơi được và
    thiết bị chỉ còn là một chiếc quạt thổi khí ẩm. Vì vậy tài liệu của Bộ Năng
    lượng Hoa Kỳ về máy làm mát bay hơi nhấn mạnh yêu cầu thông gió: phòng phải
    có lối cho khí ẩm thoát ra, thường là mở hé cửa hoặc cửa sổ, ngược hẳn với
    cách dùng máy lạnh vốn cần đóng kín. Đặt quạt điều hòa trong phòng kín làm
    độ ẩm tăng dần cho tới khi thiết bị hết tác dụng. Các nguyên nhân khác thuộc
    về thiết bị và bảo trì: bình chứa hết nước, bơm không đưa nước lên tấm làm
    mát, tấm làm mát khô ở một phần diện tích, tấm bám cặn khoáng làm nước không
    thấm đều, tấm đã mục nên diện tích tiếp xúc giảm, và lưới lọc bụi phía sau
    bị bám kín làm giảm lưu lượng khí. Ngoài ra còn có kỳ vọng: thiết bị này hạ
    nhiệt độ theo cơ chế bay hơi nên mức hạ được thấp hơn nhiều so với máy lạnh,
    và nó không thể so sánh trực tiếp với máy lạnh.
