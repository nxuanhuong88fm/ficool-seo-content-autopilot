nghien_cuu:
  van_ban: >-
    Chọn công suất máy lạnh theo diện tích là cách phổ biến nhưng chưa đủ, vì
    lượng nhiệt cần xử lý phụ thuộc cả thể tích phòng, mức nắng chiếu, số người
    và thiết bị sinh nhiệt bên trong. Đơn vị thường dùng là HP (ngựa) hoặc BTU
    trên giờ; một HP xấp xỉ 9.000 BTU trên giờ. Quy tắc kinh nghiệm ở Việt Nam
    thường lấy khoảng 600 tới 700 BTU cho mỗi mét vuông với phòng có trần cao
    tiêu chuẩn khoảng 2,8 mét, rồi cộng thêm cho các yếu tố làm tăng tải. Các
    yếu tố cộng thêm: phòng hướng tây hoặc có cửa kính lớn đón nắng chiều; tầng
    áp mái hoặc trần thấp không có lớp cách nhiệt; phòng có nhiều người thường
    xuyên; phòng có bếp, tủ lạnh, máy tính hoặc thiết bị toả nhiệt; phòng thông
    với không gian khác không có cửa ngăn. Chọn thiếu công suất khiến máy chạy
    gần như liên tục mà phòng vẫn không đạt nhiệt độ mong muốn, điện tiêu thụ
    cao và block chịu tải kéo dài. Chọn thừa công suất cũng có hại: máy đạt
    nhiệt độ quá nhanh rồi ngắt, chu kỳ bật tắt ngắn làm giảm khả năng tách ẩm
    nên phòng lạnh mà vẫn ẩm, đồng thời tăng hao mòn do khởi động liên tục. Với
    máy biến tần, việc chọn thừa ít gây hại hơn vì máy điều chỉnh được công suất
    theo tải, nhưng chọn thừa quá nhiều vẫn làm tăng chi phí đầu tư mà không thu
    lại được. Thực tế nên khảo sát tại chỗ vì hai phòng cùng diện tích ở hai vị
    trí khác nhau có thể cần hai mức công suất khác nhau.
