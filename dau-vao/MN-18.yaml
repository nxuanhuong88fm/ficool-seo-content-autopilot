nghien_cuu:
  van_ban: >-
    Khi một máy nước nóng nằm không dùng trong thời gian dài, phản xạ thông thường
    là cấp điện rồi xem máy còn chạy hay không, nhưng đây là thao tác đặt sai thứ
    tự vì ba thay đổi đã diễn ra trong thời gian đó và hai trong ba không quan sát
    được từ bên ngoài. Thay đổi thứ nhất là lượng nước trong bình: nếu hệ thống
    từng được xả, hoặc nước trong bình rút về theo đường cấp khi áp lực nước mất,
    thì thanh đốt có thể đang ở trạng thái không ngập nước, và cấp điện trong điều
    kiện đó làm thanh đốt hỏng ngay trong lượt đun đầu. Thay đổi thứ hai là độ ẩm
    trong khoang điện: phòng tắm là môi trường ẩm, và một thiết bị không sinh nhiệt
    trong thời gian dài sẽ để hơi ẩm đọng lại bên trong, nên dòng rò có thể đã
    tăng lên so với trước dù bên ngoài không có dấu hiệu gì. Thay đổi thứ ba là
    chất lượng nước trong bình: nước tù trong khoang ấm là môi trường thuận lợi cho
    vi khuẩn phát triển, và hướng dẫn về hệ thống nước của các toà nhà ít người sử
    dụng đều yêu cầu xả rửa hệ thống trước khi dùng lại thay vì dùng ngay. Ngoài
    ba thay đổi chính còn có những thay đổi cơ khí: gioăng bị khô nên có thể rỉ khi
    hệ thống được tạo áp lại, cặn đã khô và cứng hơn, và dây dẫn trong các lắp đặt
    bỏ lâu có thể bị động vật gặm. Bản thân thiết bị chống dòng rò cũng cần được
    thử lại vì cơ cấu của nó có thể bị kẹt sau thời gian dài không tác động. Do đó
    trình tự đúng là cấp nước và xả khí trước, kiểm rò nước khi hệ thống còn nguội,
    thử thiết bị chống dòng rò bằng nút thử, rồi mới cấp điện và theo dõi lượt đun
    đầu, cuối cùng xả nước nóng ra thoát nước một lượng đủ trước khi dùng. Nếu
    thiết bị chống dòng rò nhảy ngay ở lần cấp điện đầu thì đó là thiết bị bảo vệ
    đang làm đúng việc của nó và không được vô hiệu hoá nó để dùng tiếp, còn việc
    dùng cơ thể để thử xem nước có điện hay không là thao tác không được thực hiện
    trong bất kỳ trường hợp nào.
