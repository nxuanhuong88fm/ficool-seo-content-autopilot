nghien_cuu:
  van_ban: >-
    Việc chọn giữa ba loại máy sấy quần áo được quyết định bởi căn phòng trước khi
    được quyết định bởi bảng thông số, vì câu hỏi có đưa được khí ẩm ra ngoài trời
    hay không là một điều kiện nhị phân loại bỏ hẳn một phương án: máy thông hơi
    bắt buộc có đường ống ra ngoài, nên nhà thuê hoặc căn hộ không được khoan
    tường thì phương án này không tồn tại. Ba loại khác nhau ở cách xử lý khí ẩm.
    Máy thông hơi đẩy khí ẩm nóng ra ngoài, cấu tạo đơn giản và chu trình nhanh
    hơn nhưng phụ thuộc đường ống và toàn bộ nhiệt cùng ẩm phải có đường ra. Máy
    ngưng tụ làm ẩm ngưng lại trong máy rồi chứa vào bình hoặc xả theo ống, không
    cần đường ống ra ngoài, nhưng nó thải nhiệt và một phần ẩm vào chính phòng đặt
    máy; điểm này tạo một vòng phản hồi cần biết, vì phòng nhỏ và kín sẽ nóng và
    ẩm dần lên, và không khí nóng ẩm hơn lại làm hiệu suất của chính cái máy đó
    giảm xuống. Máy bơm nhiệt dùng chu trình lạnh để ngưng ẩm nên tiêu thụ điện
    thấp hơn hẳn và làm việc ở nhiệt độ thấp hơn, do đó chu trình dài hơn nhưng
    nhẹ với sợi vải hơn, và nó không làm phòng nóng lên nhiều như máy ngưng tụ.
    Trật tự giá mua và trật tự chi phí sử dụng gần như ngược nhau, nên phép so đúng
    phải tính trên lượng dùng dự kiến: với hộ dùng ít thì máy giá thấp có thể là
    lựa chọn hợp lý hơn, còn với hộ dùng nhiều thì phần tiết kiệm điện của máy bơm
    nhiệt mới có chỗ phát huy. Máy bơm nhiệt có thêm một hạng mục bảo trì mà hai
    loại kia không có là bộ lọc mịn thứ hai cùng dàn bay hơi, nên chi phí sở hữu
    của nó gồm cả một việc phải làm định kỳ chứ không chỉ gồm tiền điện. Về tiếng
    ồn, máy bơm nhiệt có máy nén nên đặc tính tiếng khác hai loại kia, điều này
    đáng cân nhắc nếu máy đặt gần phòng ngủ. Nhiệt độ phòng cũng ảnh hưởng tới máy
    bơm nhiệt vì nó lấy nhiệt từ không khí, nên phòng lạnh làm chu trình dài hơn.
