nghien_cuu:
  van_ban: >-
    Tấm làm mát là bộ phận quyết định hiệu quả của quạt điều hòa: không khí đi
    qua nó, nước thấm trong nó bay hơi và lấy nhiệt từ dòng khí. Tấm thường làm
    từ vật liệu dạng tổ ong có cấu trúc rãnh chéo để tăng diện tích tiếp xúc
    giữa nước và khí, và chính cấu trúc đó khiến nó vừa là nơi trao đổi nhiệt
    vừa là nơi giữ lại bụi trong không khí. Vì vậy tấm là vật tư tiêu hao chứ
    không phải linh kiện dùng mãi. Có hai kiểu xuống cấp khác nhau và chúng cần
    cách xử lý khác nhau. Kiểu thứ nhất là bám bẩn bề mặt: bụi và cặn khoáng
    đóng trên mặt tấm, làm giảm khả năng thấm nước và giảm diện tích tiếp xúc;
    trường hợp này thường làm sạch được bằng cách xả nước nhẹ nhàng theo chiều
    rãnh, và không được chà mạnh hay dùng vòi áp lực cao vì cấu trúc tổ ong dễ
    bẹp. Kiểu thứ hai là xuống cấp vật liệu: tấm ngậm nước lâu ngày rồi mục,
    mềm, mất hình dạng nếp gấp, hoặc bị nấm mốc ăn sâu; lúc này diện tích tiếp
    xúc thực tế đã giảm và nước không còn phân bố đều, nên rửa cũng không phục
    hồi được và phương án là thay. Tuổi thọ phụ thuộc chất lượng nước, môi
    trường bụi và số giờ chạy, nên không có mốc thời gian dùng chung; căn cứ
    đáng tin là quan sát trạng thái tấm và so hiệu quả làm mát với chính thiết
    bị đó trước đây. Về an toàn vệ sinh, tấm ẩm thường xuyên là nơi vi sinh vật
    phát triển, nên tấm đã ngậm mùi cũng là lý do thay dù nhìn bề ngoài còn
    nguyên hình.
