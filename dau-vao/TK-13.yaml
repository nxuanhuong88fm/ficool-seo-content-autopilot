nghien_cuu:
  van_ban: >-
    Quạt điều hòa làm mát bằng bay hơi: một bơm nhỏ đưa nước từ bình lên tưới đều
    trên tấm làm mát, quạt hút không khí đi xuyên qua tấm ướt, nước bay hơi và lấy
    nhiệt từ dòng khí đó nên khí ra mát hơn khí vào. Ba bộ phận cần làm sạch là
    bình nước, lưới lọc bụi và tấm làm mát, và điểm quan trọng nhất là ba bộ phận
    này đòi ba cách làm khác nhau, trong đó tấm làm mát là bộ phận mà cách làm theo
    bản năng sẽ phá hỏng nó. Tấm làm mát thường là vật liệu xenlulo dạng tổ ong,
    và khi ướt thì nó mềm nên việc chà mạnh làm bẹp các nếp gấp, mà diện tích bề
    mặt của các nếp gấp đó chính là thứ tạo ra hiệu quả bay hơi, nên hỏng này không
    hồi lại được; tia nước áp lực cao gây hậu quả tương tự. Ngoài ra chất tẩy có
    tính oxy hóa mạnh làm vật liệu xenlulo giòn và mục nhanh hơn. Cặn khoáng từ
    nước tích dần trên tấm làm giảm khả năng hút nước, và đây là lý do tấm làm mát
    là vật tư có tuổi thọ và phải thay chứ không phải chi tiết rửa mãi được. Bình
    nước là nguồn mùi thường gặp nhất vì nước đọng lâu sinh màng nhầy sinh học trên
    thành bình và trong đường ống dẫn, nên việc dốc cạn khi không dùng có tác dụng
    phòng ngừa lớn hơn việc cọ rửa khi đã có mùi. Một bước hay bị bỏ là sấy khô tấm
    làm mát trước khi cất máy: cho quạt chạy mà tắt bơm để dòng khí làm khô tấm,
    vì cất máy với tấm còn ẩm là tạo điều kiện cho nấm mốc phát triển trong suốt
    thời gian không dùng. Về vận hành, không nên để bơm chạy khi bình đã cạn vì bơm
    loại ngâm trong nước sẽ hỏng khi chạy khô. Cuối cùng, hiệu quả của nguyên lý
    bay hơi giảm khi độ ẩm không khí cao, nên đây là giới hạn thật của loại thiết
    bị này chứ không phải dấu hiệu máy bẩn.
