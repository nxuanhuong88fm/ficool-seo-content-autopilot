nghien_cuu:
  van_ban: >-
    Nghiệm thu thiết bị lạnh có một khó khăn riêng không xuất hiện ở phần lớn
    thiết bị gia dụng khác: hạng mục quan trọng nhất là nhiệt độ trong khoang thì
    lại không thể kiểm tra ở thời điểm bàn giao, vì tủ cần nhiều giờ để hạ nhiệt
    tới mức cài đặt, và thời gian đó còn dài hơn nếu trong tủ đã có hàng hoặc nếu
    tủ vừa được xả tuyết. Do đó việc nghiệm thu buộc phải tách làm hai phần: phần
    kiểm được ngay khi kỹ thuật viên còn tại chỗ, và phần chỉ kiểm được sau nhiều
    giờ, kèm thoả thuận trước về cách xử lý nếu phần sau không đạt. Nhóm hạng mục
    kiểm được ngay gồm những thứ mang tính cơ khí, điện và nước: máy nén có khởi
    động và có ngắt theo chu kỳ chứ không chạy liên tục, quạt dàn lạnh và quạt
    dàn nóng đều quay, gioăng cửa ăn khít đều trên toàn chu vi, cửa hoặc nắp tự
    đóng lại từ vị trí hé, đường thoát nước ngưng thông, không có nước đọng dưới
    chân tủ và không có vết dầu lạnh quanh các mối nối. Độ cân bằng của tủ là
    hạng mục hay bị bỏ qua nhưng ảnh hưởng tới hai thứ cùng lúc: cửa không tự
    đóng nếu tủ bị nghiêng, và nước ngưng không chảy đúng hướng về khay hứng.
    Về an toàn điện, ổ cấp nguồn cho tủ cần có tiếp địa và thiết bị chống dòng rò,
    và nút thử trên thiết bị chống dòng rò là cách kiểm tra tại chỗ. Với tủ vừa
    được vận chuyển hoặc di dời, dầu trong máy nén cần thời gian lắng lại trước
    khi cấp điện, nên việc cắm điện ngay sau khi đặt tủ xuống là một sai sót phổ
    biến. Về hồ sơ, những thông tin cần lấy trước khi kỹ thuật viên rời đi gồm
    danh mục hạng mục đã làm, linh kiện đã thay cùng linh kiện cũ được trả lại,
    phạm vi và thời hạn bảo hành được ghi rõ, và mức nhiệt độ ghi nhận tại thời
    điểm bàn giao để làm mốc đối chiếu cho những ngày sau.
