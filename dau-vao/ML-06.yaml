nghien_cuu:
  van_ban: >-
    Khi remote không điều khiển được máy lạnh, câu hỏi cần trả lời trước tiên là
    lỗi nằm ở remote hay ở máy. Remote hồng ngoại phát tín hiệu ở bước sóng mắt
    thường không thấy, nhưng camera điện thoại nhìn được: hướng đầu phát vào ống
    kính camera trước rồi bấm một phím, nếu thấy đèn nhấp nháy tím hoặc trắng
    thì remote còn phát. Đây là phép thử phân tách nhanh và không cần dụng cụ.
    Các nguyên nhân phía remote: pin yếu (dấu hiệu là màn hình mờ hoặc chỉ hoạt
    động khi đứng rất gần), tiếp điểm pin bị oxy hoá, phím cao su mòn, hoặc
    remote đã bị đặt sai chế độ. Các nguyên nhân phía máy: mắt nhận hồng ngoại
    trên dàn lạnh bị bụi che, ánh nắng chiếu thẳng vào mắt nhận gây nhiễu, đèn
    huỳnh quang hoặc đèn LED công suất lớn đặt gần cũng gây nhiễu, bo mạch nhận
    tín hiệu lỗi. Một trường hợp riêng: máy vẫn nhận lệnh (có tiếng bíp) nhưng
    không thực hiện, đó không phải lỗi remote mà là lỗi phía máy. Nhiều dòng máy
    có nút chạy khẩn cấp giấu dưới nắp dàn lạnh, dùng để chạy máy ở chế độ mặc
    định khi mất remote; nút này cũng là công cụ chẩn đoán tốt vì nó bỏ qua toàn
    bộ đường tín hiệu hồng ngoại. Về phòng ngừa, tránh để remote nơi nóng hoặc
    ẩm, và tháo pin nếu không dùng dài ngày để tránh pin chảy làm hỏng tiếp điểm.
