nghien_cuu:
  van_ban: >-
    Sấy quần áo là bài toán chuyển hơi ẩm từ vải ra khỏi lồng sấy, nên mọi
    nguyên nhân của việc "sấy không khô" đều quy về một trong hai chuyện: hơi ẩm
    không thoát được, hoặc không đủ nhiệt và không đủ dòng khí để đưa nó ra. Có
    ba kiểu máy sấy phổ biến và chúng xử lý hơi ẩm theo ba cách khác nhau, nên
    điểm hỏng cũng khác nhau. Máy thông hơi đẩy khí ẩm ra ngoài qua một đường
    ống, nên ống bị tắc, bị gập hoặc quá dài là nguyên nhân đặc trưng. Máy ngưng
    tụ làm lạnh khí ẩm để nước ngưng lại và chứa vào một bình, nên bình đầy hoặc
    bộ ngưng tụ bám xơ là điểm hỏng đặc trưng. Máy bơm nhiệt hoạt động theo
    nguyên lý tương tự máy ngưng tụ nhưng tái sử dụng nhiệt, chạy ở nhiệt độ
    thấp hơn và lâu hơn theo thiết kế, đồng thời thường có thêm bộ lọc thứ cấp
    và bộ trao đổi nhiệt cần vệ sinh định kỳ. Nguyên nhân chung cho cả ba loại,
    và cũng là nguyên nhân thường gặp nhất, là bộ lọc xơ vải bị bám kín làm giảm
    dòng khí đi qua lồng. Các nguyên nhân liên quan tới cách dùng gồm nhồi quá
    tải làm quần áo không đảo được, đồ đưa vào còn quá ướt do máy giặt vắt chưa
    kỹ, chọn chương trình không phù hợp với loại vải, và phòng đặt máy quá kín
    hoặc quá nóng làm giảm khả năng thải nhiệt. Nhóm cần kỹ thuật viên gồm cảm
    biến độ ẩm bẩn hoặc hỏng, bộ gia nhiệt yếu, và quạt thổi khí không đủ lực.
