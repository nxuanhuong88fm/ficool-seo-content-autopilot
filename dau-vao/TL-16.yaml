nghien_cuu:
  van_ban: >-
    Chọn dung tích tủ lạnh theo số người là cách phổ biến nhưng chỉ là điểm khởi
    đầu, vì nhu cầu thực tế phụ thuộc thói quen mua sắm và cách nấu ăn nhiều hơn
    là phụ thuộc số nhân khẩu. Quy tắc kinh nghiệm thường dùng là khoảng 50 tới
    80 lít cho mỗi người, cộng thêm một khoảng dự phòng; hộ hai người thường
    nằm trong khoảng 150 tới 250 lít, hộ ba tới bốn người khoảng 250 tới 400
    lít, hộ năm người trở lên từ 400 lít. Các yếu tố làm tăng nhu cầu: đi chợ
    hoặc siêu thị theo tuần thay vì mỗi ngày; trữ đông nhiều thịt cá; nấu ăn tại
    nhà phần lớn các bữa; có trẻ nhỏ cần trữ sữa và đồ ăn dặm; hay tiếp khách và
    nấu số lượng lớn; và trồng hoặc mua rau củ theo lô. Các yếu tố làm giảm nhu
    cầu: ăn ngoài thường xuyên; đi chợ mỗi ngày; nhà có tủ đông riêng. Về tỉ lệ
    giữa hai ngăn, hộ trữ đông nhiều nên ưu tiên model có ngăn đá lớn hoặc kiểu
    ngăn đá dưới; hộ dùng rau củ nhiều nên ưu tiên ngăn mát lớn với ngăn rau có
    kiểm soát độ ẩm. Một lưu ý về vận hành thường bị bỏ qua: dung tích ghi trên
    thông số là dung tích hình học, còn dung tích sử dụng thực tế nhỏ hơn vì
    khay, ngăn kéo và khoảng lưu thông khí chiếm chỗ; đồng thời tủ nên được lấp
    đầy khoảng ba phần tư để dòng khí lưu thông, nên khi tính nhu cầu cần trừ
    hao phần này. Về kích thước ngoài, cần đo cả lối đi và cửa ra vào để bảo
    đảm đưa được tủ vào vị trí, và cần chừa khoảng hở tản nhiệt theo hướng dẫn.
