nghien_cuu:
  van_ban: >-
    Máy giặt không cấp nước hoặc cấp nước yếu có đường kiểm tra ngược lại với
    lỗi xả: đi từ nguồn nước bên ngoài vào trong máy. Điểm đầu tiên nằm ngoài
    máy và hay bị bỏ qua nhất: van khoá nước cấp cho máy có mở hết không, và áp
    lực nước của nhà có đủ không. Nhiều máy giặt yêu cầu một mức áp lực tối
    thiểu để van cấp mở được; nhà dùng bồn chứa đặt thấp hoặc đang giờ cao điểm
    nước yếu đều có thể không đạt. Điểm thứ hai là ống cấp nước: bị gập, bị đè,
    hoặc lưới lọc ở đầu nối bị nghẹt do cặn vôi và rỉ sét từ đường ống. Lưới lọc
    này là một chi tiết nhỏ nằm ngay trong đầu nối phía máy, rất dễ bị bỏ quên
    và là nguyên nhân phổ biến của hiện tượng cấp nước yếu dần theo thời gian.
    Điểm thứ ba là van cấp nước điện từ bên trong máy: cuộn dây hỏng thì van
    không mở, biểu hiện là máy chờ mãi ở bước cấp nước rồi báo lỗi. Điểm thứ tư
    là cảm biến mực nước và bo mạch: máy hiểu sai mức nước hiện có nên không
    kích hoạt cấp, hoặc dừng sớm. Với máy có hai đầu cấp nóng lạnh mà nhà chỉ
    đấu một đầu, cần bịt kín đầu còn lại và chọn chương trình phù hợp, nếu không
    máy có thể chờ nước ở đầu không có nguồn. Về an toàn, khoá van nước trước
    khi tháo ống cấp, và chuẩn bị khăn vì nước trong ống sẽ chảy ra. Việc mở vỏ
    máy để kiểm tra van điện từ hoặc bo mạch cần thợ.
