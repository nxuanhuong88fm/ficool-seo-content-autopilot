nghien_cuu:
  van_ban: >-
    Bảo trì máy lạnh khác vệ sinh máy lạnh ở phạm vi: vệ sinh tập trung vào làm
    sạch, còn bảo trì là một lượt kiểm tra có danh sách hạng mục nhằm phát hiện
    sớm các dấu hiệu xuống cấp trước khi chúng thành sự cố. Tài liệu bảo dưỡng
    điều hoà của Bộ Năng lượng Hoa Kỳ nêu các hạng mục cốt lõi: lưới lọc, dàn
    trao đổi nhiệt ở cả hai phía, máng và đường thoát nước ngưng, cánh tản
    nhiệt, quạt, cùng phần đấu nối điện; và nhấn mạnh rằng dàn bám bụi hoặc
    lưới lọc tắc làm giảm khả năng trao đổi nhiệt, khiến máy chạy lâu hơn và
    tiêu thụ nhiều điện hơn để đạt cùng một kết quả. Với môi trường văn phòng và
    cơ sở kinh doanh, hai khác biệt so với hộ gia đình cần được tính vào lịch:
    số giờ chạy mỗi ngày cao hơn nhiều, và hậu quả của một lần ngừng hoạt động
    lớn hơn vì nó ảnh hưởng tới công việc hoặc tới khách. Do đó chu kỳ bảo trì ở
    nhóm này thường dày hơn và nên được lập thành lịch thay vì xử lý theo sự cố.
    Một điểm phân biệt quan trọng khác là môi chất lạnh: nó nằm trong hệ thống
    kín và không tiêu hao, nên "nạp gas" không phải hạng mục bảo trì định kỳ; sự
    sụt giảm lượng môi chất là dấu hiệu rò rỉ cần tìm nguyên nhân. Về ghi chép,
    việc lưu lại ngày thực hiện và hạng mục đã làm cho phép so sánh giữa các kỳ
    và phát hiện xu hướng xuống cấp, thứ mà một lượt kiểm tra đơn lẻ không cho
    thấy.
