nghien_cuu:
  van_ban: >-
    Rung lắc mạnh khi vắt có hai nhóm nguyên nhân với mức độ nghiêm trọng rất
    khác nhau. Nhóm lắp đặt và sử dụng chiếm phần lớn số ca: máy chưa tháo bu
    lông vận chuyển sau khi mua, chân máy chưa chỉnh cân, sàn không phẳng hoặc
    quá mềm, máy kê sát tường hoặc sát vật khác, tải giặt lệch do nhồi quá nhiều
    hoặc giặt một món nặng duy nhất. Bu lông vận chuyển là chi tiết đáng chú ý
    nhất: nhà sản xuất lắp chúng để cố định lồng giặt khi vận chuyển, và bắt
    buộc phải tháo trước lần giặt đầu tiên; quên tháo khiến máy rung dữ dội và
    có thể làm hỏng hệ thống treo. Nhóm linh kiện gồm: bạc đạn lồng giặt mòn,
    biểu hiện là tiếng rít hoặc tiếng gầm tăng dần theo tốc độ vắt; lò xo treo
    lồng giãn hoặc gãy; giảm chấn mòn, khiến lồng dao động lâu hơn bình thường
    sau khi ngừng; đối trọng bê tông bị nứt hoặc bu lông giữ đối trọng lỏng, gây
    tiếng va đập nặng. Phân biệt hai nhóm bằng một phép thử đơn giản: chạy chu
    trình vắt với lồng rỗng. Nếu lồng rỗng vẫn rung mạnh và kêu to thì nguyên
    nhân nghiêng về linh kiện hoặc kê máy, không phải do tải. Ngoài ra có thể
    đẩy nhẹ bốn góc máy để kiểm tra bập bênh, và dùng thước nivo đặt trên nắp
    máy để kiểm tra thăng bằng. Rung mạnh kéo dài làm mòn bạc đạn nhanh hơn và
    làm lỏng các mối ghép, nên không nên để tình trạng này kéo dài.
