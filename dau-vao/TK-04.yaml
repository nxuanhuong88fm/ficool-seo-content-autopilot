nghien_cuu:
  van_ban: >-
    Việc vệ sinh máy sấy quần áo không có một quy trình dùng chung cho mọi model,
    vì bộ phận quyết định hiệu suất sấy khác nhau theo nguyên lý của từng loại
    máy: máy thông hơi đẩy khí ẩm ra ngoài qua đường ống nên điểm nghẽn nằm ở
    đường ống đó, máy ngưng tụ có khối ngưng tụ tháo ra rửa được, còn máy bơm
    nhiệt có một bộ lọc mịn thứ hai cùng dàn bay hơi nằm phía sau cửa nhỏ ở chân
    máy. Bộ phận thứ hai này là chỗ nhiều người dùng không biết là có, và khi nó
    bị xơ vải bít thì biểu hiện là thời gian sấy dài dần cùng điện tiêu thụ tăng,
    trong khi bộ lọc ở cửa vẫn sạch nên không ai nghĩ tới nguyên nhân đó. Với bộ
    lọc xơ vải ở cửa, ngoài lớp xơ nhìn thấy được còn một hiện tượng khó nhận ra
    hơn: cặn của nước xả làm mềm vải tạo thành một màng gần như trong suốt bám
    trên mặt lưới, làm giảm lưu lượng khí đi qua trong khi mắt thường thấy lưới
    vẫn sạch, và cách kiểm tra là dội nước lên lưới xem nước có chảy xuyên qua
    hay đọng lại thành vũng. Một chi tiết nhỏ khác có ảnh hưởng lớn là cảm biến
    độ ẩm, thường là hai dải kim loại đặt trong lồng sấy hoặc gần khoang lọc: khi
    bị màng cặn bám lên, cảm biến đọc sai và máy kết thúc chu trình sớm nên quần
    áo còn ẩm dù máy báo đã xong, và việc làm sạch chỉ cần một khăn mềm. Về những
    điều cần tránh, dàn bay hơi của máy bơm nhiệt có các lá nhôm rất mỏng nên
    không dùng vật cứng hay tia nước áp lực cao, bề mặt nhựa và lồng sấy không
    dùng chất tẩy mạnh hay vật liệu nhám, và không được chạy máy khi đã tháo bộ
    lọc ra vì xơ vải sẽ đi thẳng vào bên trong máy. Ngoài ra bình nước của máy
    ngưng tụ và máy bơm nhiệt cần được dốc cạn và làm sạch, vì nước đọng lâu sinh
    mùi và màng nhầy.
