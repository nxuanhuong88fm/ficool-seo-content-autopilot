nghien_cuu:
  van_ban: >-
    Xếp chồng máy sấy lên máy giặt là cách tiết kiệm diện tích phổ biến, nhưng
    nó chỉ an toàn khi đủ ba điều kiện. Điều kiện thứ nhất là thứ tự: máy giặt
    luôn nằm dưới và máy sấy nằm trên, vì máy giặt nặng hơn nhiều khi chứa nước
    và rung mạnh khi vắt, còn máy sấy nhẹ hơn và không có tải nước. Đảo thứ tự
    là đặt một khối rung mạnh lên trên một khối nhẹ hơn. Điều kiện thứ hai là bộ
    phụ kiện xếp chồng chuyên dụng của hãng hoặc loại tương thích với cặp máy
    đó: bộ này khoá hai máy vào nhau và phân bố lực, còn xếp chồng trực tiếp thì
    máy trên chỉ tì lên mặt máy dưới và có thể trượt khi máy giặt vắt. Điều kiện
    thứ ba là cả hai máy phải là loại cửa trước, vì máy giặt cửa trên cần mở nắp
    phía trên nên không thể có thiết bị nào nằm bên trên. Ngoài ba điều kiện đó
    còn có các yêu cầu về kết cấu và thao tác: sàn phải phẳng và cứng vì tổng
    trọng lượng hai máy dồn xuống cùng một diện tích nhỏ; máy giặt bên dưới phải
    được kê cân trước khi đặt máy sấy lên, do rung của máy dưới truyền thẳng lên
    máy trên; cần chừa khoảng mở cửa cho cả hai máy; và bảng điều khiển cùng cửa
    máy trên phải nằm trong tầm với. Về vận hành, hai máy chồng lên nhau vẫn cần
    khe hở thải nhiệt và đường thoát riêng theo kiểu máy sấy, đồng thời cần tính
    trước việc bảo trì vì tháo máy trên xuống là công việc hai người.
