nghien_cuu:
  van_ban: >-
    Quạt điều hòa giữ một lượng nước đọng trong bình và một tấm vật liệu luôn
    ẩm, đặt trong dòng khí ấm — đây là tổ hợp điều kiện thuận lợi cho vi sinh
    vật và nấm mốc phát triển, nên mùi hôi ở thiết bị này là vấn đề vệ sinh chứ
    hiếm khi là hỏng hóc. Tài liệu về nấm mốc của EPA nêu nguyên tắc chung là
    mốc phát triển ở nơi có ẩm đọng, và cách xử lý bền vững là loại bỏ nguồn ẩm
    cùng vật liệu đã nhiễm, chứ không phải che mùi bằng hương liệu. Áp vào thiết
    bị này, các nguồn mùi thường gặp gồm: nước cũ nằm lại nhiều ngày trong bình,
    nhất là khi máy nghỉ giữa các đợt nóng; màng nhớt sinh học bám ở đáy bình,
    thành bình và trong ống dẫn; tấm làm mát đã ngậm bụi và vi sinh vật, do bụi
    trong không khí bị dòng khí đẩy thẳng vào một bề mặt luôn ẩm; lưới lọc bụi
    phía sau bám bẩn rồi ẩm theo; và các khe khuất trong khoang chứa nước. Một
    yếu tố làm mùi nặng hơn là để máy tắt với bình còn nước và tấm còn ướt trong
    môi trường kín, vì lúc đó không còn dòng khí làm khô bề mặt. Về xử lý, thứ
    tự có ý nghĩa: xả sạch nước, vệ sinh bình và các bề mặt tiếp xúc nước, vệ
    sinh hoặc thay tấm làm mát nếu tấm đã ngậm mùi hoặc đã mục, rồi để mọi bộ
    phận khô hoàn toàn trước khi lắp lại. Dùng chất tẩy mạnh không được khuyến
    khích vì thiết bị thổi khí trực tiếp vào không gian sống, và mùi hoá chất sẽ
    theo dòng khí đó ra phòng.
