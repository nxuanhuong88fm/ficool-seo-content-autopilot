nghien_cuu:
  van_ban: >-
    Tủ lạnh là thiết bị luôn phát ra âm thanh khi hoạt động, và phần lớn các âm
    thanh đó nằm trong thiết kế. Nhóm âm thanh bình thường gồm: tiếng ù đều của
    block máy nén khi chạy; tiếng gió nhẹ của quạt dàn lạnh và quạt dàn ngưng;
    tiếng róc rách hoặc ục ục của môi chất lạnh di chuyển trong ống, rõ nhất
    ngay sau khi block ngừng; tiếng lách tách hoặc răng rắc do vật liệu co giãn
    theo nhiệt độ, thường nghe rõ vào ban đêm khi phòng yên; tiếng xèo nhẹ khi
    nước tan trong chu kỳ xả tuyết rơi xuống bộ phận nóng; và với tủ có bộ làm
    đá là tiếng đá rơi vào khay. Nhóm âm thanh bất thường gồm: tiếng va đập kim
    loại có nhịp, thường do quạt chạm vật cản hoặc cánh quạt cong; tiếng rít cao
    kéo dài, nghiêng về bạc đạn quạt khô dầu; tiếng ù rất to kèm rung mạnh cả
    thân tủ, nghiêng về giá đỡ block lỏng hoặc cao su giảm chấn chai; tiếng gõ
    lặp lại khi block khởi động, có thể liên quan tới rơ le khởi động; và tiếng
    ồn tăng dần qua nhiều tháng. Yếu tố ngoài máy hay bị bỏ qua: tủ kê không cân
    làm rung truyền xuống sàn; tủ kê sát tường hoặc sát tủ bếp làm âm cộng hưởng;
    vật đặt trên nóc tủ rung theo; khay hứng nước phía sau lệch vị trí. Cách
    khoanh vùng đơn giản là xác định tiếng phát ra từ phía sau, từ bên trong
    khoang, hay từ chân tủ, và ghi lại tiếng đó xuất hiện lúc block chạy hay lúc
    block vừa ngừng.
