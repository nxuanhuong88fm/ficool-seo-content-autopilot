nghien_cuu:
  van_ban: >-
    Gioăng cao su ở cửa máy giặt cửa trước là bộ phận giữ kín nước trong lúc
    giặt, và cấu tạo của nó gồm nhiều nếp gấp để chịu được chuyển động của lồng.
    Chính các nếp gấp đó tạo ra những khoang nhỏ nơi nước, cặn xà phòng và xơ
    vải đọng lại sau mỗi chu trình. Tài liệu về nấm mốc của EPA nêu nguyên tắc
    chung là mốc phát triển ở nơi có ẩm đọng và cách xử lý bền vững là loại bỏ
    nguồn ẩm cùng vật liệu đã nhiễm, chứ không phải khử mùi bề mặt; áp vào máy
    giặt cửa trước, điều đó có nghĩa là việc lau khô nếp gioăng sau khi giặt có
    tác dụng phòng ngừa lớn hơn mọi biện pháp xử lý sau khi mốc đã hình thành.
    Các yếu tố làm mốc phát triển nhanh hơn gồm: đóng kín cửa máy ngay sau khi
    giặt khiến hơi ẩm ở lại trong lồng và trong gioăng; dùng quá nhiều bột hoặc
    nước giặt làm phần dư đọng thành cặn nuôi vi sinh vật; giặt liên tục ở nước
    lạnh; và để quần áo ẩm trong lồng sau khi chu trình kết thúc. Về cách làm
    sạch, cần lật từng nếp gioăng ra để tiếp cận khoang bên trong, lau bằng khăn
    với dung dịch nhẹ rồi lau khô; không dùng vật sắc để cạo vì vết rách trên
    gioăng dẫn tới rò nước, và cũng không nên dùng chất tẩy mạnh vì cao su có
    thể bị lão hoá nhanh hơn. Khi gioăng đã rách, thủng hoặc mất đàn hồi thì
    việc làm sạch không phục hồi được và phương án là thay.
