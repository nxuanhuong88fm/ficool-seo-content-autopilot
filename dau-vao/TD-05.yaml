nghien_cuu:
  van_ban: >-
    Một chiếc tủ đông dùng máy nén thường có chu kỳ chạy và nghỉ: máy nén chạy
    cho tới khi khoang đạt nhiệt độ cài đặt rồi ngắt, và chạy lại khi nhiệt độ
    nhích lên. Tỉ lệ thời gian chạy trên tổng thời gian phụ thuộc tải nhiệt, nên
    chạy nhiều không đồng nghĩa với hỏng. Các tình huống làm tủ chạy gần như
    liên tục mà không có linh kiện nào hỏng gồm: vừa nạp một lượng lớn thực phẩm
    chưa đông, mở nắp nhiều lần hoặc mở lâu, nhiệt độ phòng cao, tủ đặt sát
    tường hoặc trong góc kín khiến dàn nóng không thải được nhiệt, dàn nóng bám
    bụi, gioăng nắp hở làm khí lạnh thoát liên tục, lớp tuyết dày cản trao đổi
    nhiệt, và cài đặt lạnh hơn mức cần. Nhóm hư hỏng thật gồm bộ điều nhiệt hoặc
    cảm biến sai khiến máy không nhận được tín hiệu ngắt, quạt không quay ở các
    model có quạt, và các sự cố thuộc hệ thống kín như thiếu môi chất do rò rỉ
    hoặc máy nén yếu; ở nhóm sau, máy chạy liên tục nhưng nhiệt độ vẫn không đạt
    mốc. Một điểm dễ gây hiểu nhầm là các model dùng máy nén biến tần được thiết
    kế để chạy liên tục ở công suất thấp thay vì tắt bật theo chu kỳ, nên với
    những model này việc máy không ngắt là hành vi bình thường. Phép phân biệt
    đáng tin nhất là đo nhiệt độ thực trong khoang bằng nhiệt kế: chạy liên tục
    mà vẫn đạt mốc thì nghiêng về tải sử dụng, còn chạy liên tục mà không đạt
    mốc thì nghiêng về hư hỏng.
