nghien_cuu:
  van_ban: >-
    Di dời máy lạnh là hai công việc ghép lại: tháo ở nơi cũ và lắp ở nơi mới,
    và phần lớn hư hỏng phát sinh ở bước tháo chứ không phải bước lắp. Bước
    quyết định là thu hồi môi chất lạnh về dàn nóng, thường gọi là pump down.
    Quy trình: cho máy chạy chế độ làm lạnh, đóng van phía ống nhỏ để môi chất
    bị hút hết về dàn nóng, chờ rồi đóng tiếp van phía ống lớn, sau đó mới tắt
    máy và tháo ống. Bỏ qua bước này thì toàn bộ môi chất xả ra không khí, vừa
    lãng phí vừa buộc phải nạp lại ở nơi mới. Sau khi tháo, hai đầu ống đồng và
    hai cổng van phải được bịt kín ngay, vì hơi ẩm và bụi lọt vào hệ thống là
    nguyên nhân gây tắc ẩm và ăn mòn về sau. Ống đồng cũ tái sử dụng được nếu
    còn nguyên vẹn, không bị bẹp, không gãy gập; đoạn loe ở đầu ống thường phải
    cắt bỏ và loe lại vì loe cũ đã biến dạng theo lực siết. Ở nơi mới, quy trình
    lắp gồm: cố định giá đỡ, đi ống, kết nối, thử kín, hút chân không để rút hết
    không khí và hơi ẩm ra khỏi đường ống, rồi mới mở van cho môi chất vào. Hút
    chân không là bước không được bỏ qua, kể cả khi máy cũ và ống cũ. Nếu chiều
    dài ống ở vị trí mới lớn hơn ở vị trí cũ, có thể phải bổ sung môi chất theo
    chỉ dẫn của hãng. Các rủi ro khác khi vận chuyển: đặt dàn nóng nằm nghiêng
    quá lâu làm dầu bôi trơn trong block chảy sai chỗ; va đập làm móp mặt lưới
    dàn ngưng; mất các phụ kiện nhỏ như đệm cao su, ốc giá đỡ.
