nghien_cuu:
  van_ban: >-
    Máy nước nóng là thiết bị đặt điện và nước cạnh nhau trong một không gian
    ẩm, nên rò điện ở đây thuộc nhóm sự cố phải xử lý theo thứ tự an toàn trước,
    chẩn đoán sau. Cơ chế phổ biến là lớp cách điện của thanh đốt bị suy giảm:
    thanh đốt nhúng trực tiếp trong nước, và khi lớp cách điện nứt hoặc mòn thì
    dòng điện có đường đi qua nước ra vỏ máy, ra đường ống kim loại và tới vòi
    sen. Các nguyên nhân khác gồm hơi ẩm lọt vào hộp đấu điện, dây dẫn lão hoá
    hoặc đấu nối lỏng, và ăn mòn tại các điểm tiếp xúc. Hai lớp bảo vệ tồn tại
    song song và không thay thế cho nhau: dây tiếp địa dẫn dòng rò xuống đất để
    dòng đó không đi qua người, còn thiết bị chống dòng rò kiểu ELCB hoặc RCD
    thì ngắt mạch khi phát hiện chênh lệch dòng vào và dòng ra. Thiếu tiếp địa
    thì thiết bị chống rò vẫn có thể ngắt, nhưng thời gian trước khi nó ngắt là
    thời gian dòng điện đã có đường đi qua người dùng. Về dấu hiệu, cảm giác tê
    khi chạm vào vòi, vòi sen hoặc thân máy là dấu hiệu cần ngừng sử dụng ngay
    lập tức; thiết bị chống rò ngắt lặp lại sau mỗi lần bật cũng vậy. Bút thử
    điện thông thường không phải công cụ kết luận an toàn: nó có thể sáng do
    điện cảm ứng khi không có rò thật, và có thể không sáng trong một số cấu
    hình dù vẫn có dòng rò. Phép đo có căn cứ là đo điện trở cách điện bằng
    thiết bị chuyên dụng và kiểm tra tính liên tục của dây tiếp địa, đều thuộc
    phần việc của kỹ thuật viên.
