nghien_cuu:
  van_ban: >-
    Tủ mát dùng trong bán hàng khác tủ lạnh gia đình ở điều kiện vận hành: cửa
    được mở rất nhiều lần trong ngày, hàng hoá thường được xếp dày và sát thành
    sau, và tủ hay đặt trong không gian có nhiệt độ môi trường cao. Vì vậy khi
    tủ mát không đạt độ lạnh, nhóm nguyên nhân liên quan tới sử dụng và lắp đặt
    cần được loại trừ trước nhóm hỏng hóc. Các mục kiểm ban đầu gồm: nguồn điện
    và tình trạng aptomat, ổ cắm; mức cài đặt trên bảng điều khiển và khả năng
    ai đó đã chỉnh nhầm; độ kín của cửa, tình trạng gioăng và việc cửa có tự
    đóng lại hay không; hàng hoá xếp chặn cửa gió ở thành sau hoặc thành trên,
    vốn tạo vùng ấm cục bộ ngay cả khi máy chạy tốt; khoảng hở thải nhiệt quanh
    dàn nóng và mức bụi bám trên dàn; nhiệt độ môi trường nơi đặt tủ, vì mỗi
    model có giới hạn nhiệt độ môi trường mà ngoài khoảng đó khả năng làm lạnh
    giảm; và việc vừa nạp một lượng lớn hàng chưa lạnh. Mốc an toàn thực phẩm
    cho khoang mát được các cơ quan quản lý khuyến cáo là từ 4 độ C trở xuống,
    và đây là nhiệt độ thực đo bằng nhiệt kế chứ không phải nấc trên bảng điều
    khiển; cách đo phản ánh sát nhất là đặt nhiệt kế trong một cốc nước ở giữa
    khoang. Nhóm cần kỹ thuật viên gồm quạt dàn lạnh hoặc quạt dàn ngưng không
    quay, dàn lạnh bám tuyết dày, bộ điều nhiệt và cảm biến sai, và các sự cố
    thuộc hệ thống kín.
