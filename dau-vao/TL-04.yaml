nghien_cuu:
  van_ban: >-
    Nước xuất hiện ở tủ lạnh cần được phân loại theo vị trí trước, vì hai vị trí
    chính ứng với hai nhóm nguyên nhân hoàn toàn khác nhau. Nước đọng bên TRONG
    tủ, thường ở đáy ngăn mát, phần lớn do lỗ thoát nước ngưng bị nghẹt. Tủ lạnh
    luôn sinh nước ngưng trong quá trình hoạt động; nước này chảy theo một rãnh
    ở thành sau xuống một lỗ nhỏ, rồi theo ống dẫn xuống khay bay hơi đặt gần
    block ở phía sau, nơi nhiệt từ block làm nước bay hơi. Khi lỗ hoặc ống bị
    nghẹt bởi mảnh thực phẩm, cặn bẩn hoặc đá, nước tràn ngược ra đáy ngăn mát
    và có thể đóng băng ở đó. Nước dưới GẦM tủ có bốn nguyên nhân thường gặp:
    khay bay hơi bị nứt hoặc lệch vị trí; ống dẫn nước ngưng tuột khỏi khay;
    lượng nước ngưng vượt khả năng bay hơi do cửa mở nhiều hoặc do độ ẩm cao; và
    với tủ có bộ làm đá hoặc bình lọc nước thì là rò rỉ ở đường nước cấp. Nước
    đọng quanh viền cửa hoặc chảy dọc mặt ngoài thường không phải rò rỉ mà là
    hơi ẩm ngưng tụ trên bề mặt lạnh, hay gặp trong những ngày nồm ẩm; trường
    hợp này liên quan tới gioăng cửa và độ ẩm phòng chứ không phải hỏng hóc. Về
    an toàn, nước gần ổ cắm hoặc dây điện là tình huống cần rút điện trước khi
    xử lý. Người dùng thông được lỗ thoát ở đáy ngăn mát bằng cách đổ nước ấm
    hoặc dùng dây mềm chuyên dụng; các can thiệp phía sau tủ cần thợ.
