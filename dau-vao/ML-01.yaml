nghien_cuu:
  van_ban: >-
    Máy lạnh chạy nhưng không làm lạnh là nhóm triệu chứng có nhiều nguyên nhân
    khác nhau, và phần lớn không phải hết gas. Bốn nhóm nguyên nhân thường gặp:
    (1) cài đặt sai chế độ — remote đang ở Fan hoặc Dry thay vì Cool, hoặc nhiệt
    độ đặt cao hơn nhiệt độ phòng; (2) dòng khí bị cản — lưới lọc bám bụi dày,
    dàn lạnh bẩn, dàn nóng bị che chắn hoặc đặt sát tường; (3) nguồn điện và
    thiết bị bảo vệ — điện áp thấp, CB ngắt, tụ khởi động dàn nóng hỏng khiến
    block không chạy; (4) hệ thống gas — rò rỉ tại mối nối hoặc ống đồng, dấu
    hiệu điển hình là dàn lạnh đóng tuyết cục bộ hoặc ống đồng đọng sương bất
    thường. Các tài liệu kỹ thuật của nhà sản xuất đều khuyến cáo người dùng chỉ
    tự thực hiện các bước kiểm tra không cần mở vỏ máy: kiểm tra remote, kiểm
    tra CB, tháo lưới lọc rửa sạch, dọn vật cản quanh dàn nóng. Các thao tác
    liên quan tới điện bên trong, gas, tụ điện hoặc block đều cần thợ có chuyên
    môn vì có rủi ro điện giật và làm hỏng nặng thêm. Một chi tiết quan trọng để
    phân biệt: nếu dàn nóng không chạy (không nghe tiếng block, quạt không quay)
    thì vấn đề nghiêng về điện hoặc tụ; nếu dàn nóng chạy nhưng gió ra không mát
    thì nghiêng về gas hoặc tắc nghẽn dòng khí. Gas máy lạnh không tiêu hao
    trong quá trình sử dụng bình thường — nó chỉ giảm khi có rò rỉ, nên "nạp gas
    định kỳ" là quan niệm sai.
