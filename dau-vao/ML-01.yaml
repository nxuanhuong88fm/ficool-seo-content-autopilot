nghien_cuu:
  van_ban: |
    Cơ chế: dàn lạnh làm hơi ẩm trong không khí ngưng tụ thành nước. Nước rơi xuống máng hứng
    rồi theo ống thoát ra ngoài. Bất cứ thứ gì chặn dòng đó đều làm nước tràn vào nhà.

    Bốn nhóm nguyên nhân được cả Trane và Carrier nêu trùng nhau:
    (1) ống thoát nước bị nghẹt do bụi, nấm mốc, mạng nhện tích tụ khi không vệ sinh định kỳ;
    (2) máng hứng nước bị nứt hoặc ăn mòn theo thời gian, nước rỉ thẳng xuống sàn;
    (3) dàn lạnh đóng băng rồi tan ra, lượng nước vượt quá sức chứa của máng — thường do lọc
    gió bẩn làm nghẽn luồng khí, hoặc do thiếu gas;
    (4) dàn nóng hỏng, kéo theo mất cân bằng cả hệ.

    Việc người dùng tự làm được: kiểm tra và thay lọc gió, giữ khu vực quanh máng sạch, quan
    sát ống thoát. Việc phải để kỹ thuật viên: xử lý dàn đóng băng, máng nứt, và mọi thứ liên
    quan tới gas hoặc mạch điện. Cả hai nguồn đều khuyên NGẮT MÁY trước khi kiểm tra, vì để
    máy chạy tiếp làm nước tràn thêm.

    Lưu ý riêng cho TP.HCM: khí hậu nóng ẩm quanh năm nên lượng nước ngưng tụ lớn và bụi tích
    nhanh hơn vùng khô. Nhà ống và chung cư thường đặt dàn lạnh ở vị trí khó với tới.
