nghien_cuu:
  van_ban: >-
    Hai bên hông tủ lạnh ấm hoặc nóng lên khi máy chạy là hiện tượng theo thiết
    kế ở nhiều model hiện nay, và việc không biết điều này khiến người dùng lo
    lắng không cần thiết. Nguyên nhân: để làm mỏng vỏ tủ và tăng dung tích bên
    trong, nhiều nhà sản xuất bố trí một phần ống dàn ngưng chạy dọc trong thành
    hông thay vì đặt toàn bộ dàn ngưng ở lưng tủ. Ống này mang môi chất nóng đi
    qua để thải nhiệt ra vỏ, nên thành hông ấm lên là dấu hiệu hệ thống đang
    hoạt động. Một số model còn có ống chống đọng sương chạy quanh viền cửa hoặc
    quanh vách ngăn giữa hai ngăn, làm khu vực đó ấm hơn để tránh hơi nước ngưng
    tụ. Mức nhiệt bình thường là ấm tới hơi nóng khi chạm tay, và giảm xuống khi
    block nghỉ. Dấu hiệu bất thường gồm: nóng tới mức không chạm tay lâu được;
    nóng nhưng tủ không lạnh hoặc lạnh yếu; nóng kèm block chạy liên tục không
    nghỉ; nóng kèm tiếng lạ hoặc mùi khét; và nóng tập trung ở một điểm nhỏ thay
    vì trải đều. Các yếu tố làm tình trạng nặng thêm mà người dùng kiểm được:
    tủ kê sát tường hoặc sát tủ bếp không đủ khoảng hở tản nhiệt; kê trong hốc
    kín; nhiệt độ phòng cao; dàn nóng ở lưng bám bụi dày; và đặt vật che chắn
    hai bên hông. Về an toàn, không nên phủ khăn hay đặt vật liệu cách nhiệt lên
    hai bên hông với ý định giảm nóng, vì việc đó chặn đúng con đường thoát
    nhiệt và làm block phải chạy nhiều hơn.
