nghien_cuu:
  van_ban: >-
    Di dời máy nước nóng khác di dời phần lớn thiết bị gia dụng ở chỗ nó phải
    được tháo rời khỏi ba hệ thống cùng lúc: điện, cấp nước và thoát nước của
    van an toàn. Trình tự an toàn bắt đầu bằng ngắt nguồn tại aptomat và khoá
    van cấp, sau đó xả hết nước trong bình trước khi tháo khỏi giá treo, vì bình
    đầy nước nặng hơn rất nhiều và không thể khiêng an toàn. Việc xả cần mở một
    vòi nước nóng để khí vào thay chỗ nước, nếu không nước sẽ thoát rất chậm.
    Quá trình tháo cũng là dịp duy nhất trong nhiều năm nhìn được các bộ phận
    khuất: mặt bích và gioăng, tình trạng thanh đốt, mức cặn trong bình, và
    thanh magie còn lại bao nhiêu; vì phần lớn chi phí của những hạng mục này
    nằm ở công tháo lắp, nên gộp chúng vào cùng lượt di dời thường hợp lý hơn
    làm riêng về sau. Tại vị trí mới, các yêu cầu giống hệt lắp mới: tường chịu
    lực, giá treo và bu lông đúng loại và không tái sử dụng bu lông đã tháo,
    khoảng thao tác để sau này rút được thanh đốt, van khoá và van an toàn với
    đường xả dẫn tới nơi thoát nước, cùng nguồn điện riêng có tiếp địa và thiết
    bị chống dòng rò. Sau khi lắp lại, phải cấp nước cho bình đầy và xả hết khí
    qua một vòi nước nóng rồi mới cấp điện; cấp điện khi bình chưa đầy làm thanh
    đốt chạy khô và hỏng. Với máy làm nóng trực tiếp, không có bình nên không có
    bước xả nước, nhưng yêu cầu về điện và về lưu lượng tại vị trí mới vẫn phải
    kiểm.
