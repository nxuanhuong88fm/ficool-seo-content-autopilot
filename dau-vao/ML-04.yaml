nghien_cuu:
  van_ban: >-
    Tiếng ồn bất thường ở máy lạnh phân loại được theo hai trục: tiếng phát ra
    từ đâu (dàn lạnh trong nhà hay dàn nóng ngoài trời) và tiếng thuộc kiểu gì
    (rít, lạch cạch, ù rung, va đập kim loại, ục ục như nước chảy). Ở dàn lạnh,
    tiếng lạch cạch nhẹ theo nhịp thường do cánh đảo gió va vào vỏ hoặc do vật
    lạ lọt vào lồng quạt; tiếng rít cao thường do bạc đạn quạt khô dầu; tiếng ục
    ục như nước chảy thường là môi chất lạnh di chuyển, phần lớn là bình thường
    và không đáng lo nếu nhẹ và không kèm giảm độ lạnh. Ở dàn nóng, tiếng ù rung
    mạnh truyền vào tường thường do giá đỡ lỏng ốc, cao su giảm chấn dưới chân
    block bị chai hoặc thiếu, hoặc dàn nóng đặt trực tiếp lên bề mặt cứng không
    có đệm; tiếng va đập kim loại theo chu kỳ có thể do cánh quạt cong hoặc chạm
    vỏ; tiếng ồn tăng dần theo thời gian thường liên quan tới block. Cách lắp
    đặt là nguyên nhân bị bỏ qua nhiều nhất: giá đỡ bắt vào tường gạch rỗng,
    ống đồng chạy sát tường không có kẹp, và dàn nóng đặt trong hộp kỹ thuật
    kín đều khuếch đại rung thành tiếng ồn nghe rõ trong nhà. Rung mạnh kéo dài
    còn làm lỏng mối nối ống đồng theo thời gian, dẫn tới rò rỉ môi chất lạnh.
    Người dùng chỉ nên tự kiểm tra phần bên ngoài: vật lạ quanh dàn nóng, ốc giá
    đỡ có lỏng nhìn thấy được không, cánh đảo gió có bị kẹt không. Mở vỏ máy,
    chỉnh cánh quạt hay siết lại chân block là việc của thợ.
