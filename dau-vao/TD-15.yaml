nghien_cuu:
  van_ban: >-
    Mốc an toàn thực phẩm cho khoang mát được các cơ quan quản lý khuyến cáo là
    từ 4 độ C trở xuống, vì trong khoảng nhiệt độ từ khoảng 4 tới 60 độ C vi
    khuẩn phát triển nhanh. Đây là nhiệt độ THỰC bên trong khoang chứ không phải
    nấc trên bảng điều khiển; nhiều tủ mát chỉ có núm xoay hoặc dãy nấc không
    hiển thị nhiệt độ, và các nấc đó là mức tương đối. Cách đo phản ánh sát nhất
    là đặt nhiệt kế trong một cốc nước ở giữa khoang, đóng cửa và chờ nhiều giờ
    mà không mở, vì nhiệt độ không khí trong tủ dao động mạnh theo mỗi lần mở
    cửa còn nhiệt độ nước phản ánh sát hơn nhiệt độ hàng hoá đang ở. Hai hướng
    sai lệch đều có hậu quả riêng: cài không đủ lạnh làm hàng nằm trong vùng
    nhiệt độ rủi ro, còn cài lạnh hơn mức cần không bảo quản tốt hơn mà làm máy
    nén chạy nhiều hơn, tăng điện năng, làm bề mặt dàn lạnh xuống thấp hơn nên
    bám tuyết nhanh hơn, và có thể làm đóng băng cục bộ những món đặt gần cửa
    gió. Các yếu tố buộc phải điều chỉnh theo gồm nhiệt độ môi trường thay đổi
    theo mùa và theo giờ trong ngày, tần suất mở cửa ở giờ cao điểm bán hàng,
    mức lấp đầy của tủ, và việc vừa nạp một lượng lớn hàng chưa lạnh. Về sắp
    xếp, hàng hoá che cửa gió tạo vùng ấm cục bộ ngay cả khi cài đặt đúng, nên
    cần chừa khoảng trống trước các cửa gió. Sau mỗi lần điều chỉnh, cần chờ tủ
    ổn định rồi mới đo lại, vì đo ngay sau khi vặn núm cho ra con số không phản
    ánh gì.
  nguon:
  - url: https://www.fda.gov/food/buy-store-serve-safe-food/refrigerator-thermometers-cold-facts-about-food-safety
    title: US FDA — Refrigerator Thermometers and Food Safety
