nghien_cuu:
  van_ban: >-
    Quyết định sửa tiếp hay thay mới nên dựa trên bốn yếu tố đo được thay vì cảm
    tính: bộ phận nào hỏng, tuổi máy, tần suất hỏng gần đây, và chi phí sửa so
    với chi phí thay. Về bộ phận, có sự phân tách rõ giữa nhóm ngoại vi và nhóm
    lõi. Nhóm ngoại vi gồm tụ khởi động, quạt, bo mạch điều khiển, cảm biến,
    remote, máng hứng, ống thoát — sửa hoặc thay từng phần thường hợp lý vì chi
    phí chiếm tỉ lệ nhỏ so với giá máy. Nhóm lõi là block máy nén và dàn trao
    đổi nhiệt bị ăn mòn hoặc rò ở nhiều điểm — chi phí xử lý chiếm tỉ lệ lớn và
    độ bền sau sửa khó dự đoán. Về tuổi máy, điều hoà dân dụng thường được thiết
    kế cho vòng đời khoảng mười tới mười lăm năm nếu bảo trì đều; máy vượt mốc
    đó thì các bộ phận khác cũng đang tiến gần cuối vòng đời, nên sửa một chỗ
    không ngăn được chỗ khác hỏng theo. Về tần suất, ba lần hỏng trong một mùa
    nắng là tín hiệu mạnh hơn nhiều so với một lần hỏng nặng. Về hiệu suất, máy
    đời cũ dùng công nghệ không biến tần tiêu thụ điện cao hơn đáng kể so với
    máy biến tần hiện nay, nên phần chênh tiền điện hằng tháng cũng nên được
    tính vào so sánh. Một quy tắc tham khảo phổ biến: nếu chi phí sửa vượt quá
    khoảng một nửa giá máy mới tương đương và máy đã qua hai phần ba vòng đời
    thiết kế, thay thường hợp lý hơn. Trước khi quyết định, nên yêu cầu chẩn
    đoán ghi rõ bộ phận hỏng và nguyên nhân, vì chẩn đoán mơ hồ dẫn tới sửa lặp.
