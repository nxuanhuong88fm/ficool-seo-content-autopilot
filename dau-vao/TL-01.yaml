nghien_cuu:
  van_ban: >-
    Tủ lạnh không lạnh hoặc lạnh yếu cần được phân loại trước theo một câu hỏi:
    cả tủ đều không lạnh, hay chỉ một ngăn. Nếu cả hai ngăn đều ấm thì nguyên
    nhân nghiêng về nguồn điện, block máy nén, hoặc hệ thống môi chất lạnh. Nếu
    ngăn đá vẫn lạnh mà ngăn mát ấm thì nguyên nhân nghiêng về đường dẫn khí
    lạnh giữa hai ngăn, tức quạt gió hoặc cửa gió bị chặn, hoặc dàn lạnh bám
    tuyết dày. Các nguyên nhân người dùng tự kiểm được nằm ở phần bên ngoài và
    phần sử dụng: phích cắm và ổ điện; nhiệt độ cài đặt bị chỉnh sai hoặc bị vô
    tình xoay; chế độ đặc biệt như chế độ tiết kiệm hay chế độ nghỉ đang bật;
    cửa không đóng kín do gioăng chai, do thực phẩm chặn, hoặc do tủ kê nghiêng
    khiến cửa không tự đóng; nhồi quá nhiều thực phẩm chặn cửa gió phía trong;
    đặt đồ nóng vào tủ; dàn nóng phía sau hoặc dưới gầm bám bụi dày; tủ kê sát
    tường không đủ khoảng hở tản nhiệt; nhiệt độ phòng quá cao. Các nguyên nhân
    cần thợ: quạt dàn lạnh hỏng, bộ xả tuyết hỏng khiến tuyết bám dày chặn dòng
    khí, cảm biến nhiệt độ sai, bo mạch lỗi, block yếu, rò rỉ môi chất lạnh.
    Một điểm cần nhấn mạnh về an toàn và về chẩn đoán: gas tủ lạnh không tiêu
    hao khi sử dụng bình thường, nên thiếu gas luôn đồng nghĩa với có rò rỉ, và
    nạp thêm mà không tìm chỗ rò chỉ giải quyết triệu chứng trong thời gian ngắn.
