nghien_cuu:
  van_ban: >-
    Bảo trì máy giặt là một lượt kiểm tra có danh sách hạng mục, khác với vệ
    sinh vốn tập trung vào làm sạch. Các hạng mục cốt lõi trải trên ba hệ thống
    của máy. Hệ cấp nước gồm ống cấp, van khoá và lưới lọc ở đầu vào; ống cấp
    là bộ phận đáng chú ý vì nó chịu áp lực nước liên tục kể cả khi máy không
    chạy, nên một ống nứt hoặc một đầu nối lỏng có thể gây ngập trong lúc không
    ai ở nhà, và đây là lý do nhiều hướng dẫn khuyến cáo khoá van cấp khi đi
    vắng dài ngày. Hệ thoát nước gồm bộ lọc xơ vải, bơm xả, ống xả và độ cao lắp
    đặt của ống xả. Hệ cơ khí và điện gồm chân đế cùng độ cân bằng, gioăng cửa,
    tình trạng lồng, dây điện và ổ cắm. Với hộ gia đình, tần suất giặt thấp nên
    chu kỳ bảo trì có thể thưa; với homestay, nhà cho thuê và cơ sở lưu trú, máy
    chạy nhiều lượt mỗi ngày, người dùng thay đổi liên tục nên khó kiểm soát
    việc dùng đúng liều nước giặt và việc lấy vật lạ khỏi túi áo, và hậu quả của
    một lần hỏng lớn hơn vì nó ảnh hưởng tới khách. Do đó nhóm này cần chu kỳ
    dày hơn và cần một quy trình kiểm nhanh giữa các kỳ. Về ghi chép, việc lưu
    ngày thực hiện và hạng mục đã làm cho phép so sánh giữa các kỳ và phát hiện
    xu hướng, chẳng hạn mức rung tăng dần hoặc thời gian một chu trình dài ra.
