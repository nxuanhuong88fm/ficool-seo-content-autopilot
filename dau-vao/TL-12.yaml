nghien_cuu:
  van_ban: >-
    Vị trí đặt tủ lạnh ảnh hưởng trực tiếp tới hiệu suất, tiền điện và tuổi thọ
    block, nhưng thường được chọn theo chỗ nào còn trống trong bếp. Yêu cầu quan
    trọng nhất là khoảng thoáng để thải nhiệt: tủ lạnh đẩy nhiệt ra qua dàn ngưng
    ở lưng hoặc qua thành hông, và cần khoảng hở ở lưng, hai bên và phía trên
    theo hướng dẫn của nhà sản xuất; kê sát tường hoặc nhét vào hốc kín khiến
    nhiệt quẩn tại chỗ, block phải chạy nhiều hơn mà tủ vẫn không đủ lạnh. Nhóm
    nơi cần tránh gồm: cạnh bếp nấu, lò nướng hoặc lò vi sóng vì nhiệt từ các
    thiết bị đó làm tăng tải; nơi có nắng chiếu trực tiếp qua cửa sổ; sát máy
    giặt hoặc máy sấy vì rung và nhiệt; nơi ẩm thấp không thông thoáng vì gây
    ăn mòn và đọng sương mặt ngoài; và ngoài trời hoặc nơi nhiệt độ môi trường
    vượt khoảng làm việc mà nhà sản xuất quy định. Về mặt sàn, tủ cần đặt trên
    mặt phẳng và đủ cứng; sàn không phẳng khiến cửa không tự đóng và gioăng
    không áp đều, còn sàn mềm làm tủ nghiêng dần theo thời gian. Về nguồn điện,
    tủ lạnh nên có ổ cắm riêng có tiếp địa, không dùng chung ổ với thiết bị công
    suất lớn, và không dùng dây nối dài kém chất lượng; nhiều nhà sản xuất cũng
    khuyến cáo không cắm tủ lạnh qua ổ có công tắc dễ bị tắt nhầm. Về khoảng
    trống mở cửa, cần đủ để cửa mở tới góc cho phép rút được khay và ngăn kéo
    ra hoàn toàn, nếu không việc vệ sinh định kỳ sẽ bị bỏ qua.
