nghien_cuu:
  van_ban: >-
    Đường thoát khí là bộ phận duy nhất của máy sấy thông hơi mà người dùng không
    quan sát được trong quá trình sử dụng, và cũng là bộ phận mà việc không làm
    sạch có hệ quả an toàn: các tổ chức phòng cháy ghi nhận việc không vệ sinh là
    nguyên nhân được xác định thường gặp trong các vụ cháy liên quan tới máy sấy,
    do xơ vải là vật liệu dễ bắt lửa tích tụ dần trong đường ống trong khi lưu
    lượng khí giảm làm nhiệt độ trong máy tăng. Cơ chế suy giảm rất thẳng: xơ vải
    bám vào thành ống làm tiết diện hẹp lại, khí ẩm ra chậm hơn, nên thời gian sấy
    dài hơn, điện tiêu thụ tăng, và nhiệt tích lại trong máy. Vì đường ống không
    nhìn thấy được, các dấu hiệu đều là dấu hiệu gián tiếp, và dấu hiệu xuất hiện
    sớm nhất là thời gian một lượt sấy dài dần ở cùng khối lượng quần áo; tiếp đó
    là quần áo nóng nhưng vẫn ẩm khi lấy ra, mặt trên máy nóng hơn bình thường,
    phòng đặt máy trở nên ẩm hoặc có mùi xơ vải, và nắp chắn ở đầu ra ngoài trời
    không mở ra khi máy chạy. Phép kiểm tại chỗ đơn giản nhất là cho máy chạy rồi
    ra ngoài đặt tay trước nắp chắn để cảm nhận luồng khí: khí yếu hoặc nắp không
    mở là dấu hiệu nghẽn. Bản thân cách lắp đặt quyết định tốc độ bám xơ. Ống mềm
    dạng gân giữ xơ trong các nếp gấp nên bám nhanh hơn ống cứng thành trơn, ống
    bằng nhựa hoặc màng mỏng bị nhiều quy chuẩn loại bỏ vì lý do cháy, vít bắt
    xuyên vào lòng ống tạo điểm cản giữ xơ nên nên dùng băng nhôm hoặc kẹp đai
    thay cho vít, và một lỗi rất phổ biến là ống bị bóp dẹp phía sau khi máy được
    đẩy sát vào tường, điều này xảy ra sau mỗi lần di chuyển máy mà không ai nhìn
    thấy. Về đầu ra ngoài trời, nắp chắn không nên lắp lưới mắt nhỏ vì lưới giữ
    xơ, và đường ống không được kết thúc trong không gian kín như gầm mái.
