nghien_cuu:
  van_ban: >-
    Mốc bảo quản đông lạnh được các cơ quan quản lý thực phẩm khuyến cáo là âm
    18 độ C, và đây là nhiệt độ THỰC trong khoang chứ không phải nấc trên bảng
    điều khiển; cách xác định đáng tin là đo bằng nhiệt kế đặt giữa các món đông
    rồi đọc sau nhiều giờ, tránh mở nắp trong thời gian đo. Khi tủ đông đông
    chậm hoặc không đạt mốc, nhóm nguyên nhân nằm ngoài máy thường gặp trước
    nhóm hỏng hóc: nạp quá nhiều thực phẩm chưa đông vào cùng một lúc làm tải
    nhiệt tăng đột ngột và tủ cần rất nhiều giờ mới kéo lại được; gioăng nắp
    hoặc gioăng cửa hở khiến khí lạnh thoát và hơi ẩm bên ngoài lọt vào; tủ kê
    sát tường hoặc trong góc kín làm dàn nóng không thải được nhiệt; nhiệt độ
    phòng cao và dàn nóng bám bụi cũng làm giảm khả năng thải nhiệt. Nhóm bên
    trong máy gồm lớp tuyết dày bám lên dàn lạnh làm chặn trao đổi nhiệt, quạt
    lưu thông khí không quay ở các model có quạt, bộ điều nhiệt hoặc cảm biến
    sai, và các sự cố thuộc hệ thống kín như rò rỉ môi chất hay máy nén yếu.
    Một điểm cần phân biệt là tủ đông nằm và tủ đông đứng có hành vi khác nhau:
    tủ nằm giữ khí lạnh tốt hơn khi mở vì khí lạnh nặng hơn nên đọng lại trong
    lòng tủ, còn tủ đứng mất khí lạnh nhanh hơn mỗi lần mở cửa. Với tủ mới lắp
    hoặc mới di dời, cần tính cả thời gian chờ trước khi cắm điện và thời gian
    hạ nhiệt ban đầu trước khi kết luận máy có lỗi.
