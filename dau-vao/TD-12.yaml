nghien_cuu:
  van_ban: >-
    Chất lượng vận hành của tủ mát và tủ đông phụ thuộc rất nhiều vào khâu lắp
    đặt, vì phần lớn các sự cố về hiệu suất về sau đều bắt nguồn từ vị trí đặt
    và điều kiện nguồn điện. Về vị trí, yêu cầu cơ bản là mặt sàn phẳng và chịu
    được tải khi tủ đầy hàng, tủ được kê cân để không bập bênh, và có đủ khoảng
    hở ở lưng cùng hai bên theo hướng dẫn của nhà sản xuất để dàn nóng thải được
    nhiệt. Tủ đặt sát tường, đặt trong hốc kín hoặc bị hàng hoá vây quanh sẽ
    phải chạy nhiều hơn để đạt cùng một nhiệt độ. Cần tránh các nguồn nhiệt như
    bếp, lò, ánh nắng trực tiếp, và tránh vị trí có luồng khí nóng ẩm thổi vào
    vì làm tăng ngưng tụ bề mặt. Mỗi model có một khoảng nhiệt độ môi trường mà
    nó được thiết kế để làm việc, nên đặt tủ ở nơi nóng hơn khoảng đó sẽ làm khả
    năng làm lạnh giảm. Về nguồn điện, các hãng khuyến cáo cắm trực tiếp vào ổ
    cắm riêng có tiếp địa thay vì dùng ổ chia hoặc dây nối dài, vì thiết bị làm
    lạnh có dòng khởi động cao; việc bố trí aptomat và tiết diện dây phù hợp
    thuộc phần việc của thợ điện. Sau vận chuyển, cần để tủ đứng yên một khoảng
    thời gian theo hướng dẫn của model trước khi cắm điện, để dầu bôi trơn trở
    về đúng vị trí trong máy nén. Khi mới cắm điện, tủ cần chạy không tải tới
    khi đạt nhiệt độ rồi mới đưa hàng vào, và nên đưa theo đợt thay vì dồn hết
    một lúc.
