nghien_cuu:
  van_ban: >-
    Ở tủ mát, một lớp sương mỏng hoặc vài giọt nước ngưng trên thành sau trong
    lúc máy nén đang chạy là hiện tượng theo thiết kế, và phần ẩm đó được xử lý
    trong chu kỳ xả tuyết rồi thoát ra ngoài theo đường dẫn nước ngưng. Điều bất
    thường là lớp tuyết dày hoặc lớp đá cứng tồn tại liên tục, vì nó cho thấy
    lượng ẩm đi vào vượt khả năng xử lý, hoặc chu kỳ xả tuyết không hoạt động
    đúng. Các nguyên nhân liên quan tới sử dụng gồm: cửa mở quá nhiều lần hoặc
    mở lâu trong ngày bán hàng, cửa không tự đóng lại, gioăng hở làm khí ẩm lọt
    vào liên tục, hàng hoá còn ướt hoặc chưa nguội đưa vào tủ, và mức cài đặt
    lạnh hơn mức cần khiến bề mặt dàn lạnh xuống thấp hơn và bám tuyết nhanh
    hơn. Các nguyên nhân thuộc hỏng hóc gồm bộ xả tuyết, bộ hẹn giờ hoặc điện
    trở xả tuyết không hoạt động, cảm biến xả tuyết sai, quạt dàn lạnh không
    quay khiến khí lạnh đọng cục bộ, đường thoát nước ngưng tắc làm nước đọng
    rồi đóng băng, và thiếu môi chất do rò rỉ. Trường hợp thiếu môi chất có một
    dấu hiệu đặc trưng là tuyết hoặc đá chỉ đóng ở một đoạn của dàn lạnh trong
    khi các đoạn còn lại khô, do phần môi chất còn lại chỉ bay hơi hết ở đoạn
    đầu. Về đánh giá, nhiệt độ thực trong khoang cần được đo bằng nhiệt kế đặt
    trong cốc nước ở giữa khoang, vì tủ vừa đóng tuyết dày vừa không đạt mốc là
    nhóm dấu hiệu khác hẳn với tủ đóng tuyết nhưng vẫn đủ lạnh.
