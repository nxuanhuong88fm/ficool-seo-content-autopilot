nghien_cuu:
  van_ban: >-
    Khác biệt cơ bản giữa tủ đông nằm và tủ đông đứng bắt nguồn từ một đặc tính
    vật lý: khí lạnh nặng hơn khí ấm. Với tủ nằm, khi mở nắp thì khí lạnh đọng
    lại trong lòng tủ nên lượng lạnh mất đi ít hơn, còn với tủ đứng thì khí lạnh
    tràn ra ngoài mỗi lần mở cửa. Hệ quả là ở cùng điều kiện sử dụng, tủ nằm
    thường giữ nhiệt ổn định hơn khi mở nhiều lần, và cũng giữ lạnh được lâu hơn
    trong một đợt mất điện nếu không mở nắp. Đổi lại, tủ đứng có ưu thế về thao
    tác: hàng xếp theo ngăn và giỏ ở tầm mắt nên dễ tìm, dễ phân loại và ít khi
    có món nằm quên dưới đáy; tủ đứng cũng chiếm ít diện tích sàn hơn so với
    dung tích tương đương, điều này quan trọng với căn hộ và nhà phố nhỏ. Về
    dung tích sử dụng, thông số ghi trên tem là dung tích hình học, còn phần
    dùng được nhỏ hơn vì giỏ, ngăn kéo và khoảng lưu thông khí chiếm chỗ; tủ nằm
    thường tận dụng được không gian tốt hơn cho các món cồng kềnh vì lòng tủ
    liền khối. Về vệ sinh, tủ nằm cần xả tuyết thủ công ở phần lớn model và nước
    tan đọng ở đáy nên thao tác nặng hơn, trong khi nhiều model tủ đứng có cơ
    chế xả tuyết tự động nhưng bù lại tiêu thụ điện có thể cao hơn. Về lắp đặt,
    cả hai loại đều cần mặt sàn phẳng chịu tải, kê cân và chừa khoảng hở thải
    nhiệt; riêng tủ nằm cần thêm khoảng trống phía trên vì nắp mở lên cao hơn
    thân tủ.
