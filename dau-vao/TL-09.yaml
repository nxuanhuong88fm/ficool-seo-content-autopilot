nghien_cuu:
  van_ban: >-
    Mùi trong tủ lạnh có bốn nguồn chính, và việc tìm đúng nguồn quan trọng hơn
    việc khử mùi, vì khử mà không xử lý nguồn thì mùi quay lại sau vài ngày.
    Nguồn thứ nhất là thực phẩm: món hỏng ẩn ở góc khuất hoặc phía sau, thực
    phẩm để không đậy kín làm mùi lan chéo giữa các món, nước từ thịt cá rỉ
    xuống khay dưới. Nguồn thứ hai là các bộ phận tích ẩm mà người dùng không
    nghĩ tới: rãnh thoát nước ngưng ở thành sau ngăn mát, lỗ thoát và ống dẫn
    xuống khay bay hơi, các khe dưới khay rau, và ron cao su viền cửa với các
    nếp gấp giữ ẩm. Nguồn thứ ba là khay bay hơi phía sau gần block: nước ngưng
    chảy xuống đó rồi bay hơi, và nếu có mảnh thực phẩm theo đường ống rơi vào,
    khay này thành nơi phân huỷ; mùi từ đây thoát ra phía sau tủ chứ không ở
    trong khoang, nên rất khó tìm. Nguồn thứ tư là vật liệu mới với tủ vừa mua,
    mùi nhựa sẽ nhạt dần sau vài tuần. Về cách khử mùi, các phương pháp hấp thụ
    phổ biến gồm baking soda để hở trong hộp, than hoạt tính, bã cà phê khô;
    chúng hấp thụ mùi còn sót nhưng không thay thế được việc làm sạch. Nguyên
    tắc thứ tự đúng là: bỏ nguồn mùi, làm sạch bề mặt và các khe, thông rãnh
    thoát nước ngưng, lau khô hoàn toàn, rồi mới đặt chất hấp thụ. Nếu mùi vẫn
    còn sau khi làm đủ các bước, khả năng cao nguồn nằm ở khay bay hơi phía sau
    hoặc trong đường ống, và đó là phần cần tháo, thuộc việc của thợ.
