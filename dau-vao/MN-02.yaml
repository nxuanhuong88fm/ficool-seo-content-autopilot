nghien_cuu:
  van_ban: >-
    "Nóng chậm" và "không đủ nóng" là hai triệu chứng khác nhau và cần tách ra
    trước khi tìm nguyên nhân. Nóng chậm là thời gian chờ kéo dài hơn trước,
    thường gặp ở bình chứa; không đủ nóng là nhiệt độ nước ra thấp hơn mức mong
    muốn ngay cả khi đã chờ đủ. Với bình chứa, nguyên nhân thường gặp nhất của
    cả hai là cặn khoáng tích tụ trên thanh đốt và dưới đáy bình: cặn là một lớp
    cách nhiệt nên nhiệt không truyền hết vào nước, thời gian đun dài ra và điện
    tiêu thụ tăng. Các nguyên nhân khác gồm bộ điều nhiệt được đặt thấp, một
    trong các thanh đốt đã hỏng ở model dùng nhiều thanh, lớp cách nhiệt của
    bình xuống cấp, và dung tích không còn phù hợp với nhu cầu thực tế của hộ.
    Với máy làm nóng trực tiếp, nhiệt độ ra là hàm của công suất chia cho lưu
    lượng, nên mở vòi lớn sẽ cho nước mát hơn; đây là giới hạn thiết kế chứ
    không phải hỏng hóc. Yếu tố mùa cũng có thật: nhiệt độ nước cấp vào mùa lạnh
    thấp hơn, nên cùng một máy phải nâng nhiệt qua một khoảng lớn hơn và cho ra
    kết quả kém hơn. Ngoài thiết bị còn có đường ống: quãng ống dài, không bọc
    cách nhiệt, hoặc van trộn ở vòi sen bị lệch đều làm nước tới nơi nguội hơn
    nước rời khỏi máy. Về mức đặt nhiệt độ, tài liệu tiết kiệm năng lượng của Bộ
    Năng lượng Hoa Kỳ khuyến nghị mốc khoảng 49 độ C cho phần lớn hộ gia đình,
    vừa đủ dùng vừa hạn chế hao điện và nguy cơ bỏng.
