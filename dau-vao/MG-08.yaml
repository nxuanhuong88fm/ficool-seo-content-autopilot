nghien_cuu:
  van_ban: >-
    Phần lớn máy giặt hiện nay có sẵn một chế độ được gọi là tự vệ sinh lồng
    giặt hoặc vệ sinh thùng, và tài liệu của các hãng mô tả nó là chu trình chạy
    nước ở nhiệt độ cao hơn bình thường, đảo và xả nhiều lần để làm sạch bề mặt
    lồng trong. Giới hạn nằm ở chỗ chu trình này chỉ tác động lên những bề mặt
    mà nước trong lồng chạm tới. Các vị trí tích tụ cặn xà phòng, xơ vải và nấm
    mốc lại nằm ngoài phạm vi đó: khe giữa lồng trong và lồng ngoài, mặt sau
    lồng ngoài, nếp gấp của gioăng cao su ở máy cửa trước, ngăn chứa nước giặt
    và nước xả, bộ lọc xơ vải cùng bộ lọc bơm xả, và đoạn ống xả. Tài liệu về
    nấm mốc của EPA nêu nguyên tắc chung là mốc phát triển ở nơi có ẩm đọng và
    cách xử lý bền vững là loại bỏ nguồn ẩm chứ không phải khử mùi bề mặt, điều
    này giải thích vì sao mùi quay lại sau vài tuần nếu chỉ chạy chế độ tự vệ
    sinh. Tài liệu về máy giặt của ENERGY STAR cũng lưu ý thói quen sử dụng ảnh
    hưởng tới mức tích tụ: dùng quá nhiều bột hoặc nước giặt, giặt liên tục ở
    nước lạnh, và đóng kín cửa máy ngay sau khi giặt đều làm ẩm đọng lâu hơn.
    Vệ sinh chuyên sâu khác ở chỗ có tháo lồng giặt hoặc tháo các cụm chi tiết
    để làm sạch những bề mặt mà chu trình nước không với tới.
