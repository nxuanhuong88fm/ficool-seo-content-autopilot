nghien_cuu:
  van_ban: >-
    Chọn dung tích bình nóng lạnh theo số người là cách phổ biến nhưng chỉ là
    điểm khởi đầu, vì lượng nước nóng thực sự dùng phụ thuộc thói quen tắm và
    thời điểm dùng nhiều hơn là phụ thuộc số nhân khẩu. Yếu tố quyết định thường
    bị bỏ qua là mọi người có tắm liên tiếp trong cùng một khung giờ hay rải ra
    trong ngày: bình chứa cần thời gian để đun lại phần nước đã dùng, nên hai hộ
    cùng số người nhưng khác nhịp sinh hoạt sẽ cần dung tích khác nhau. Một điểm
    kỹ thuật quan trọng là lượng nước ấm dùng được lớn hơn dung tích ghi trên
    bình, vì nước nóng trong bình được pha với nước lạnh tại vòi để đạt nhiệt độ
    tắm; đổi lại, phần nước lạnh cấp vào bình trong lúc dùng làm nhiệt độ trong
    bình giảm dần, nên phần cuối luôn mát hơn phần đầu. Về kiểu thiết bị, bình
    chứa phù hợp với nhà cần nhiều nước nóng trong thời gian ngắn, còn máy làm
    nóng trực tiếp không trữ nước nên cấp nóng không giới hạn thời gian nhưng
    phụ thuộc lưu lượng và có công suất tức thời cao hơn, kéo theo yêu cầu nặng
    hơn về dây dẫn và thiết bị bảo vệ. Ngoài nhu cầu còn có ràng buộc lắp đặt:
    bình dung tích lớn nặng hơn khi đầy nước nên đòi tường chịu lực tốt hơn và
    chiếm nhiều chỗ hơn trên tường phòng tắm. Về vận hành, bình lớn hơn mức cần
    làm tăng thất thoát nhiệt do phải giữ ấm một lượng nước không dùng tới, nên
    chọn thừa cũng có cái giá của nó.
