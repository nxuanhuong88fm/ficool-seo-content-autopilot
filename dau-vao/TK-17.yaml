nghien_cuu:
  van_ban: >-
    Nghiệm thu hai nhóm thiết bị này khác nhau ở chỗ kết quả được xác nhận bằng
    gì. Máy sấy quần áo cho kết quả kiểm chứng được ngay trong một mẻ: sau khi
    chạy hết một chu trình đầy đủ với tải thật, có thể đánh giá đồ đã khô chưa,
    máy có ngắt giữa chừng không, và mức rung cùng tiếng ồn ra sao; vì vậy phép
    nghiệm thu quan trọng nhất với máy sấy là chạy thử một mẻ thật chứ không
    phải một chu trình rỗng. Ngoài ra còn có các hạng mục quan sát được: bộ lọc
    xơ vải sạch và lắp đúng, đường ống thoát khí với máy thông hơi phải ngắn,
    thẳng, không gập và đầu ra thông, bình chứa nước với máy ngưng tụ và bơm
    nhiệt phải với tới được, máy kê cân, và khe hở thải nhiệt đủ theo hướng dẫn.
    Một điểm an toàn cần được nêu riêng: xơ vải tích tụ trong đường khí vừa gây
    quá nhiệt vừa là vật liệu dễ bắt lửa, nên nếu lượt dịch vụ liên quan tới bảo
    vệ quá nhiệt đã ngắt thì phải xác nhận nguyên nhân cản khí đã được xử lý,
    không chỉ xác nhận linh kiện đã thay. Quạt điều hòa thì ngược lại: kết quả
    phụ thuộc độ ẩm không khí nên không thể nghiệm thu trong phòng đóng kín;
    phép thử phải thực hiện ở điều kiện dùng thật với cửa mở hé, và đánh giá
    bằng luồng gió trực tiếp chứ không bằng nhiệt độ chung của phòng. Các hạng
    mục còn lại gồm tấm làm mát ướt đều, bơm chạy và đưa nước lên đủ, bình không
    rò, lưới lọc sạch, và không còn mùi sau khi vệ sinh.
