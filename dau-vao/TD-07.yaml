nghien_cuu:
  van_ban: >-
    Gioăng cửa hoặc gioăng nắp là chi tiết giữ cho khoang lạnh kín với không khí
    bên ngoài, và khi nó không áp đều thì khí lạnh thoát ra liên tục còn hơi ẩm
    lọt vào, dẫn tới ba hệ quả quan sát được: máy chạy nhiều hơn, tuyết bám dày
    hơn quanh khu vực hở, và ngưng tụ xuất hiện quanh viền cửa. Các tài liệu tiết
    kiệm năng lượng khuyến cáo kiểm tra độ kín của gioăng như một hạng mục bảo
    dưỡng định kỳ, và phép thử phổ biến là kẹp một tờ giấy vào mép cửa rồi đóng
    lại, sau đó rút ra: nếu tờ giấy rút ra dễ dàng ở một vị trí nào đó thì vị trí
    đó không áp đủ. Điều quan trọng khi chẩn đoán là phân biệt bốn tình trạng
    khác nhau vì cách xử lý khác hẳn nhau: gioăng bẩn với cặn tích trong rãnh
    làm bề mặt không áp sát; gioăng lệch hoặc bung khỏi khe cài; gioăng chai và
    biến dạng do lão hoá, mất tính đàn hồi nên không hồi lại hình dạng ban đầu;
    và gioăng rách hoặc thủng. Hai tình trạng đầu xử lý bằng vệ sinh và lắp lại,
    hai tình trạng sau thì cần thay. Ngoài bản thân gioăng, các yếu tố làm cửa
    không khít gồm tủ kê không cân, bản lề bị xệ, hàng hoá chèn vào mép cửa, và
    lớp tuyết tích tụ quanh miệng tủ. Với tủ mát cửa kính dùng gioăng nam châm,
    lực hít giảm khi dải nam châm bên trong gioăng yếu đi hoặc khi gioăng bị kéo
    giãn do đóng mở mạnh nhiều lần.
