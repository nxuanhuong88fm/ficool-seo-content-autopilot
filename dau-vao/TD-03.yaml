nghien_cuu:
  van_ban: >-
    Xả tuyết tủ đông có hai ràng buộc song song: an toàn cho hàng đông và an
    toàn cho lòng tủ. Về hàng đông, thực phẩm đã rã đông một phần không nên cấp
    đông lại một cách tuỳ tiện, nên cách làm thông thường là chọn thời điểm
    lượng hàng ở mức thấp nhất và chuyển hàng sang thùng giữ lạnh có đá hoặc
    sang tủ khác trong suốt quá trình xả. Về lòng tủ, các hãng cảnh báo không
    dùng vật sắc để cạy tuyết vì đường ống làm lạnh nằm ngay sau lớp vỏ trong và
    một vết thủng dẫn tới rò rỉ môi chất; cũng không nên đổ nước sôi trực tiếp
    lên thành tủ vì chênh lệch nhiệt độ đột ngột có thể làm nứt hoặc biến dạng
    lớp nhựa lót. Cách được khuyến cáo là rút nguồn điện, mở nắp và để tuyết tan
    tự nhiên, có hứng nước bằng khăn hoặc khay; có thể rút ngắn thời gian bằng
    cách đặt một khay nước ấm bên trong rồi đóng nắp, hoặc dùng quạt thổi không
    khí phòng vào lòng tủ. Sau khi tuyết tan hết, cần làm sạch bằng dung dịch
    nhẹ, tránh chất tẩy mạnh vì mùi hoá chất bám lại sẽ ám sang thực phẩm, rồi
    lau khô hoàn toàn trước khi cắm điện. Nhiều tủ đông có nút hoặc lỗ thoát
    nước ở đáy hoặc phía dưới mặt trước, cần mở đúng nút này để nước thoát ra
    ngoài và đóng lại trước khi vận hành. Sau khi cắm điện lại, tủ cần thời gian
    hạ nhiệt trước khi đưa hàng đông trở vào.
