nghien_cuu:
  van_ban: >-
    ELCB là thiết bị chống dòng rò lắp cho máy nước nóng, hoạt động bằng cách so
    dòng điện đi vào với dòng điện đi ra: khi hai giá trị lệch nhau quá ngưỡng,
    nghĩa là có một phần dòng đang đi theo đường khác, thiết bị ngắt mạch. Vì
    vậy ELCB nhảy là dấu hiệu bảo vệ đang làm việc chứ không phải một phiền toái
    cần loại bỏ, và việc vô hiệu hoá nó để máy chạy tiếp là gỡ đúng lớp bảo vệ
    đang đứng giữa người dùng và dòng rò. Thời điểm nhảy mang thông tin chẩn
    đoán: nhảy ngay khi vừa cấp điện thường trỏ về rò trong máy hoặc chạm mạch;
    nhảy sau khi máy đun được một lúc thường trỏ về lớp cách điện của thanh đốt
    suy giảm khi nóng lên, do vật liệu giãn nở làm vết nứt mở rộng; nhảy đúng
    lúc mở nước nóng để dùng thì nghiêng về đường rò qua nước; nhảy vào những
    ngày mưa ẩm nghiêng về hơi ẩm lọt vào hộp đấu điện. Một khả năng khác là
    bản thân thiết bị đã lão hoá và ngắt sai, nhưng đây là giả thiết cần loại
    trừ SAU CÙNG chứ không phải đầu tiên, vì kết luận nhầm theo hướng này dẫn
    tới việc thay thiết bị bảo vệ trong khi rò thật vẫn còn nguyên. Phép thử
    phân định đơn giản là tách phụ tải: ngắt riêng máy nước nóng rồi đóng lại
    ELCB; nếu nó giữ được thì nguồn rò nằm ở máy, nếu vẫn nhảy thì vấn đề nằm ở
    đường dây hoặc thiết bị khác trên cùng nhánh. Các thiết bị chống rò đều có
    nút test dùng để kiểm tra khả năng ngắt, và nhà sản xuất khuyến cáo bấm thử
    định kỳ.
