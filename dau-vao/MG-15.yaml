nghien_cuu:
  van_ban: >-
    Nghiệm thu máy giặt khác nghiệm thu máy lạnh ở một điểm quan trọng: kết quả
    chỉ lộ ra sau một chu trình đầy đủ, vì lỗi cấp nước, lỗi xả và lỗi vắt nằm ở
    ba giai đoạn khác nhau. Do đó phép kiểm chung cho mọi loại công việc là chạy
    trọn một chu trình ngắn có đủ bốn giai đoạn cấp nước, giặt, xả và vắt, rồi
    quan sát từng giai đoạn. Sau vệ sinh, các hạng mục cần xác nhận gồm: gioăng
    cửa sạch và khô, không còn cặn trong nếp gấp; ngăn đựng bột giặt đã rửa và
    thông; bộ lọc bơm xả sạch và nắp lọc vặn chặt không rỉ; lồng giặt không còn
    cặn bám ra tay khi lau thử; khu vực làm việc được dọn; máy chạy không có mùi
    lạ. Sau sửa chữa: đúng triệu chứng ban đầu đã hết, được xem linh kiện đã
    thay, không phát sinh triệu chứng mới, và có ghi lại nguyên nhân. Sau lắp
    đặt: bu lông vận chuyển đã tháo, bốn chân đã cân và khoá đai ốc hãm, đầu ống
    xả đúng độ cao, các đầu nối không rỉ nước, ổ cắm riêng có tiếp địa, và chạy
    thử không rung mạnh. Một điểm hay bị bỏ qua ở cả ba loại công việc là kiểm
    dưới gầm máy sau khi chạy xong: nước đọng ở đó là dấu hiệu rò mà không nhìn
    thấy từ bên ngoài. Về giấy tờ, nên có phiếu ghi rõ hạng mục đã làm và điều
    kiện bảo hành cho phần việc đó, vì bảo hành dịch vụ khác bảo hành thiết bị.
