nghien_cuu:
  van_ban: >-
    Nghiệm thu máy nước nóng có một đặc điểm riêng khiến việc quan sát bằng mắt
    không đủ: phần quan trọng nhất là lớp bảo vệ an toàn, và một thiết bị bảo vệ
    đã bị tháo ra khỏi mạch hoặc đã chết thì trông y như một thiết bị đang làm
    việc. Do đó nghiệm thu phải dựa trên phép thử chủ động chứ không dựa trên
    quan sát: bấm nút thử thiết bị chống dòng rò để nó phải nhảy, kiểm tra tiếp
    địa có thật và còn liên tục thay vì chỉ có ổ cắm ba chân, và kiểm tra đường
    xả của van an toàn có thông. Trình tự bàn giao cũng là một hạng mục cần kiểm
    chứ không chỉ là quy trình nội bộ của kỹ thuật viên: bình phải được cấp nước
    đầy và xả hết khí trong đường ống trước khi cấp điện, vì thanh đốt hoạt động
    khi chưa ngập nước sẽ hỏng, và với máy làm nóng trực tiếp thì điều kiện tương
    tự áp dụng cho khoang làm nóng. Việc kiểm rò nước có một chi tiết dễ bị bỏ:
    mối nối và gioăng mặt bích có thể kín khi bình còn nguội nhưng rỉ khi nước đã
    nóng, vì giãn nở nhiệt làm thay đổi lực siết tại mối ghép, nên phép kiểm rò
    chỉ có giá trị khi thực hiện sau khi bình đã đạt nhiệt độ làm việc. Về cơ khí,
    giá treo phải bắt vào phần tường chịu lực được vì khối lượng bình khi đầy nước
    lớn hơn nhiều so với khi rỗng, và bình phải cân bằng. Về điện, dây nguồn không
    được bị kẹp, không đi qua bề mặt nóng, và không có mối nối tạm. Về hiệu suất,
    mốc đối chiếu đáng ghi lại là thời gian từ lúc cấp điện tới lúc nước ra vòi
    đạt nhiệt độ sử dụng, vì con số này là căn cứ duy nhất để sau này biết máy có
    chậm đi hay không. Với máy làm nóng trực tiếp, hạng mục riêng là máy phải kích
    hoạt ở lưu lượng sử dụng bình thường và không ngắt giữa lượt tắm. Về hồ sơ,
    cần lấy danh mục hạng mục đã làm, linh kiện cũ đã thay được trả lại, nguyên
    nhân đã được xác định, mức cài đặt nhiệt độ để lại, và phạm vi cùng thời hạn
    bảo hành ghi rõ.
