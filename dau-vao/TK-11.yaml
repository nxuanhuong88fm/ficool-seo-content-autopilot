nghien_cuu:
  van_ban: >-
    Trong quạt điều hòa, một bơm nhỏ đặt trong bình chứa đưa nước lên máng phân
    phối phía trên tấm làm mát; nước thấm xuống theo tấm rồi chảy về bình thành
    một vòng tuần hoàn. Khi tấm làm mát khô, cần phân biệt nhiều khả năng trước
    khi kết luận bơm hỏng, vì phần lớn trường hợp không phải do bơm. Nhóm thứ
    nhất là mực nước: bình cạn, hoặc mực nước thấp hơn ngưỡng hút của bơm nên
    bơm chạy mà không hút được. Nhóm thứ hai là công tắc chức năng: nhiều model
    tách riêng nút bật bơm với nút bật quạt, nên máy vẫn thổi gió trong khi bơm
    chưa được bật, và một số model có hẹn giờ hoặc chế độ chỉ quạt. Nhóm thứ ba
    là tắc nghẽn trên đường nước: lưới lọc ở họng hút của bơm bám cặn và xơ,
    ống dẫn bị gập hoặc tuột, và các lỗ nhỏ trên máng phân phối bị cặn khoáng
    bịt kín; trường hợp máng bị bịt một phần cho ra hiện tượng đặc trưng là tấm
    làm mát chỉ ướt ở một vùng còn vùng khác khô. Nhóm thứ tư mới là bơm hỏng
    thật, thường do chạy khô lâu ngày, do cặn kẹt cánh bơm, hoặc do cuộn dây
    hỏng. Về an toàn, mọi thao tác chạm vào phần nước bên trong phải thực hiện
    sau khi rút phích cắm, vì đây là thiết bị điện chứa nước; và cặn khoáng tích
    tụ nhanh hơn ở khu vực dùng nước cứng, nên chu kỳ vệ sinh bình và lưới lọc
    của bơm ảnh hưởng trực tiếp tới tuổi thọ bơm.
