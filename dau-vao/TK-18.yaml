nghien_cuu:
  van_ban: >-
    Điều cần biết trước khi so thông số của quạt điều hòa là nguyên lý làm mát bay
    hơi đặt ra một yêu cầu ngược với trực giác về máy lạnh: thiết bị này làm mát
    bằng cách cho nước bay hơi vào dòng khí, nên nó đồng thời đưa thêm ẩm vào không
    khí của phòng, và để tiếp tục làm mát nó cần được cấp liên tục không khí khô
    hơn. Trong một phòng đóng kín, độ ẩm tăng dần cho tới khi khả năng bay hơi giảm
    mạnh và hiệu quả làm mát gần như dừng lại; vì vậy phòng càng kín thì máy càng
    kém, và điều kiện sử dụng đúng là phòng có thông thoáng, gần cửa sổ hoặc cửa mở.
    Yếu tố khí hậu cũng quyết định kỳ vọng: hiệu quả của bay hơi tỉ lệ nghịch với
    độ ẩm sẵn có của không khí, nên ở khu vực có độ ẩm cao như TP.HCM thì mức giảm
    nhiệt cảm nhận được là vừa phải chứ không tương đương máy lạnh, và đây là giới
    hạn của nguyên lý không phải giới hạn của model. Về thông số, con số đáng dùng
    để so giữa các model là lưu lượng gió tính theo mét khối mỗi giờ, trong khi các
    khẳng định kiểu phù hợp cho phòng bao nhiêu mét vuông không có cơ sở so sánh vì
    chúng phụ thuộc mức thông thoáng và độ ẩm của chính phòng đó; dung tích bình
    nước quyết định thời gian chạy giữa hai lần châm nước chứ không quyết định khả
    năng làm mát; và độ ồn cần được xem ở mức gió thấp bởi đó là mức dùng thực tế
    khi ngủ, chứ không phải ở mức gió cao. Về chi phí sử dụng, thiết bị gồm một quạt
    và một bơm nhỏ nên điện tiêu thụ thấp hơn nhiều so với máy lạnh, nhưng chi phí
    sở hữu có ba phần chứ không phải một: điện, nước tiêu thụ do bay hơi, và tấm làm
    mát là vật tư có tuổi thọ phải thay khi cặn khoáng làm nó mất khả năng hút nước.
    Loại thiết bị này phù hợp với không gian bán mở như bếp, nhà xe, ban công có mái,
    hoặc làm mát cục bộ cho một vị trí người ngồi, và không phù hợp khi kỳ vọng là
    thay thế máy lạnh trong một phòng ngủ đóng kín.
