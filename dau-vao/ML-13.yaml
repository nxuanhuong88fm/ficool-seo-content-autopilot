nghien_cuu:
  van_ban: >-
    Vị trí lắp quyết định phần lớn hiệu quả làm lạnh và tuổi thọ của máy, nhưng
    thường bị chọn theo thẩm mỹ hoặc theo chỗ nào dễ đi ống nhất. Với dàn lạnh,
    các nguyên tắc kỹ thuật gồm: đặt ở vị trí luồng gió trải dọc theo chiều dài
    phòng thay vì thổi thẳng vào tường gần; tránh thổi thẳng vào chỗ nằm hoặc
    chỗ ngồi làm việc; giữ khoảng hở phía trên và hai bên theo hướng dẫn của nhà
    sản xuất để không cản dòng hồi gió; tránh lắp ngay trên thiết bị điện tử vì
    rủi ro nước ngưng nhỏ giọt; bảo đảm độ dốc của ống thoát nước ngưng liên tục
    theo hướng thoát, vì ống bị võng hoặc dốc ngược là nguyên nhân phổ biến của
    rò nước. Với dàn nóng: đặt nơi thoáng, không bị vật cản trước mặt quạt và
    trước mặt lưới dàn ngưng, có khoảng cách tối thiểu với tường theo hướng dẫn
    của hãng; tránh nắng chiếu trực tiếp cả ngày vì nhiệt độ môi trường cao làm
    giảm hiệu suất và tăng tải cho block; tránh hộp kỹ thuật kín không có đối
    lưu; đặt trên giá đỡ chắc chắn bắt vào tường đặc, có đệm cao su giảm chấn;
    không đặt hai dàn nóng thổi trực diện vào nhau. Chiều dài và chênh cao giữa
    hai dàn phải nằm trong giới hạn của model, vượt giới hạn thì phải bổ sung
    môi chất lạnh theo chỉ dẫn của hãng và hiệu suất giảm. Một điểm hay bị bỏ
    qua khi khảo sát: đường điện cấp riêng và CB riêng cho máy lạnh, cùng vị trí
    đi ống sao cho sau này còn tháo ra vệ sinh và bảo trì được.
