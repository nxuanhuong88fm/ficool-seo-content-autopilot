nghien_cuu:
  van_ban: >-
    Rủi ro chính khi vận chuyển máy giặt nằm ở lồng giặt. Lồng được treo bằng lò
    xo và giảm chấn để hấp thụ rung khi vắt; khi máy bị xóc trong lúc di chuyển,
    lồng va đập vào thành máy và có thể làm cong trục, hỏng giảm chấn hoặc vỡ
    đối trọng bê tông. Đó là lý do nhà sản xuất cấp kèm bu lông vận chuyển: lắp
    lại chúng trước khi di chuyển sẽ khoá lồng vào vỏ máy. Nếu đã làm mất bu
    lông, có thể mua theo model hoặc chèn kín khoang lồng bằng vật liệu mềm,
    nhưng chèn không tương đương với khoá cứng. Trước khi di chuyển còn ba việc
    bắt buộc: xả hết nước còn trong máy qua bộ lọc bơm xả và qua ống xả, vì nước
    còn lại sẽ chảy ra trong lúc vận chuyển; khoá van cấp và tháo ống cấp, xả
    hết nước trong ống; tháo ống xả và để khô. Về tư thế, máy giặt nên được giữ
    đứng trong suốt quá trình vận chuyển; nếu buộc phải đặt nằm, nên tránh nằm
    sấp về phía cửa và cần dựng lại rồi chờ trước khi cắm điện, vì dầu bôi trơn
    và nước còn sót có thể chảy sang chỗ không mong muốn. Khi tới nơi mới, quy
    trình lắp lại gồm: tháo bu lông vận chuyển, đặt máy đúng vị trí, đấu ống cấp
    và ống xả đúng độ cao, cân chỉnh chân bằng thước nivo rồi khoá đai ốc hãm,
    và chạy thử một chu trình ngắn để kiểm rò nước cùng độ rung.
