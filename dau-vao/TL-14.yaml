nghien_cuu:
  van_ban: >-
    Về an toàn thực phẩm, các cơ quan quản lý khuyến cáo giữ ngăn mát ở mức từ
    4 độ C trở xuống và ngăn đá ở mức âm 18 độ C, vì trong khoảng nhiệt độ từ
    khoảng 4 tới 60 độ C vi khuẩn phát triển nhanh. Đây là mốc theo nhiệt độ
    THỰC bên trong khoang, không phải theo nấc trên bảng điều khiển. Nhiều tủ
    lạnh chỉ có núm xoay hoặc dãy nấc từ 1 tới 7 mà không hiển thị nhiệt độ, và
    các nấc đó chỉ là mức tương đối; nấc cao hơn nghĩa là lạnh hơn ở phần lớn
    model nhưng không phải mọi model, nên cách chắc chắn là đo bằng nhiệt kế
    cầm tay đặt trong khoang. Cách đo đúng: đặt nhiệt kế vào giữa ngăn mát, tốt
    nhất trong một cốc nước để phản ánh nhiệt độ thực phẩm thay vì nhiệt độ
    không khí dao động theo mỗi lần mở cửa; đóng cửa và chờ nhiều giờ, tránh mở
    cửa trong thời gian đo; rồi đọc. Về ảnh hưởng của lượng thực phẩm: tủ quá
    trống làm nhiệt độ dao động mạnh hơn mỗi lần mở cửa vì không khí lạnh thoát
    ra nhanh và không có khối lượng nào giữ lạnh; tủ quá đầy lại chặn dòng khí
    lưu thông và tạo vùng ấm cục bộ, đặc biệt khi thực phẩm che cửa gió. Mức lấp
    đầy hợp lý thường được khuyến cáo là khoảng ba phần tư, chừa lối cho không
    khí đi. Các yếu tố khác cần điều chỉnh theo: nhiệt độ phòng thay đổi theo
    mùa, tần suất mở cửa, và việc vừa nạp nhiều thực phẩm cùng lúc. Đặt lạnh hơn
    mức cần không bảo quản tốt hơn mà chỉ làm block chạy nhiều hơn và tốn điện.
