nghien_cuu:
  van_ban: >-
    Rò nước ở máy giặt cần được khoanh vùng theo vị trí và theo thời điểm xuất
    hiện, vì hai thông tin đó gần như chỉ thẳng ra nguyên nhân. Về vị trí: nước
    ở phía sau máy nghiêng về đầu nối ống cấp hoặc ống xả; nước ở góc dưới mặt
    trước nghiêng về nắp bộ lọc bơm xả chưa vặn chặt hoặc gioăng nắp lọc hỏng;
    nước quanh khung cửa máy cửa trước nghiêng về gioăng cửa rách hoặc kẹt dị
    vật; nước ở ngăn đựng bột giặt nghiêng về ngăn bị tắc do bột đóng cục làm
    nước tràn ngược; nước lan đều dưới gầm khó xác định hơn và có thể là thùng
    chứa hoặc đường ống bên trong. Về thời điểm: rò ngay khi cấp nước nghiêng về
    đầu nối ống cấp hoặc van cấp; rò trong lúc giặt nghiêng về gioăng cửa, ngăn
    bột giặt hoặc thùng; rò khi xả nghiêng về ống xả, bơm hoặc bộ lọc; rò cả khi
    máy không chạy nghiêng về van cấp không kín hoặc đầu nối lỏng. Một nguyên
    nhân thường bị hiểu nhầm là dùng quá nhiều bột hoặc nước giặt: bọt sinh ra
    nhiều tràn qua các khe và ra ngoài, và người dùng tưởng máy rò. Về an toàn,
    rò nước ở khu vực có điện là tình huống cần dừng máy, rút phích và khoá van
    nước trước khi làm gì khác. Người dùng kiểm tra được các điểm bên ngoài như
    đầu nối, nắp lọc, gioăng cửa và ngăn bột; các điểm bên trong cần thợ.
