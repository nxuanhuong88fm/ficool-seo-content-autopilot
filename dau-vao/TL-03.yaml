nghien_cuu:
  van_ban: >-
    Không phải mọi lớp tuyết trong tủ lạnh đều là hỏng hóc, và việc phân biệt
    bắt đầu từ loại tủ. Tủ đóng tuyết theo thiết kế, thường gọi là tủ đóng tuyết
    trực tiếp, có dàn lạnh lộ ra trong ngăn đá và tích tuyết theo thời gian; đó
    là hoạt động bình thường và người dùng cần rã đông định kỳ. Tủ không đóng
    tuyết có bộ xả tuyết tự động chạy theo chu kỳ để làm tan lớp tuyết bám trên
    dàn lạnh, nước tan chảy xuống khay bay hơi; ở loại tủ này, tuyết dày bám
    thành mảng là dấu hiệu bất thường. Bốn nguyên nhân bất thường thường gặp:
    bộ xả tuyết hỏng, gồm điện trở xả tuyết, cầu chì nhiệt hoặc bộ hẹn giờ, làm
    tuyết tích tụ liên tục; cửa đóng không kín do gioăng chai, do tủ kê nghiêng
    hoặc do thực phẩm chặn, khiến hơi ẩm từ ngoài vào liên tục và ngưng tụ thành
    băng; thói quen mở cửa nhiều lần hoặc mở lâu, đặc biệt ở khí hậu nóng ẩm;
    đặt thức ăn còn nóng hoặc thực phẩm không đậy kín vào tủ, làm tăng lượng hơi
    ẩm bên trong. Về vị trí tuyết, tuyết bám ở thành sau ngăn đá nghiêng về dàn
    lạnh và bộ xả tuyết; tuyết hoặc băng bám quanh viền cửa nghiêng về gioăng
    cửa; băng đóng ở đáy ngăn mát thường liên quan tới lỗ thoát nước ngưng bị
    nghẹt. Về xử lý, tuyệt đối không dùng vật cứng nhọn cạy tuyết vì dàn lạnh
    làm bằng ống nhôm mỏng, thủng ống là rò rỉ môi chất lạnh và chi phí sửa lớn.
    Cách an toàn là rã đông tự nhiên sau khi rút điện.
