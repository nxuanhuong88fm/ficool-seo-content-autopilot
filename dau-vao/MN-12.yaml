  van_ban: >-
    Lắp đặt máy nước nóng có ba nhóm yêu cầu tách bạch: kết cấu, đường nước và
    điện. Về kết cấu, bình chứa khi đầy nước nặng hơn rất nhiều so với lúc rỗng,
    nên tường treo phải là tường chịu lực và bộ giá treo cùng bu lông phải theo
    đúng khuyến cáo của nhà sản xuất; tường gạch nhẹ hoặc vách thạch cao không
    treo trực tiếp được. Vị trí còn cần chừa khoảng thao tác phía dưới và phía
    trước để sau này tháo được mặt bích và thanh đốt khi vệ sinh hoặc thay thế —
    một chiếc bình lắp sát trần trong hốc kín là chiếc bình mà mọi lần bảo trì
    đều tốn thêm công tháo dỡ. Về khoảng cách, đặt máy gần điểm dùng làm giảm
    lượng nước nguội phải xả bỏ và giảm thất thoát nhiệt trên đường ống. Về
    đường nước, cần có van khoá trên đường cấp để cô lập máy khi bảo trì, van
    một chiều và van an toàn theo cấu hình của nhà sản xuất, và quan trọng là
    đường xả của van an toàn phải dẫn tới nơi thoát nước chứ không xả tự do lên
    sàn hay lên thiết bị khác. Về điện, các hãng khuyến cáo cấp nguồn riêng cho
    máy, có dây tiếp địa thật và có thiết bị chống dòng rò; việc chọn aptomat và
    tiết diện dây thuộc phần việc của thợ điện dựa trên công suất máy. Hai lớp
    bảo vệ là tiếp địa và thiết bị chống rò không thay thế cho nhau. Sau khi
    lắp, cần xả hết khí trong bình bằng cách mở vòi nước nóng cho tới khi nước
    chảy đều rồi mới cấp điện, vì cấp điện khi bình chưa đầy nước làm thanh đốt
    chạy khô và hỏng.
