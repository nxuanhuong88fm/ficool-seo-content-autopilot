nghien_cuu:
  van_ban: >-
    Khi lưu lượng nước qua máy nước nóng giảm, vị trí nghẽn trong phần lớn trường
    hợp nằm ở hai đầu của đường nước chứ không nằm trong thân máy: lỗ phun của
    vòi sen ở đầu ra, và lưới lọc ở đầu vào nước lạnh. Cặn tích tụ ở hai chỗ này
    chủ yếu là muối cacbonat của canxi và magie kết tủa từ nước cấp, và vì tiết
    diện lỗ phun rất nhỏ nên một lớp cặn mỏng cũng làm giảm lưu lượng rõ rệt.
    Cacbonat tan trong axit yếu, nên ngâm trong dung dịch giấm ăn là cách xử lý
    thông dụng, trong khi axit mạnh và vật liệu chà nhám gây hỏng lớp mạ cùng chi
    tiết nhựa, và dùng vật nhọn bằng kim loại thông lỗ phun sẽ làm rộng lỗ không
    đều khiến tia nước phân tán sai. Với máy làm nóng trực tiếp, việc lưới lọc
    đầu vào bị nghẽn tạo ra một biểu hiện dễ chẩn đoán sai: loại máy này chỉ bật
    thanh đốt khi lưu lượng nước qua máy đạt ngưỡng kích hoạt, nên lưới nghẽn làm
    lưu lượng tụt xuống dưới ngưỡng và máy không nóng — người dùng kết luận máy
    hỏng bộ đốt trong khi nguyên nhân là một lưới lọc bẩn. Phép thử tách nguyên
    nhân đơn giản nhất là so sánh lưu lượng ở một vòi khác trên cùng đường cấp:
    nếu vòi đó cũng yếu thì vấn đề nằm ở đường cấp chung hoặc áp lực nước của
    nhà, còn nếu chỉ riêng đường qua máy nước nóng yếu thì nghẽn nằm trong nhánh
    đó. Về an toàn, phải ngắt điện và đóng van cấp nước trước khi tháo lưới lọc,
    và sau khi lắp lại phải xả hết khí trong đường ống bằng cách mở vòi nóng cho
    tới khi nước ra liên tục rồi mới cấp điện, vì thanh đốt hoạt động khi không có
    nước sẽ bị hỏng. Riêng cụm van đầu vào của bình chứa gián tiếp có van một
    chiều và van an toàn nên không phải là chi tiết để tháo rời tuỳ ý.
