nghien_cuu:
  van_ban: >-
    Các tài liệu hướng dẫn bảo dưỡng điều hoà không đưa ra một con số tần suất
    chung cho mọi máy, mà gắn tần suất với điều kiện vận hành. Bộ Năng lượng Hoa
    Kỳ khuyến cáo kiểm tra lưới lọc theo tháng trong mùa dùng nhiều và làm sạch
    hoặc thay khi thấy bẩn, đồng thời nêu rằng môi trường nhiều bụi, nhà có thú
    nuôi hoặc máy chạy gần như liên tục đều rút ngắn khoảng cách giữa hai lần
    làm sạch. Tài liệu cũng phân biệt rõ hai nhóm việc có chu kỳ khác nhau:
    phần lưới lọc mà người dùng tự làm được với chu kỳ ngắn, và phần dàn trao
    đổi nhiệt, máng nước, quạt cùng dàn nóng vốn cần kỹ thuật viên với chu kỳ
    dài hơn. Lá dàn lạnh và dàn nóng bám bụi làm giảm khả năng trao đổi nhiệt,
    và bụi tích tụ theo thời gian chứ không theo lịch, nên cách xác định đáng
    tin là kết hợp mốc thời gian tham khảo với việc quan sát dấu hiệu thực tế:
    gió ra yếu đi, mùi ẩm xuất hiện, máy chạy lâu hơn để đạt cùng nhiệt độ,
    hoặc có nước nhỏ giọt. Với môi trường thương mại như quán ăn, văn phòng
    hoặc nhà gần đường lớn, lượng bụi và dầu mỡ bám nhiều hơn hẳn so với hộ gia
    đình dùng vài giờ mỗi tối, nên cùng một model có thể cần chu kỳ rất khác
    nhau.
