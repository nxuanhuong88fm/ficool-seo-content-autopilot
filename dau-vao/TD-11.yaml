nghien_cuu:
  van_ban: >-
    Thiết bị lạnh thương mại trong cửa hàng vận hành ở điều kiện khắt khe hơn tủ
    gia đình: cửa mở rất nhiều lần mỗi ngày, hàng hoá xếp dày, và thiệt hại khi
    hỏng không nằm ở tiền sửa mà ở lô hàng bảo quản bên trong. Nguyên nhân làm
    giảm hiệu suất phổ biến nhất là dàn nóng bám bụi và dầu mỡ: lớp bám đó hoạt
    động như một tấm cách nhiệt, làm nhiệt độ ngưng tụ tăng lên, kéo theo áp suất
    đẩy tăng, năng suất lạnh giảm và máy nén phải chạy dài hơn để giữ cùng một
    nhiệt độ. Kiểu hỏng đáng lo hơn cả lại là kiểu không phát tín hiệu nào: khi
    dàn lạnh bị tuyết bọc kín, lớp tuyết cách nhiệt giữa không khí và dàn nên cảm
    biến vẫn đọc được nhiệt độ chấp nhận được ở vị trí của nó trong khi hàng hoá
    ở phần xa đang ấm dần; tương tự, quạt dàn lạnh chết làm không khí ngừng luân
    chuyển, máy nén vẫn chạy và tủ vẫn kêu bình thường nhưng nhiệt độ trong
    khoang phân tầng nặng. Gioăng cửa trên tủ trưng bày chịu số lần đóng mở rất
    lớn nên bị biến dạng dư và bản lề bị xệ, tạo khe hở nhỏ thường trực; khe đó
    đưa khí ẩm bên ngoài vào liên tục, vừa làm máy chạy dài hơn vừa cấp ẩm cho
    dàn lạnh đóng tuyết. Vì các cơ chế trên, phép đo đáng tin không phải nhiệt độ
    khí trong khoang — con số này dao động mạnh theo mỗi lần mở cửa — mà là nhiệt
    độ của chính hàng hoá ở vị trí ấm nhất trong tủ, vì nó phản ánh trạng thái đã
    ổn định. Quy định an toàn thực phẩm của Hoa Kỳ lấy mốc bảo quản lạnh là 5°C
    hoặc thấp hơn, và với hàng đông thì yêu cầu là giữ thực phẩm đông cứng liên
    tục, không có mốc thời gian nào cho phép rã rồi đông lại. Điều kiện bên ngoài
    cũng quyết định: dàn nóng thải nhiệt vào phòng, nên một tủ kê sát tường hoặc
    bị kẹp sau quầy sẽ làm việc ở nhiệt độ môi trường cao hơn nhiệt độ chung của
    cửa hàng, và hệ thống xả tuyết hỏng bộ hẹn hoặc hỏng điện trở sẽ làm tuyết
    dày lên theo từng ngày thay vì hỏng dứt khoát một lần.
