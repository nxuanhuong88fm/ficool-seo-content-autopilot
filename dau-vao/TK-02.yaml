nghien_cuu:
  van_ban: >-
    Khi lồng máy sấy vẫn quay nhưng khí ra không nóng, cần phân biệt ba khả năng
    trước khi kết luận hỏng. Thứ nhất là kiểu máy: máy bơm nhiệt hoạt động ở
    nhiệt độ thấp hơn hẳn máy thông hơi và máy ngưng tụ, nên đồ lấy ra không
    nóng là hành vi theo thiết kế chứ không phải triệu chứng. Thứ hai là chế độ
    đang chọn: hầu hết máy có các chương trình thổi gió hoặc làm mới không dùng
    gia nhiệt, và chọn nhầm chúng cho ra đúng hiện tượng lồng quay mà không
    nóng. Thứ ba mới là hỏng hóc thật, và nhóm này có một đặc điểm quan trọng về
    chẩn đoán: các máy sấy dùng gia nhiệt đều có thiết bị bảo vệ quá nhiệt gồm
    rơ le nhiệt và cầu chì nhiệt, ngắt mạch gia nhiệt khi nhiệt độ vượt ngưỡng.
    Nguyên nhân làm nhiệt độ vượt ngưỡng gần như luôn là dòng khí bị cản: bộ lọc
    xơ vải bám kín, đường ống thoát khí tắc hoặc gập, hoặc quạt thổi yếu. Vì
    vậy, thay cầu chì nhiệt mà không xử lý nguyên nhân cản khí là làm cho nó
    cháy lại, và đây là lỗi chẩn đoán phổ biến. Các nguyên nhân hỏng hóc khác
    gồm điện trở gia nhiệt đứt, rơ le điều khiển hoặc bo mạch lỗi, và cảm biến
    nhiệt sai. Một điểm an toàn cần lưu ý là xơ vải tích tụ trong đường khí vừa
    là nguyên nhân quá nhiệt vừa là vật liệu dễ cháy, nên việc vệ sinh bộ lọc và
    đường thoát khí thuộc nhóm bảo trì an toàn chứ không chỉ là bảo trì hiệu
    suất.
