nghien_cuu:
  van_ban: >-
    Câu hỏi trung tâm khi vận chuyển tủ lạnh liên quan tới dầu bôi trơn trong
    block máy nén. Block chứa một lượng dầu để bôi trơn các chi tiết chuyển
    động; ở tư thế đứng, dầu nằm ở đáy block đúng nơi thiết kế. Khi tủ bị đặt
    nằm, dầu có thể chảy ra khỏi khoang chứa và đi vào đường ống môi chất lạnh.
    Nếu cắm điện ngay sau khi dựng lại, block khởi động trong lúc dầu chưa trở
    về đủ, dẫn tới thiếu bôi trơn và có thể gây hỏng. Đó là lý do mọi hướng dẫn
    sử dụng đều yêu cầu để tủ đứng yên một khoảng thời gian trước khi cắm điện
    sau khi vận chuyển. Khoảng thời gian cụ thể khác nhau giữa các model và
    được ghi trong tài liệu đi kèm; nguyên tắc chung được nhiều nhà sản xuất
    nêu là thời gian chờ tương ứng với thời gian tủ từng nằm, và với tủ được
    giữ đứng suốt hành trình thì thời gian chờ ngắn hơn nhiều. Về tư thế, giữ
    đứng luôn là lựa chọn an toàn nhất. Nếu buộc phải nằm, nên tránh nằm về
    phía có đường ống dẫn ở lưng và tránh nằm sấp về phía cửa. Các bước chuẩn bị
    trước khi di chuyển gồm: rút phích cắm và để tủ rã đông hoàn toàn nếu có
    tuyết, vì nước tan sẽ chảy ra trong lúc vận chuyển; đổ hết nước trong khay
    bay hơi phía sau và trong bình chứa nước nếu tủ có chức năng lấy nước; lấy
    hết thực phẩm; tháo hoặc cố định các khay kính và ngăn kéo bằng băng dính để
    chúng không xô lệch và vỡ; cố định cửa bằng dây hoặc băng dính bản rộng; và
    bọc góc cùng mặt ngoài để tránh xước. Khi tới nơi, nên đặt tủ vào vị trí
    cuối cùng, cân chỉnh chân, rồi mới bắt đầu tính thời gian chờ.
