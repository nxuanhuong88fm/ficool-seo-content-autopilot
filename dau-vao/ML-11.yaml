nghien_cuu:
  van_ban: >-
    Một chiếc máy lạnh nghỉ dài ngày không đứng yên về mặt trạng thái: bụi tiếp
    tục lắng lên lưới lọc và lá dàn, hơi ẩm còn lại trong máng hứng nước ngưng
    và trên bề mặt dàn lạnh tạo điều kiện cho nấm mốc phát triển vì không còn
    dòng khí làm khô, và dàn nóng đặt ngoài trời trở thành nơi côn trùng làm tổ
    hoặc chuột trú ngụ. Các trường hợp tổ côn trùng trong khoang dàn nóng hoặc
    trong đường ống thoát nước ngưng là nguyên nhân quen thuộc của việc máy chạy
    lại thì kém lạnh hoặc chảy nước. Về phần điện, dây dẫn ngoài trời có thể bị
    chuột cắn hoặc bị lão hoá vỏ cách điện, và các điểm đấu nối có thể oxy hoá
    trong môi trường ẩm. Về phần cơ, dầu bôi trơn trong máy nén lắng xuống khi
    máy nghỉ lâu; nhiều nhà sản xuất khuyến cáo cấp nguồn cho máy một khoảng
    thời gian trước khi cho chạy chế độ làm lạnh, để bộ sấy dầu của máy nén hoạt
    động, và khoảng thời gian này khác nhau theo model nên cần tra tài liệu của
    máy. Về môi chất, rò rỉ xảy ra trong thời gian không dùng sẽ không được phát
    hiện cho tới lần bật lại, nên biểu hiện kém lạnh sau một mùa nghỉ có thể bắt
    nguồn từ đó. Trình tự khởi động lại được khuyến cáo là kiểm tra ngoại quan
    và vệ sinh trước, cấp nguồn chờ theo hướng dẫn, chạy chế độ quạt trước để
    làm khô và đẩy bụi, rồi mới chạy chế độ làm lạnh và theo dõi trong thời gian
    đầu.
