nghien_cuu:
  van_ban: >-
    Quần áo giặt xong vẫn có mùi thường bắt nguồn từ hai phía: bản thân máy đã
    tích tụ cặn và vi sinh vật, hoặc thói quen sử dụng tạo điều kiện cho điều đó
    xảy ra. Về phía máy, các điểm tích tụ chính là gioăng cửa ở máy cửa trước
    với các nếp gấp giữ ẩm và xơ vải, ngăn đựng bột giặt nơi bột đóng cục, lồng
    ngoài mà người dùng không nhìn thấy được, bộ lọc bơm xả, và đường ống xả.
    Màng sinh học hình thành ở các bề mặt ẩm này và phát ra mùi ẩm mốc, đồng
    thời bám ngược lên quần áo trong lúc giặt. Về phía thói quen, ba yếu tố phổ
    biến: đóng cửa máy ngay sau khi giặt xong khiến hơi ẩm bị giữ lại bên trong;
    để quần áo ướt trong lồng nhiều giờ sau khi chu trình kết thúc; và giặt liên
    tục ở nhiệt độ thấp, vì nước lạnh không đủ để phân huỷ dầu mỡ cùng cặn bột
    giặt, khiến lớp cặn tích tụ dần. Dùng quá nhiều bột giặt hoặc nước xả cũng
    làm tăng cặn thay vì làm sạch hơn. Về phòng ngừa, các khuyến cáo phổ biến
    gồm: để cửa và ngăn bột giặt hé sau mỗi lần giặt cho khô, lấy quần áo ra
    ngay khi chu trình kết thúc, định kỳ chạy một chu trình vệ sinh lồng ở nhiệt
    độ cao với lồng rỗng, lau gioăng cửa sau mỗi vài lần giặt, và dùng đúng
    lượng bột theo hướng dẫn. Vệ sinh chuyên sâu tháo lồng chỉ cần khi mùi vẫn
    còn sau khi đã làm các bước trên, vì phần cặn nằm ở mặt ngoài lồng.
