nghien_cuu:
  van_ban: >-
    Hiện tượng ngăn đá vẫn lạnh trong khi ngăn mát ấm là dấu hiệu đặc trưng, và
    nó loại trừ được ngay một loạt nguyên nhân. Nếu ngăn đá còn lạnh thì block
    máy nén vẫn chạy, hệ thống môi chất lạnh vẫn còn đủ, và dàn lạnh vẫn sinh
    lạnh. Vấn đề nằm ở khâu ĐƯA khí lạnh từ ngăn đá xuống ngăn mát. Với đa số
    tủ lạnh hiện nay, dàn lạnh nằm ở ngăn đá và một quạt gió thổi khí lạnh qua
    một cửa gió xuống ngăn mát; lượng khí đi xuống được điều tiết bằng một cửa
    gió đóng mở theo nhiệt độ cài đặt. Bốn nhóm nguyên nhân theo thứ tự từ dễ
    tới khó: một là cửa gió bị chặn bởi thực phẩm xếp sát, hộp đựng cao, hoặc
    túi nylon bị hút vào; hai là dàn lạnh bám tuyết dày làm khí không qua được,
    thường do bộ xả tuyết hỏng hoặc do cửa đóng không kín làm hơi ẩm vào liên
    tục; ba là quạt gió hỏng hoặc kẹt, dấu hiệu là mở cửa ngăn đá không nghe
    tiếng quạt chạy dù block vẫn chạy; bốn là cảm biến nhiệt độ ngăn mát sai
    hoặc bo mạch điều khiển cửa gió lỗi. Người dùng tự kiểm được nhóm một và
    một phần nhóm hai bằng quan sát. Có một nhầm lẫn phổ biến cần nêu: nhiều
    người thấy ngăn mát ấm thì tăng mức lạnh lên cao nhất, nhưng nếu nguyên
    nhân là dàn bám tuyết thì việc đó làm tuyết dày thêm và tình trạng nặng hơn.
    Cách xử lý đúng khi nghi bám tuyết là rã đông toàn bộ tủ rồi quan sát tốc độ
    tuyết quay lại.
