nghien_cuu:
  van_ban: >-
    Quạt điều hòa có hai mạch làm việc song song: mạch nước gồm bình chứa, bơm,
    đường ống dẫn cùng máng phân phối, tấm làm mát và đường nước hồi về bình; và
    mạch gió gồm lưới lọc, tấm làm mát, cánh quạt và động cơ. Điểm quyết định thứ
    tự ưu tiên khi bảo trì là hai mạch này hỏng theo hai kiểu rất khác nhau: mạch
    gió hỏng thì người dùng biết ngay vì gió yếu hoặc máy có tiếng lạ, còn mạch
    nước hỏng thường không phát tín hiệu nào rõ ràng vì quạt vẫn chạy bình thường
    nên máy trông vẫn hoạt động, chỉ có khí ra không mát. Kiểu hỏng khó đoán nhất
    thuộc mạch nước là các lỗ trên máng phân phối bị cặn khoáng bít dần: bơm vẫn
    làm việc và vẫn có tiếng nước, nhưng nước chỉ còn ra ở một vài lỗ nên tấm làm
    mát chỉ ướt một phần trong khi phần lớn diện tích tấm vẫn khô, và vì hiệu quả
    bay hơi tỉ lệ với diện tích tấm được làm ướt, máy mất phần lớn khả năng làm mát
    mà không có biểu hiện nào ngoài việc khí ra không mát. Các điểm khác của mạch
    nước gồm phần lọc ở đầu hút bơm bị cặn làm nước lên yếu, tấm làm mát bị cặn
    khoáng nên nước chảy tràn thay vì ngấm vào, và đường nước hồi bị nghẽn. Về an
    toàn điện, đây là thiết bị điện chứa nước và thường được di chuyển nên dây
    nguồn cùng phích cắm chịu tác động cơ học nhiều hơn thiết bị đứng yên, vì thế
    việc kiểm tra dây, phích và điều kiện bảo vệ của ổ cắm là hạng mục riêng chứ
    không gộp vào phần vệ sinh. Hạng mục có đòn bẩy lớn nhất với thiết bị dùng theo
    mùa lại là cách cất máy khi hết mùa nóng: dốc cạn nước, vệ sinh, cho quạt chạy
    mà tắt bơm để làm khô tấm, rồi che phủ và cất nơi khô; trạng thái máy ở đầu mùa
    sau gần như được quyết định hoàn toàn bởi bước này, và phần lớn khiếu nại trong
    tuần nóng đầu tiên bắt nguồn từ việc máy đã được cất trong tình trạng còn ẩm.
