nghien_cuu:
  van_ban: >-
    Mùi trong tủ đông gần như luôn có nguồn vật chất, nên cách xử lý bền vững là
    tìm và loại bỏ nguồn chứ không phải che mùi. Các nguồn thường gặp gồm: nước
    rỉ từ thịt cá chảy xuống đáy hoặc thấm vào khe giữa các lớp lót rồi đóng
    băng lại; thực phẩm không đậy kín làm mùi lan chéo giữa các món và làm bề
    mặt thực phẩm bị khô do thăng hoa; một món đã hỏng trước khi được đưa vào
    tủ; hàng đã rã đông trong một đợt mất điện hoặc một lần quên đóng nắp rồi
    được cấp đông lại; cặn bẩn tích trong rãnh gioăng; và đường thoát nước bị
    tắc khiến nước đọng lại. Lớp tuyết cũ cũng giữ mùi, nên tủ bám tuyết dày
    thường khó khử mùi nếu chưa xả tuyết. Về an toàn thực phẩm, cơ quan quản lý
    khuyến cáo thận trọng với thực phẩm đã rã đông ngoài mức lạnh an toàn trong
    thời gian dài, vì trong khoảng nhiệt độ từ khoảng 4 tới 60 độ C vi khuẩn
    phát triển nhanh; mùi bất thường xuất hiện sau một đợt mất điện là dấu hiệu
    cần rà lại toàn bộ hàng trong tủ. Về vật liệu, chất tẩy mạnh và dung môi
    không được khuyến khích vì mùi hoá chất bám lại sẽ ám sang thực phẩm; các
    biện pháp hút mùi phổ biến sau khi đã làm sạch là đặt bột nở hoặc than hoạt
    tính trong khoang. Bước lau khô hoàn toàn trước khi cắm điện lại là điều
    kiện để mùi không quay lại.
