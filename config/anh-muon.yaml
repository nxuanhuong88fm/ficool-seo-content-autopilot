# ── Tầng 0: chỉ đích danh theo MÃ BÀI, thắng cả hai tầng dưới ────────────────
#
# VÌ SAO CẦN TẦNG NÀY. Tầng 2 định tuyến theo TIỀN TỐ mã bài, mà tiền tố là
# DÒNG THIẾT BỊ chứ không phải THIẾT BỊ. Hệ quả đo được ngày 11/09: cả 18 bài
# TD đi về `/dich-vu/sua-chua-tu-mat/` và cả 18 bài MN đi về
# `/dich-vu/sua-binh-nong-lanh/`, nên ảnh 416 (tủ đông) và 418 (máy nước nóng
# trực tiếp) nằm ở **0 lượt dùng** — và sẽ mãi ở 0. Không phải vì thiếu bài
# hợp, mà vì bảng không có đường nào dẫn tới chúng (RULES A126).
#
# Trỏ tới TRANG DỊCH VỤ chứ không tới attachment id: id chỉ khai một chỗ duy
# nhất là `theo_trang_dich_vu`. Hai bảng cùng giữ id là hai bản sao sẽ trôi.
#
# Chỉ liệt kê bài LỆCH khỏi mặc định của danh mục. Bài nói về cả hai thiết bị
# (TD-11, TD-16, TD-18) giữ mặc định tủ mát.
