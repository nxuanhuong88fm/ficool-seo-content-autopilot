# Nguồn DUY NHẤT của luật cấm khẳng định. knowledge/business/forbidden-claims.md
# là bản văn xuôi cho người đọc; file này là bản máy đọc. Đừng chép luật sang chỗ khác.
#
# Mỗi luật BẮT BUỘC có `chan` và `khong_chan`. tests/test_qa.py chạy cả hai chiều:
# luật phải bắt được `chan` VÀ phải tha `khong_chan`. Không có phép thử phủ định
# thì luật lặng lẽ chặn nhầm — như regex `\bcam kết\b` của bản cũ, nó chặn cả câu
# "Những gì Ficool cam kết làm" trên chính trang chủ ficool.top.

luat:
  - ten: tuyet_doi
    ly_do: Khẳng định tuyệt đối không kiểm chứng được.
    mau: '100\s*%|\btuyệt đối\b'
    chan: 'Sạch 100% mọi loại nấm mốc.'
    khong_chan: 'Vệ sinh định kỳ giúp máy chạy êm hơn.'

  - ten: so_sanh_nhat
    ly_do: >
      So sánh nhất về NHÀ CUNG CẤP, GIÁ hoặc THỊ TRƯỜNG là khẳng định không có
      dữ liệu chống lưng. Nhưng so sánh nhất về một CÁCH LÀM, một BƯỚC KIỂM hay
      một DẤU HIỆU bên trong bài là lập luận kỹ thuật bình thường — và đó chính
      là thứ bản cũ bắt nhầm.

      Bản cũ khớp trần sáu cụm từ ở bất kỳ đâu, nên nó bắt nhầm 13 lượt trên
      108 bài. Ba kiểu bắt nhầm, cả ba nay đều nằm trong `khong_chan`:
      (1) "số 1" của một NÚM XOAY — "đánh số 1 tới 7";
      (2) "hàng đầu" nghĩa là DÒNG ĐẦU của một bảng — "Hàng đầu tiên là…";
      (3) so sánh nhất về cách làm — "cách làm rẻ nhất", "hạng mục kiểm nhanh
      nhất", "việc rẻ nhất có ảnh hưởng lớn nhất".

      Mỗi lượt bắt nhầm tốn một vòng viết lại, mà vòng đó không làm bài đúng
      hơn — nó chỉ làm bài tránh một chuỗi ký tự.

      Nay luật đòi so sánh nhất phải ĐI KÈM chủ thể thương mại (dịch vụ, đơn vị,
      giá, Ficool, chúng tôi…) hoặc phạm vi thị trường (thị trường, TP.HCM, cả
      nước…). Riêng `uy tín nhất` giữ vô điều kiện vì nó không có nghĩa kỹ thuật.

      ⚠️ CÒN LỌT: "Sửa máy lạnh tốt nhất" — không chủ thể, không phạm vi. Thu
      hẹp thêm để bắt nó thì sẽ bắt lại "cách vệ sinh tốt nhất". Đã cân nhắc và
      chọn bỏ: đây là cổng chặn CHỮ, không phải cổng duy nhất.
    mau: '(?:dịch vụ|đơn vị|công ty|trung tâm|cửa hàng|thợ|kỹ thuật viên|thương hiệu|địa chỉ|mức giá|chi phí|giá|Ficool|chúng tôi)[^.\n]{0,30}?\b(?:rẻ nhất|tốt nhất|uy tín nhất|hàng đầu|nhanh nhất|số 1)\b|\b(?:rẻ nhất|tốt nhất|uy tín nhất|hàng đầu|nhanh nhất|số 1)\b[^.\n]{0,30}?(?:thị trường|Việt Nam|TP\.?\s?HCM|thành phố|khu vực|cả nước|toàn quốc|ngành)|\buy tín nhất\b'
    chan:
      - 'Dịch vụ tốt nhất thành phố.'
      - 'Ficool là đơn vị hàng đầu TP.HCM.'
      - 'Giá rẻ nhất thị trường.'
      - 'Trung tâm sửa máy lạnh số 1 Việt Nam.'
      - 'Chúng tôi có mặt nhanh nhất khu vực.'
      - 'Đơn vị uy tín nhất.'
    khong_chan:
      - 'Chọn đơn vị phù hợp với tình trạng máy của bạn.'
      - 'Núm xoay đánh số 1 tới 7 trên tủ đông không phải thang nhiệt độ.'
      - 'Hàng đầu tiên là phép thử quan trọng nhất trong cả bài.'
      - 'Cách làm rẻ nhất và hiệu quả nhất là rửa lưới lọc theo chu kỳ.'
      - 'Xếp dày bít đường gió là cách nhanh nhất tạo ra vùng ấm trong tủ.'
      - 'Đây là hạng mục kiểm nhanh nhất trong cả bài.'
      - 'Lỗi lắp đặt nào làm ống thoát khí bẩn nhanh nhất?'
      - 'Đây là việc rẻ nhất có ảnh hưởng lớn nhất tới tuổi máy nén.'
      - 'Cách tốt nhất để biết là đặt nhiệt kế vào vị trí ấm nhất của tủ.'

  - ten: gia_cu_the
    ly_do: >
      Giá phải lấy từ Bảng giá trong wp-admin (ficool_pg_banggia_html), không được
      để model tự nghĩ ra. Sai giá là sai cam kết với khách.
    mau: '\d[\d.,]*\s*(?:đ\b|vnđ|vnd|nghìn|triệu)|\bchỉ từ\s+\d'
    chan: 'Vệ sinh máy lạnh chỉ từ 150.000đ.'
    khong_chan: 'Chi phí phụ thuộc công suất máy và tình trạng thực tế.'

  - ten: bao_hanh_thoi_han
    ly_do: Thời hạn bảo hành là dữ liệu kinh doanh, phải do người cấu hình.
    mau: 'bảo hành\s+\D{0,12}\d+\s*(?:ngày|tuần|tháng|năm)'
    chan: 'Bảo hành lên tới 12 tháng.'
    khong_chan: 'Hỏi rõ chính sách bảo hành trước khi đồng ý sửa.'

  - ten: cam_ket_dinh_luong
    ly_do: >
      "cam kết" là từ tiếng Việt bình thường và trang chủ Ficool đang dùng
      ("Những gì Ficool cam kết làm"). Chỉ chặn khi nó đi kèm CON SỐ — lúc đó
      nó thành lời hứa định lượng mà không ai cấu hình.
    mau: 'cam kết[^.\n]{0,40}\d'
    chan: 'Ficool cam kết có mặt trong 30 phút.'
    khong_chan: 'Những gì Ficool cam kết làm: kiểm tra trước, báo giá rõ ràng.'

  - ten: thoi_gian_phan_hoi
    ly_do: Thời gian có mặt là cam kết vận hành, không phải nội dung bài viết.
    mau: 'có mặt\s+\D{0,10}\d+\s*(?:phút|giờ|h\b)|\d+\s*(?:phút|giờ)\s+có mặt'
    chan: 'Kỹ thuật viên có mặt sau 15 phút.'
    khong_chan: 'Thời gian xử lý tuỳ lịch kỹ thuật viên trong khu vực.'

  - ten: kinh_nghiem_nam
    ly_do: Số năm kinh nghiệm, số ca đã làm — dữ liệu doanh nghiệp, dễ bịa.
    mau: 'hơn\s+\d+\s*năm|\d+\s*năm\s+kinh nghiệm|\d[\d.,]*\+?\s*(?:khách hàng|ca|công trình)'
    chan: 'Đội ngũ hơn 10 năm kinh nghiệm.'
    khong_chan: 'Kỹ thuật viên được đào tạo cho từng dòng máy.'

  - ten: thong_ke_khong_nguon
    ly_do: Thống kê không nguồn là bịa có vẻ khoa học.
    mau: '\d+\s*%\s*(?:khách hàng|người dùng|trường hợp|hộ gia đình)'
    chan: '80% khách hàng gặp lỗi này.'
    khong_chan: 'Đây là một trong những lỗi thường gặp.'
