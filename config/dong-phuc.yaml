# Đồng phục kỹ thuật viên Ficool — mẫu chuẩn cho MỌI ảnh sinh ra.
#
# ⚠️ MÃ MÀU CHỈ ĐƯỢC LẤY TỪ TOKEN ĐÃ DUYỆT của dự án site
# (backups/step4/ficool-tokens.json, dải accent). Quy tắc dự án cấm đẻ giá trị
# thiết kế mới, và đồng phục là một quyết định thiết kế. `tests/test_dong_phuc.py`
# kiểm mọi mã hex trong tệp này có nằm trong tập token hay không.
#
# Vì sao để trong YAML chứ không hardcode trong .py: khách còn phải xem vài
# phương án rồi mới chốt. Đổi phương án là đổi một tệp cấu hình, không phải sửa mã.

token_duoc_phep:
  accent-100: '#e8f4fc'
  accent-200: '#c6e4f7'
  accent-300: '#93cbee'
  accent-400: '#3a8fc9'
  accent-500: '#0077cc'
  accent-600: '#0062a8'
  accent-700: '#0b5188'
  accent-800: '#073d68'
  accent-900: '#0c314b'
  text-on-accent: '#ffffff'

# Mẫu đang dùng. Đổi `dang_dung` để chuyển sang phương án khác sau khi khách chọn.
dang_dung: navy-nep-xanh

phuong_an:
  navy-nep-xanh:
    ten: 'Navy, nẹp vai xanh thương hiệu'
    kieu: lien-quan
    than_ao: accent-900          # #0c314b
    nep_vai: accent-500          # #0077cc
    chu: text-on-accent          # #ffffff
    mo_ta: >-
      Áo liền quần (coverall) tay dài màu xanh navy đậm, hai nẹp mảnh màu xanh
      thương hiệu chạy dọc vai, cổ bẻ, khoá kéo giữa trước, hai túi ngực có nắp.

  navy-nep-nhat:
    ten: 'Navy, nẹp xanh nhạt'
    kieu: lien-quan
    than_ao: accent-900
    nep_vai: accent-300          # #93cbee
    chu: text-on-accent
    mo_ta: >-
      Như trên nhưng nẹp vai dùng xanh nhạt, tương phản dịu hơn, hợp ảnh chụp
      trong nhà thiếu sáng.

  xanh-dam-tron:
    ten: 'Xanh đậm trơn, không nẹp'
    kieu: lien-quan
    than_ao: accent-700          # #0b5188
    nep_vai: null
    chu: text-on-accent
    mo_ta: >-
      Áo liền quần màu xanh đậm trơn, không nẹp trang trí. Ít chi tiết nhất nên
      model ít vẽ sai nhất; đổi lại kém nhận diện hơn.

  xanh-vai-tuong-phan:
    ten: 'Xanh trung, vai tương phản'
    kieu: lien-quan
    than_ao: accent-600          # #0062a8
    nep_vai: accent-900
    chu: text-on-accent
    mo_ta: >-
      Thân áo xanh trung, khối vai và tay trên màu navy đậm. Nhìn giống đồng phục
      công nghiệp hơn, nổi rõ trong ảnh nền sáng.

  ao-quan-roi-xanh-dam:
    ten: 'Áo tách quần, xanh đậm (kiểu #1, màu #3)'
    kieu: ao-quan-roi
    than_ao: accent-700          # #0b5188 — mau cua phuong an xanh-dam-tron
    nep_vai: accent-300          # #93cbee — tuong phan du tren nen accent-700
    chu: text-on-accent
    mo_ta: >-
      Áo sơ mi lao động TAY DÀI cài cúc, măng sét cài cúc ở cổ tay, cổ bẻ, hai
      túi ngực có nắp, hai nẹp mảnh chạy dọc vai. Quần dài rời cùng tông, ống
      đứng, có túi hông. Áo bỏ trong quần, thắt lưng đen bản nhỏ.

# Kiểu trang phục
kieu_trang_phuc:
  lien-quan: 'áo liền quần (coverall) tay dài, khoá kéo giữa trước'
  ao-quan-roi: 'áo sơ mi lao động TAY DÀI rời + quần dài rời cùng tông'

# Chữ trên ngực áo. Khách đã chốt CÓ chữ, chấp nhận rủi ro model vẽ méo.
chu_nguc:
  noi_dung: Ficool
  vi_tri: 'ngực trái'
  # ⚠️ Model sinh ảnh viết chữ rất tệ — lượt sinh ML-01 đầu tiên nó thêu ra chữ
  # vô nghĩa trên áo. Không có phép kiểm tự động nào bắt được chữ méo, nên bước 0
  # "người xem từng ảnh" trong ke-hoach.json phải kiểm mục này bằng mắt.
  rui_ro: 'chu co the bi meo hoac sai chinh ta — PHAI kiem bang mat'

# ── LOGO ────────────────────────────────────────────────────────────────────
# Mô tả dưới đây lấy từ chính tệp SVG đang dùng trên web, sau khi RENDER RA VÀ
# NHÌN — không mô tả theo trí nhớ. Nguồn:
#   ficool-child/assets/img/ficool-logo-light-solid.svg   (bản nền tối, chữ trắng)
#   ficool-child/assets/img/ficool-logo-mark.svg          (bản nền sáng, chữ xanh)
#
# Chỉ ĐỔI MÀU cho hợp nền áo; cấu trúc và kiểu chữ giữ nguyên.
logo:
  cau_truc: >-
    Gồm ba phần xếp ngang: (1) huy hiệu hình vuông bo góc tròn lớn, bên trong là
    hai chữ "Fi" kiểu chữ có chân (serif), dấu chấm của chữ "i" được thay bằng
    một BÔNG TUYẾT sáu cánh; (2) bên phải huy hiệu là chữ "FICOOL" viết HOA toàn
    bộ, kiểu chữ có chân, giãn cách chữ rộng; (3) với bản in lưng, ngay dưới chữ
    FICOOL là dòng tagline nhỏ hơn.

  # Hai bản màu KHÁC NHAU, lấy từ hai tệp SVG khác nhau trên web:
  #   nguc: ficool-logo-mark.svg        — huy hiệu NỀN XANH, chữ "Fi" TRẮNG
  #   lung: ficool-logo-light-solid.svg — huy hiệu NỀN TRẮNG, chữ "Fi" xanh
  # Bản ngực nổi hơn trên áo tối vì huy hiệu xanh sáng tương phản với thân áo.
  ban_mau:
    nguc: >-
      Logo nằm trên một MIẾNG NHÃN NỀN TRẮNG hình chữ nhật bo góc, thêu/in lên
      ngực áo. Bên trong nhãn: huy hiệu vuông bo góc nền XANH #0077cc với hai
      chữ "Fi" và bông tuyết màu TRẮNG; bên phải huy hiệu là chữ "FICOOL" màu
      XANH #0077cc trên nền trắng của nhãn. KHÔNG có tagline. Miếng nhãn trắng
      này nổi bật rõ trên nền áo xanh đậm. Nhãn ÔM SÁT logo: viền trắng MỎNG
      và ĐỀU NHAU cả bốn phía, không dư khoảng trắng ở hai đầu. Tỉ lệ nhãn
      khoảng 3,8 rộng : 1 cao.
    lung: >-
      Huy hiệu nền TRẮNG, hai chữ "Fi" và bông tuyết màu xanh đậm cùng tông áo.
      Chữ "FICOOL" và dòng tagline bên phải màu TRẮNG.
  tagline: 'Sửa nhanh – Lạnh ngay'
  # ⚠️ aria-label trong SVG ghi "Sửa nhanh, lạnh ngay" nhưng bản VẼ RA là
  # "Sửa nhanh – Lạnh ngay" (gạch ngang, chữ L hoa). Bản vẽ ra mới là bản đúng.
  mau_tren_ao_toi:
    huy_hieu_nen: text-on-accent   # trắng
    huy_hieu_chu: than_ao          # theo màu áo, để chữ "khoét" ra từ huy hiệu
    chu_ficool: text-on-accent
    tagline: text-on-accent
  # ⚠️ Bốn lỗi ĐO ĐƯỢC ở lượt sinh đầu (09/09), phải nêu thẳng trong prompt:
  #   1. Model đặt HAI logo trên áo — một ở ngực trái, một ở ngực phải.
  #   2. Tagline sai chính tả: "Sôa nhanh" thay vì "Sửa nhanh" (mất dấu hỏi + ư).
  #   3. Bông tuyết trong huy hiệu thành một khối mờ, không ra sáu cánh.
  #   4. Thừa dấu chấm cuối: "FICOOL." thay vì "FICOOL".
  rang_buoc: >-
    CHỈ CÓ ĐÚNG MỘT logo trên toàn bộ trang phục, không lặp lại ở ngực bên kia,
    không có chữ trên tay áo, vai áo, cổ áo hay quần. Chữ "FICOOL" viết hoa toàn
    bộ, KHÔNG có dấu chấm hay dấu câu nào ở cuối. Bông tuyết thay dấu chấm chữ
    "i" phải thấy rõ SÁU CÁNH toả đều từ tâm, không phải một chấm tròn hay khối
    mờ. Tiếng Việt phải đúng dấu tuyệt đối.
  anh_tham_chieu:
    nguc: knowledge/brand/logo/logo-nguc-nhan-trang.png  # nhãn nền trắng, badge xanh, FICOOL xanh
    lung: knowledge/brand/logo/logo-lung-tagline.png    # đầy đủ, có tagline

# ── GÓC CHỤP khi sinh ảnh mẫu đồng phục ─────────────────────────────────────
goc_chup:
  - ma: truoc
    ten: 'Chính diện'
    canh: >-
      đứng thẳng chính diện, hai tay buông tự nhiên, toàn thân từ đầu tới giày,
      nhìn thẳng vào ống kính
    logo: nguc
    vi_tri_logo: >-
      ĐÚNG MỘT logo nhỏ trên ngực TRÁI áo (phía bên phải khung hình khi nhìn
      chính diện). Ngực PHẢI của áo để TRỐNG HOÀN TOÀN — không chữ, không huy
      hiệu, không thêu gì cả. Đây là chỗ model hay vẽ thừa một logo thứ hai
  - ma: sau
    ten: 'Từ phía sau'
    canh: >-
      đứng thẳng QUAY LƯNG hoàn toàn về phía ống kính, không thấy mặt, hai tay
      buông tự nhiên, toàn thân từ đầu tới giày
    logo: lung
    vi_tri_logo: >-
      logo đầy đủ kèm dòng tagline in LỚN giữa lưng áo, canh giữa, chiếm khoảng
      một nửa bề ngang lưng
